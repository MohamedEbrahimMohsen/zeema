# yaml-language-server: $schema=../schema/kind.schema.json
# Point-to-point message queue. Each message is consumed by one consumer.
# role distinguishes work queues from dead-letter, retry, offline-mailbox and crawl-frontier uses.
# deadLetterQueue and backoff are deliberately optional so rules can catch their absence.
schemaVersion: "1"
type: "kind"
id: "queue"
category: "messaging"
properties:
  delivery:
    type: "enum"
    values: ["at-most-once", "at-least-once", "exactly-once"]
    required: true
  ordering:
    type: "enum"
    values: ["none", "per-key", "global"]
    default: "none"
  deadLetterQueue:
    type: "boolean"
    default: false
  replay:
    type: "boolean"
    default: false
  retentionDays:
    type: "integer"
  role:
    type: "enum"
    values: ["work", "dlq", "retry", "offline-mailbox", "frontier"]
    default: "work"
  persistence:
    type: "boolean"
    default: true
  backoff:
    type: "enum"
    values: ["none", "fixed", "exponential", "exponential-jitter"]
  maxAttempts:
    type: "integer"
  instances:
    type: "integer"
  managed:
    type: "boolean"
    default: false
