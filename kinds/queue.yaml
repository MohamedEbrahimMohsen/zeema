# yaml-language-server: $schema=../schema/kind.schema.json
# Abstract kind: a point-to-point message queue.
# Each message is consumed by one consumer. Contrast with pubsub-topic (fan-out).
schemaVersion: "1"
type: "kind"
id: "queue"
category: "messaging"
properties:
  delivery:
    type: "enum"
    values: ["at-most-once", "at-least-once", "exactly-once"]
    required: true
  ordering:
    type: "enum"
    values: ["none", "per-key", "global"]
    default: "none"
  deadLetterQueue:
    type: "boolean"
    default: false
  replay:
    type: "boolean"
    default: false
  retentionDays:
    type: "integer"
