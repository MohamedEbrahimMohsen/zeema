# yaml-language-server: $schema=../schema/kind.schema.json
# A request-serving process you own (API, service, backend-for-frontend, chat server).
# stateless defaults true because most scaling rules assume it; set false for per-entity or hash-ring services.
schemaVersion: "1"
type: "kind"
id: "app-server"
category: "compute"
properties:
  stateless:
    type: "boolean"
    default: true
  instances:
    type: "integer"
  runtime:
    type: "string"
  autoscaling:
    type: "boolean"
    default: false
  criticality:
    type: "enum"
    values: ["low", "medium", "high"]
    default: "medium"
    advanced: true
  shardingStrategy:
    type: "enum"
    values: ["none", "consistent-hash", "range", "lookup"]
    default: "none"
    advanced: true
  instancePerEntity:
    type: "boolean"
    default: false
    advanced: true
  singleWriter:
    type: "boolean"
    default: false
    advanced: true
  ownsData:
    type: "boolean"
    default: true
    advanced: true
  managed:
    type: "boolean"
    default: false
