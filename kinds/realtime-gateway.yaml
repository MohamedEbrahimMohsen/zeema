# yaml-language-server: $schema=../schema/kind.schema.json
# Holds long-lived client connections and pushes events (WebSocket gateways, chat servers, long-poll and multicast feeds).
# stampedeGuard and drainOnScaleIn default false so reconnect and scale-in rules can fire.
schemaVersion: "1"
type: "kind"
id: "realtime-gateway"
category: "edge"
properties:
  protocol:
    type: "enum"
    values: ["websocket", "sse", "long-poll", "grpc-stream", "udp-multicast"]
    default: "websocket"
  stateful:
    type: "boolean"
    default: true
  autoscaling:
    type: "boolean"
    default: false
  channelAssignment:
    type: "enum"
    values: ["random", "hash", "sticky"]
    default: "random"
    advanced: true
  drainOnScaleIn:
    type: "boolean"
    default: false
    advanced: true
  stampedeGuard:
    type: "boolean"
    default: false
    advanced: true
  sequenceNumbers:
    type: "boolean"
    default: false
    advanced: true
  ackIntervalSeconds:
    type: "integer"
    advanced: true
  subscriptionsPerUser:
    type: "integer"
    advanced: true
  pushFallback:
    type: "boolean"
    default: false
    advanced: true
  managed:
    type: "boolean"
    default: false
