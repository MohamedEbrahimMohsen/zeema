<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:0}.chip{height:44px;border-radius:var(--rc);border:1px solid var(--line)}
.cap{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hex{font-family:var(--mono);font-size:10px;color:var(--muted)}</style></head>
<body><div style="display:flex;flex-direction:column;gap:7px;font-family:var(--mono);font-size:0.85em">
 <div>aws-sqs <span style="color:var(--muted)">· component slug</span></div>
 <div style="color:var(--err)">cache-missing-eviction-policy <span style="color:var(--muted)">· rule id</span></div>
 <div style="color:var(--muted)">enum · required &nbsp;<span style="color:var(--muted)">· type hint</span></div>
 <div>replay → <span style="color:var(--ink)">true</span> <span style="color:var(--muted)">· set value</span></div>
 <div>⌃⇧G <span style="color:var(--muted)">· shortcut</span></div></div></body></html>
