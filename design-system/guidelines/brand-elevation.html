<!-- @dsCard group="Brand" viewport="700x160" subtitle="Flat by rule. Only things floating above the canvas cast a shadow" name="Elevation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:0}.chip{height:44px;border-radius:var(--rc);border:1px solid var(--line)}
.cap{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hex{font-family:var(--mono);font-size:10px;color:var(--muted)}</style></head>
<body><div style="display:flex;gap:22px;align-items:flex-start">
 <div class="sw"><div style="width:150px;height:60px;border-radius:var(--rp);background:var(--panel);border:1px solid var(--line)"></div><span class="cap">panel</span><span class="hex">--shadow-none + 1px line</span></div>
 <div class="sw"><div style="width:150px;height:60px;border-radius:var(--rc);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-float)"></div><span class="cap">menu / popover</span><span class="hex">--shadow-float</span></div>
 <div class="sw"><div style="width:150px;height:60px;border-radius:var(--rp);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-dialog)"></div><span class="cap">dialog</span><span class="hex">--shadow-dialog</span></div>
 <div class="sw"><div style="width:120px;height:60px;border-radius:var(--rn);background:var(--t-green-fill);border:2px solid var(--accent)"></div><span class="cap">selected node</span><span class="hex">2px --accent</span></div>
 </div></body></html>
