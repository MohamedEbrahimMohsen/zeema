<!-- @dsCard group="Brand" viewport="700x170" subtitle="Three classes: full-colour vendor marks, masked kind glyphs, provider logos" name="Iconography" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:0}.chip{height:44px;border-radius:var(--rc);border:1px solid var(--line)}
.cap{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hex{font-family:var(--mono);font-size:10px;color:var(--muted)}</style></head>
<body><div style="display:flex;flex-direction:column;gap:12px">
 <div style="display:flex;gap:14px;align-items:center"><span class="cap" style="width:120px">component</span>
 <img src="../assets/icons/components/aws/sqs.svg" style="width:24px;height:24px"><img src="../assets/icons/components/aws/lambda.svg" style="width:24px;height:24px"><img src="../assets/icons/components/aws/dynamodb.svg" style="width:24px;height:24px"><img src="../assets/icons/components/aws/s3.svg" style="width:24px;height:24px"><img src="../assets/icons/components/azure/azure-cosmos-db.svg" style="width:24px;height:24px"><img src="../assets/icons/components/gcp/spanner.svg" style="width:24px;height:24px"><img src="../assets/icons/components/cloudflare/cloudflare-workers.svg" style="width:24px;height:24px"></div>
 <div style="display:flex;gap:14px;align-items:center"><span class="cap" style="width:120px">kind (masked)</span>
 <span style="width:24px;height:24px;display:block;background:var(--ink);mask:url(../assets/icons/kinds/queue.svg) center/contain no-repeat;-webkit-mask:url(../assets/icons/kinds/queue.svg) center/contain no-repeat"></span><span style="width:24px;height:24px;display:block;background:var(--ink);mask:url(../assets/icons/kinds/worker.svg) center/contain no-repeat;-webkit-mask:url(../assets/icons/kinds/worker.svg) center/contain no-repeat"></span><span style="width:24px;height:24px;display:block;background:var(--ink);mask:url(../assets/icons/kinds/cache.svg) center/contain no-repeat;-webkit-mask:url(../assets/icons/kinds/cache.svg) center/contain no-repeat"></span><span style="width:24px;height:24px;display:block;background:var(--ink);mask:url(../assets/icons/kinds/cdn.svg) center/contain no-repeat;-webkit-mask:url(../assets/icons/kinds/cdn.svg) center/contain no-repeat"></span><span style="width:24px;height:24px;display:block;background:var(--ink);mask:url(../assets/icons/kinds/sql-database.svg) center/contain no-repeat;-webkit-mask:url(../assets/icons/kinds/sql-database.svg) center/contain no-repeat"></span><span style="width:24px;height:24px;display:block;background:var(--ink);mask:url(../assets/icons/kinds/object-store.svg) center/contain no-repeat;-webkit-mask:url(../assets/icons/kinds/object-store.svg) center/contain no-repeat"></span><span style="width:24px;height:24px;display:block;background:var(--ink);mask:url(../assets/icons/kinds/stream.svg) center/contain no-repeat;-webkit-mask:url(../assets/icons/kinds/stream.svg) center/contain no-repeat"></span><span style="width:24px;height:24px;display:block;background:var(--ink);mask:url(../assets/icons/kinds/client.svg) center/contain no-repeat;-webkit-mask:url(../assets/icons/kinds/client.svg) center/contain no-repeat"></span></div>
 <div style="display:flex;gap:14px;align-items:center"><span class="cap" style="width:120px">provider</span>
 <img src="../assets/icons/providers/aws.svg" style="width:18px;height:18px;filter:var(--icon-filter)"><img src="../assets/icons/providers/azure.svg" style="width:18px;height:18px;filter:var(--icon-filter)"><img src="../assets/icons/providers/googlecloud.svg" style="width:18px;height:18px;filter:var(--icon-filter)"><img src="../assets/icons/providers/cloudflare.svg" style="width:18px;height:18px;filter:var(--icon-filter)"><img src="../assets/icons/providers/oci.svg" style="width:18px;height:18px;filter:var(--icon-filter)"><img src="../assets/icons/providers/github.svg" style="width:18px;height:18px;filter:var(--icon-filter)"><img src="../assets/icons/providers/stripe.svg" style="width:18px;height:18px;filter:var(--icon-filter)"></div>
 </div></body></html>
