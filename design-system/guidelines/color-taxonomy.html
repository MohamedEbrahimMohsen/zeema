<!-- @dsCard group="Colors" viewport="700x160" subtitle="Nine fill/line pairs — each one means a component category, not a mood" name="Canvas taxonomy" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:0}.chip{height:44px;border-radius:var(--rc);border:1px solid var(--line)}
.cap{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hex{font-family:var(--mono);font-size:10px;color:var(--muted)}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(9,1fr);gap:8px">
 <div class="sw"><div style="height:40px;border-radius:var(--rc);background:var(--t-blue-fill);border:1px solid var(--t-blue-line)"></div><span class="cap" style="font-size:10px">compute</span><span class="hex">blue</span></div><div class="sw"><div style="height:40px;border-radius:var(--rc);background:var(--t-teal-fill);border:1px solid var(--t-teal-line)"></div><span class="cap" style="font-size:10px">edge</span><span class="hex">teal</span></div><div class="sw"><div style="height:40px;border-radius:var(--rc);background:var(--t-amber-fill);border:1px solid var(--t-amber-line)"></div><span class="cap" style="font-size:10px">data</span><span class="hex">amber</span></div><div class="sw"><div style="height:40px;border-radius:var(--rc);background:var(--t-violet-fill);border:1px solid var(--t-violet-line)"></div><span class="cap" style="font-size:10px">ops</span><span class="hex">violet</span></div><div class="sw"><div style="height:40px;border-radius:var(--rc);background:var(--t-purple-fill);border:1px solid var(--t-purple-line)"></div><span class="cap" style="font-size:10px">security</span><span class="hex">purple</span></div><div class="sw"><div style="height:40px;border-radius:var(--rc);background:var(--t-green-fill);border:1px solid var(--t-green-line)"></div><span class="cap" style="font-size:10px">messaging</span><span class="hex">green</span></div><div class="sw"><div style="height:40px;border-radius:var(--rc);background:var(--t-rose-fill);border:1px solid var(--t-rose-line)"></div><span class="cap" style="font-size:10px">client</span><span class="hex">rose</span></div><div class="sw"><div style="height:40px;border-radius:var(--rc);background:var(--t-red-fill);border:1px solid var(--t-red-line)"></div><span class="cap" style="font-size:10px">external</span><span class="hex">red</span></div><div class="sw"><div style="height:40px;border-radius:var(--rc);background:var(--t-grey-fill);border:1px solid var(--t-grey-line)"></div><span class="cap" style="font-size:10px">unset</span><span class="hex">grey</span></div>
 </div></body></html>
