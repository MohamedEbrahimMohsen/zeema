<!-- @dsCard group="Colors" viewport="700x150" subtitle="bg, panel, ink, muted, line, frame — the whole neutral system" name="Surfaces & ink" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:0}.chip{height:44px;border-radius:var(--rc);border:1px solid var(--line)}
.cap{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hex{font-family:var(--mono);font-size:10px;color:var(--muted)}</style></head>
<body><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start">
 <div class="sw" style="flex:1"><div class="chip" style="background:var(--bg)"></div><span class="cap">bg</span><span class="hex">#fafaf8</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--panel)"></div><span class="cap">panel</span><span class="hex">#ffffff</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--ink)"></div><span class="cap">ink</span><span class="hex">#1b1b19</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--muted)"></div><span class="cap">muted</span><span class="hex">#6b6b66</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--line)"></div><span class="cap">line</span><span class="hex">#e4e4df</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--frame)"></div><span class="cap">frame</span><span class="hex">#b4b4ae</span></div>
 </div></body></html>
