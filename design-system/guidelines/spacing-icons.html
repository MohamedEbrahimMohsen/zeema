<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:0}.chip{height:44px;border-radius:var(--rc);border:1px solid var(--line)}
.cap{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hex{font-family:var(--mono);font-size:10px;color:var(--muted)}</style></head>
<body><div style="display:flex;gap:24px;align-items:flex-end">
 <div class="sw" style="align-items:center"><img src="../assets/icons/components/aws/lambda.svg" style="width:var(--icon-sm);height:var(--icon-sm)"><span class="cap">16px</span><span class="hex">--icon-sm</span></div><div class="sw" style="align-items:center"><img src="../assets/icons/components/aws/lambda.svg" style="width:var(--icon);height:var(--icon)"><span class="cap">24px</span><span class="hex">--icon</span></div><div class="sw" style="align-items:center"><img src="../assets/icons/components/aws/lambda.svg" style="width:var(--icon-lg);height:var(--icon-lg)"><span class="cap">32px</span><span class="hex">--icon-lg</span></div>
 </div></body></html>
