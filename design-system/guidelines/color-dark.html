<!-- @dsCard group="Colors" viewport="700x170" subtitle="Not an inversion — a second authored palette with its own accent" name="Dark theme" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:0}.chip{height:44px;border-radius:var(--rc);border:1px solid var(--line)}
.cap{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hex{font-family:var(--mono);font-size:10px;color:var(--muted)}</style></head>
<body><div data-theme="dark" style="background:var(--bg);padding:14px;border-radius:var(--rp)">
 <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start"><div class="sw" style="flex:1"><div class="chip" style="background:var(--panel)"></div><span class="cap">panel</span><span class="hex">#1b1b1f</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--ink)"></div><span class="cap">ink</span><span class="hex">#ececea</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--muted)"></div><span class="cap">muted</span><span class="hex">#a1a19c</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--line)"></div><span class="cap">line</span><span class="hex">#2c2c31</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--accent)"></div><span class="cap">accent</span><span class="hex">#98a6f2</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--err)"></div><span class="cap">err</span><span class="hex">#ef7d75</span></div></div>
 <div style="display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:10px">
 <div style="height:22px;border-radius:var(--rc);background:var(--t-blue-fill);border:1px solid var(--t-blue-line)"></div><div style="height:22px;border-radius:var(--rc);background:var(--t-teal-fill);border:1px solid var(--t-teal-line)"></div><div style="height:22px;border-radius:var(--rc);background:var(--t-amber-fill);border:1px solid var(--t-amber-line)"></div><div style="height:22px;border-radius:var(--rc);background:var(--t-violet-fill);border:1px solid var(--t-violet-line)"></div><div style="height:22px;border-radius:var(--rc);background:var(--t-purple-fill);border:1px solid var(--t-purple-line)"></div><div style="height:22px;border-radius:var(--rc);background:var(--t-green-fill);border:1px solid var(--t-green-line)"></div><div style="height:22px;border-radius:var(--rc);background:var(--t-rose-fill);border:1px solid var(--t-rose-line)"></div><div style="height:22px;border-radius:var(--rc);background:var(--t-red-fill);border:1px solid var(--t-red-line)"></div><div style="height:22px;border-radius:var(--rc);background:var(--t-grey-fill);border:1px solid var(--t-grey-line)"></div>
 </div></div></body></html>
