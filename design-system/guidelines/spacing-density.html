<!-- @dsCard group="Spacing" viewport="700x160" subtitle="A catalog row at --p 8px: 1.2 vertical pad, 1.8 horizontal, 1.5 gap" name="Density in use" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:0}.chip{height:44px;border-radius:var(--rc);border:1px solid var(--line)}
.cap{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hex{font-family:var(--mono);font-size:10px;color:var(--muted)}</style></head>
<body><div style="background:var(--panel);border:1px solid var(--line);border-radius:var(--rp);overflow:hidden">
 <div style="display:grid;grid-template-columns:var(--icon) 1fr auto;gap:var(--sp-1-5);align-items:center;padding:calc(var(--p)*1.2) calc(var(--p)*1.8);border-bottom:1px solid var(--line)"><span style="width:var(--icon);height:var(--icon);background:var(--t-grey-fill);border:1px solid var(--t-grey-line);border-radius:3px"></span><span style="display:flex;gap:8px;align-items:baseline"><b style="font-weight:500">SQS</b><span class="cap">sqs</span></span><span style="font-size:0.85em;color:var(--muted)">queue</span></div><div style="display:grid;grid-template-columns:var(--icon) 1fr auto;gap:var(--sp-1-5);align-items:center;padding:calc(var(--p)*1.2) calc(var(--p)*1.8);border-bottom:1px solid var(--line)"><span style="width:var(--icon);height:var(--icon);background:var(--t-grey-fill);border:1px solid var(--t-grey-line);border-radius:3px"></span><span style="display:flex;gap:8px;align-items:baseline"><b style="font-weight:500">Service Bus</b><span class="cap">azure-service-bus</span></span><span style="font-size:0.85em;color:var(--muted)">queue</span></div><div style="display:grid;grid-template-columns:var(--icon) 1fr auto;gap:var(--sp-1-5);align-items:center;padding:calc(var(--p)*1.2) calc(var(--p)*1.8);"><span style="width:var(--icon);height:var(--icon);background:var(--t-grey-fill);border:1px solid var(--t-grey-line);border-radius:3px"></span><span style="display:flex;gap:8px;align-items:baseline"><b style="font-weight:500">Pub/Sub</b><span class="cap">google-pubsub</span></span><span style="font-size:0.85em;color:var(--muted)">pubsub-topic</span></div>
 </div></body></html>
