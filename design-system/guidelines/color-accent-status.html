<!-- @dsCard group="Colors" viewport="700x150" subtitle="One indigo accent; three status hues that never appear as fills" name="Accent & status" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:0}.chip{height:44px;border-radius:var(--rc);border:1px solid var(--line)}
.cap{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hex{font-family:var(--mono);font-size:10px;color:var(--muted)}</style></head>
<body><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start">
 <div class="sw" style="flex:1"><div class="chip" style="background:var(--accent)"></div><span class="cap">accent</span><span class="hex">#3f4fc4</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--accent-ink)"></div><span class="cap">accent-ink</span><span class="hex">#ffffff</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--ok)"></div><span class="cap">ok</span><span class="hex">#2e7d4f</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--warn)"></div><span class="cap">warn</span><span class="hex">#b26a00</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--err)"></div><span class="cap">err</span><span class="hex">#c2382f</span></div>
 </div></body></html>
