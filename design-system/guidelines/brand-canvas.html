<!-- @dsCard group="Brand" viewport="700x170" subtitle="1px dot at 14% ink on a 24px pitch — graph paper that never fights a node" name="Canvas ground" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:0}.chip{height:44px;border-radius:var(--rc);border:1px solid var(--line)}
.cap{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hex{font-family:var(--mono);font-size:10px;color:var(--muted)}</style></head>
<body><div style="height:118px;border-radius:var(--rp);border:1px solid var(--line);background:radial-gradient(circle,var(--canvas-dot) 1px,transparent 1px) 0 0/var(--canvas-dot-gap) var(--canvas-dot-gap),var(--bg);position:relative">
 <div style="position:absolute;inset:10px;border:1px dashed var(--frame);border-radius:10px"></div>
 <span style="position:absolute;left:20px;top:13px;font-family:var(--mono);font-size:10px;color:var(--muted)">us-east-1 (region)</span>
 <div style="position:absolute;left:28px;top:38px;width:96px;height:62px;border-radius:var(--rn);background:var(--t-green-fill);border:2px solid var(--accent)"></div>
 <div style="position:absolute;left:132px;top:69px;width:48px;border-top:1.2px dashed var(--muted)"></div>
 <div style="position:absolute;left:188px;top:38px;width:96px;height:62px;border-radius:var(--rn);background:var(--t-blue-fill);border:1px solid var(--t-blue-line)"></div>
 <div style="position:absolute;left:292px;top:69px;width:48px;border-top:1.2px solid var(--muted)"></div>
 <div style="position:absolute;left:348px;top:38px;width:96px;height:62px;border-radius:var(--rn);background:var(--t-amber-fill);border:1px solid var(--t-amber-line)"></div>
 </div></body></html>
