<!-- @dsCard group="Type" viewport="700x180" subtitle="Every size is em-relative to --fs, so one token retunes the whole sheet" name="Size scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:0}.chip{height:44px;border-radius:var(--rc);border:1px solid var(--line)}
.cap{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hex{font-family:var(--mono);font-size:10px;color:var(--muted)}</style></head>
<body><div style="display:flex;flex-direction:column;gap:4px">
 <div style="display:flex;gap:14px;align-items:baseline"><span class="cap" style="width:110px">--fs-display</span><span style="font-size:1.75em">Simple Queue Service</span><span class="hex">1.75em</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="cap" style="width:110px">--fs-title</span><span style="font-size:1.35em">Simple Queue Service</span><span class="hex">1.35em</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="cap" style="width:110px">--fs-lead</span><span style="font-size:1.1em">Simple Queue Service</span><span class="hex">1.1em</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="cap" style="width:110px">--fs-body</span><span style="font-size:1em">Simple Queue Service</span><span class="hex">1em</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="cap" style="width:110px">--fs-small</span><span style="font-size:0.85em">Simple Queue Service</span><span class="hex">0.85em</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="cap" style="width:110px">--fs-meta</span><span style="font-size:0.75em">Simple Queue Service</span><span class="hex">0.75em</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="cap" style="width:110px">--fs-micro</span><span style="font-size:0.7em">Simple Queue Service</span><span class="hex">0.7em</span></div>
 </div></body></html>
