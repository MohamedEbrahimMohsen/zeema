<!-- @dsCard group="Brand" viewport="700x140" subtitle="Two radii with meaning: panels 8px soft, controls 4px crisp" name="Radius" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.sw{display:flex;flex-direction:column;gap:5px;min-width:0}.chip{height:44px;border-radius:var(--rc);border:1px solid var(--line)}
.cap{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hex{font-family:var(--mono);font-size:10px;color:var(--muted)}</style></head>
<body><div style="display:flex;gap:20px;align-items:flex-end">
 <div class="sw" style="align-items:flex-start"><div style="width:120px;height:48px;border-radius:var(--rp);background:var(--panel);border:1px solid var(--line)"></div><span class="cap">panel / card / canvas</span><span class="hex">--rp 8px</span></div><div class="sw" style="align-items:flex-start"><div style="width:120px;height:48px;border-radius:var(--rn);background:var(--panel);border:1px solid var(--line)"></div><span class="cap">canvas node</span><span class="hex">--rn 8px</span></div><div class="sw" style="align-items:flex-start"><div style="width:120px;height:48px;border-radius:var(--rc);background:var(--panel);border:1px solid var(--line)"></div><span class="cap">button / input / menu item</span><span class="hex">--rc 4px</span></div><div class="sw" style="align-items:flex-start"><div style="width:120px;height:48px;border-radius:var(--r-round);background:var(--panel);border:1px solid var(--line)"></div><span class="cap">tag</span><span class="hex">--r-round 999px</span></div>
 </div></body></html>
