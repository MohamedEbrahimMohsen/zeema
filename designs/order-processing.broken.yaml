# yaml-language-server: $schema=../schema/design.schema.json
# Reference architecture 1, broken variant: event-driven order processing.
#
# This file MUST trip:
#   - queue-missing-dlq          (orders-queue receives async traffic, no DLQ)
#   - pubsub-replay-required     (order-events is SNS, design requires replay)
#   - sync-chain-too-deep        (api -> order-service -> payment-service -> inventory-service -> orders-db)
# and MUST NOT trip:
#   - datastore-missing-backup   (orders-db declares backup and retention)
#   - datastore-single-region    (design does not require multi-region)
#   - cache-missing-eviction-policy (no cache in this design)
schemaVersion: "1"
type: "design"
id: "order-processing"

requirements:
  availability:
    multiRegion: false
    sla: "99.9"
  messaging:
    replay: true
  latency:
    p95Ms: 300

groups:
  - { id: "eu-west-1", kind: "region" }
  - { id: "core-vpc", kind: "vpc", parent: "eu-west-1" }

nodes:
  - id: "api"
    component: "aws-api-gateway"
    group: "core-vpc"
    props: { auth: "jwt", apiType: "http" }
    nfr: { rps: 800 }

  - id: "order-service"
    component: "container-service"
    group: "core-vpc"
    props: { orchestrator: "kubernetes", instances: 3, runtime: "dotnet-10" }

  - id: "payment-service"
    component: "container-service"
    group: "core-vpc"
    props: { orchestrator: "kubernetes", instances: 2, runtime: "dotnet-10" }

  - id: "inventory-service"
    component: "container-service"
    group: "core-vpc"
    props: { orchestrator: "kubernetes", instances: 2, runtime: "dotnet-10" }

  - id: "orders-queue"
    component: "kafka"
    group: "core-vpc"
    props: { partitions: 12, deadLetterQueue: false }

  - id: "fulfilment-worker"
    component: "container-service"
    group: "core-vpc"
    props: { orchestrator: "kubernetes", instances: 4, runtime: "dotnet-10" }

  - id: "orders-db"
    component: "postgres"
    group: "core-vpc"
    props: { version: "16", backupEnabled: true, backupRetentionDays: 30, encryptionAtRest: true }
    nfr: { consistency: "strong" }

  - id: "order-events"
    component: "sns"
    group: "core-vpc"

edges:
  - { from: "api", to: "order-service", protocol: "http", mode: "sync" }
  - { from: "order-service", to: "payment-service", protocol: "grpc", mode: "sync" }
  - { from: "payment-service", to: "inventory-service", protocol: "grpc", mode: "sync" }
  - { from: "inventory-service", to: "orders-db", protocol: "postgres", mode: "sync" }
  - { from: "order-service", to: "orders-queue", protocol: "kafka", mode: "async", delivery: "at-least-once" }
  - { from: "orders-queue", to: "fulfilment-worker", protocol: "kafka", mode: "async", delivery: "at-least-once" }
  - { from: "fulfilment-worker", to: "orders-db", protocol: "postgres", mode: "sync" }
  - { from: "fulfilment-worker", to: "order-events", protocol: "sns", mode: "async", delivery: "at-least-once" }
