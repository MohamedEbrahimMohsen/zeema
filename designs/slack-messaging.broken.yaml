# yaml-language-server: $schema=../schema/design.schema.json
# Reference architecture: Slack real-time messaging, broken variant. Same shape as
# slack-messaging.yaml but with the failure modes the Slack posts describe: gateways with
# no reconnect guard and no drain on scale-in, random channel placement under heavy-tail
# traffic, one worker pool draining two Redis queues, channel servers on a hash ring with
# no ring manager, and an admin server calling into the other cell.
#
# This file MUST trip:
#   - reconnect-stampede-without-guard          (gateway-server-a calls consul sync on connect, stampedeGuard false)
#   - shared-host-per-channel-without-isolation (gateway-server-a channelAssignment random, traffic.skew heavy-tail)
#   - stateful-websocket-scale-in-without-drain (gateway-server-a autoscaling true, drainOnScaleIn false)
#   - shared-worker-pool-across-queues          (job-workers consumes jobs-redis-high and jobs-redis-low, isolation.perQueue true)
#   - stateful-hash-ring-without-ring-manager   (channel-server-a and channel-server-b have no edge to a coordination service)
#   - cross-cell-call                           (admin-server-a -> channel-server-b sync, isolation.tenancy cell)
# and MUST NOT trip:
#   - stateful-node-without-zone-redundancy     (channel servers are inside a cell)
#   - queue-missing-dlq                         (both Redis queues declare deadLetterQueue true)
#   - single-writer-primary-at-peak-qps, read-replica-as-sole-scaling (messages-db is sharded)
#   - datastore-missing-backup                  (messages-db declares backup and retention)
#   - cache-missing-eviction-policy             (object-cache declares lru)
#   - credentials-without-rotation              (security.credentialRotationDays set)
#   - stateful-engine-pinned-to-single-zone     (consul is replicated)
schemaVersion: "1"
type: "design"
id: "slack-messaging"

requirements:
  availability:
    multiRegion: false
    sla: "99.99"
    zones: 2
  latency:
    p95Ms: 500
  traffic:
    skew: "heavy-tail"
    readWriteRatio: 20
  isolation:
    tenancy: "cell"
    perQueue: true
  security:
    credentialRotationDays: 90

groups:
  - { id: "us-east-1", kind: "region" }
  - { id: "us-east-1a", kind: "availability-zone", parent: "us-east-1" }
  - { id: "us-east-1b", kind: "availability-zone", parent: "us-east-1" }
  - { id: "cell-a", kind: "cell", parent: "us-east-1a" }
  - { id: "cell-b", kind: "cell", parent: "us-east-1b" }

nodes:
  - id: "slack-client"
    component: "mobile-app"
    props: { platform: "mobile", persistentConnection: true, localCache: true, resendPolicy: "retry" }

  - id: "edge-envoy"
    component: "envoy"
    group: "cell-a"
    props: { layer: "l7", hashing: "consistent", healthChecks: true }

  - id: "gateway-server-a"
    component: "websocket-gateway"
    group: "cell-a"
    props: { protocol: "websocket", stateful: true, autoscaling: true, channelAssignment: "random", drainOnScaleIn: false, stampedeGuard: false }

  - id: "channel-server-a"
    component: "vm-service"
    group: "cell-a"
    props: { stateless: false, shardingStrategy: "consistent-hash", instances: 40, runtime: "java-17", criticality: "high" }

  - id: "admin-server-a"
    component: "container-service"
    group: "cell-a"
    props: { orchestrator: "kubernetes", stateless: true, instances: 6, runtime: "java-17" }

  - id: "channel-server-b"
    component: "vm-service"
    group: "cell-b"
    props: { stateless: false, shardingStrategy: "consistent-hash", instances: 40, runtime: "java-17", criticality: "high" }

  - id: "webapp"
    component: "container-service"
    group: "cell-a"
    props: { orchestrator: "kubernetes", stateless: true, instances: 200, runtime: "hhvm", criticality: "high" }

  - id: "consul"
    component: "consul"
    group: "cell-a"
    props: { role: "discovery", consensus: "raft", replicated: true, nodes: 5 }

  - id: "messages-db"
    component: "mysql"
    group: "cell-a"
    props: { sharded: true, shardKey: "channel_id", replication: "async", backupEnabled: true, backupRetentionDays: 30, encryptionAtRest: true }
    nfr: { rps: 50000, consistency: "strong" }

  - id: "object-cache"
    component: "memcached"
    group: "cell-a"
    props: { evictionPolicy: "lru", ttlSeconds: 3600, hashing: "consistent" }

  - id: "job-log"
    component: "kafka"
    group: "cell-a"
    props: { partitions: 32, replicationFactor: 3, acks: "leader", retentionHours: 48 }

  - id: "jq-relay"
    component: "container-worker"
    group: "cell-a"
    props: { trigger: "stream", instances: 32, rateControl: "fixed", idempotent: true }

  - id: "jobs-redis-high"
    component: "redis-queue"
    group: "cell-a"
    props: { delivery: "at-least-once", role: "work", deadLetterQueue: true, persistence: false }

  - id: "jobs-redis-low"
    component: "redis-queue"
    group: "cell-a"
    props: { delivery: "at-least-once", role: "work", deadLetterQueue: true, persistence: false }

  - id: "job-workers"
    component: "container-worker"
    group: "cell-a"
    props: { trigger: "queue", instances: 100, concurrency: 8 }

edges:
  - { from: "slack-client", to: "edge-envoy", protocol: "wss", mode: "async", delivery: "at-least-once", label: "persistent WebSocket, TLS terminated at Envoy" }
  - { from: "edge-envoy", to: "gateway-server-a", protocol: "wss", mode: "async", delivery: "at-least-once", label: "subscriptions" }
  - { from: "edge-envoy", to: "webapp", protocol: "https", mode: "sync", timeoutMs: 5000, label: "send message" }
  - { from: "gateway-server-a", to: "consul", protocol: "http", mode: "sync", timeoutMs: 1000, label: "channel server discovery on every reconnect" }
  - { from: "gateway-server-a", to: "slack-client", protocol: "ws", mode: "async", delivery: "at-most-once", label: "push events" }
  - { from: "webapp", to: "messages-db", protocol: "mysql", mode: "sync", label: "persist message via Vitess" }
  - { from: "webapp", to: "object-cache", protocol: "memcached", mode: "sync" }
  - { from: "webapp", to: "admin-server-a", protocol: "grpc", mode: "sync", timeoutMs: 500 }
  - { from: "admin-server-a", to: "channel-server-a", protocol: "grpc", mode: "sync", timeoutMs: 300, label: "hash ring lookup" }
  - { from: "admin-server-a", to: "channel-server-b", protocol: "grpc", mode: "sync", timeoutMs: 300, label: "cross-cell call into the other AZ" }
  - { from: "admin-server-a", to: "consul", protocol: "http", mode: "sync", label: "discovery" }
  - { from: "channel-server-a", to: "gateway-server-a", protocol: "grpc", mode: "async", delivery: "at-most-once", label: "fan-out to subscribed gateways" }
  - { from: "webapp", to: "job-log", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "enqueue job via Kafkagate" }
  - { from: "job-log", to: "jq-relay", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "offset advanced after Redis write" }
  - { from: "jq-relay", to: "consul", protocol: "http", mode: "sync", label: "one relay per partition lock" }
  - { from: "jq-relay", to: "jobs-redis-high", protocol: "redis", mode: "sync" }
  - { from: "jq-relay", to: "jobs-redis-low", protocol: "redis", mode: "sync" }
  - { from: "jobs-redis-high", to: "job-workers", protocol: "redis", mode: "async", delivery: "at-least-once" }
  - { from: "jobs-redis-low", to: "job-workers", protocol: "redis", mode: "async", delivery: "at-least-once" }
  - { from: "job-workers", to: "messages-db", protocol: "mysql", mode: "sync" }
