# yaml-language-server: $schema=../schema/design.schema.json
# Reference architecture 3, clean variant: home timeline with hybrid fan-out driven by
# change data capture, a rebuildable Redis timeline cache and an asynchronously fed search index.
#
# Fixes relative to twitter-timeline.broken.yaml:
#   - write-api only persists the tweet; tweet-cdc reads the MySQL binlog into tweet-events (Kafka)
#   - fanout-daemon consumes tweet-events, uses a hybrid strategy with a 10000-follower threshold,
#     and is the worker that writes home-timeline-cache (a rebuild path)
#   - timeline-service reads social-graph to merge celebrity tweets at read time and reconstructs
#     cold timelines from tweet-store, so the cache is not the primary store
#   - ingester consumes tweet-events and indexes search-index asynchronously
# This file MUST trip no rule.
schemaVersion: "1"
type: "design"
id: "twitter-timeline"

requirements:
  availability:
    multiRegion: false
    sla: "99.9"
  latency:
    p95Ms: 200
  freshness:
    maxSeconds: 5
  traffic:
    readWriteRatio: 100
    skew: "heavy-tail"
  consistency:
    model: "ap"
  security:
    credentialRotationDays: 90

groups:
  - { id: "dc-east", kind: "region" }
  - { id: "edge", kind: "trust-zone", parent: "dc-east" }
  - { id: "core", kind: "trust-zone", parent: "dc-east" }

nodes:
  - id: "web-client"
    component: "web-browser"
    props: { platform: "web" }

  - id: "tfe"
    component: "envoy-gateway"
    group: "edge"
    props: { auth: "oauth2", rateLimiting: true, tls: true }
    nfr: { rps: 306000 }

  - id: "write-api"
    component: "container-service"
    group: "core"
    props: { orchestrator: "kubernetes", instances: 40, criticality: "high" }
    nfr: { rps: 6000 }

  - id: "timeline-service"
    component: "container-service"
    group: "core"
    props: { orchestrator: "kubernetes", instances: 200, autoscaling: true, criticality: "high" }
    nfr: { rps: 300000 }

  - id: "search-service"
    component: "container-service"
    group: "core"
    props: { orchestrator: "kubernetes", instances: 30 }
    nfr: { rps: 20000 }

  - id: "tweet-store"
    component: "mysql"
    group: "core"
    props: { sharded: true, shardKey: "tweet_id", idEncodesShard: true, replication: "async", backupEnabled: true, backupRetentionDays: 30, encryptionAtRest: true }
    nfr: { rps: 60000, consistency: "eventual" }

  - id: "tweet-cdc"
    component: "debezium"
    group: "core"
    props: { mode: "log-based", ordered: true }

  - id: "tweet-events"
    component: "kafka"
    group: "core"
    props: { partitions: 64, replicationFactor: 3, minInsyncReplicas: 2, acks: "all", retentionHours: 168, idempotentProducer: true }

  - id: "fanout-daemon"
    component: "fanout-daemon"
    group: "core"
    props: { trigger: "stream", instances: 50, idempotent: true, fanoutStrategy: "hybrid", fanoutThreshold: 10000, concurrency: 4000 }

  - id: "social-graph"
    component: "tao"
    group: "core"
    props: { masterPerShard: true }
    nfr: { rps: 80000 }

  - id: "home-timeline-cache"
    component: "redis"
    group: "core"
    props: { cluster: true, evictionPolicy: "lru", ttlSeconds: 2592000, structure: "sorted-set", materialised: true, usedAsPrimaryStore: false, persistence: false, replication: "multi-az" }
    nfr: { rps: 310000 }

  - id: "tweet-cache"
    component: "memcached"
    group: "core"
    props: { evictionPolicy: "lru", ttlSeconds: 3600, hashing: "consistent" }
    nfr: { rps: 250000 }

  - id: "ingester"
    component: "container-worker"
    group: "core"
    props: { trigger: "stream", instances: 20, idempotent: true }

  - id: "search-index"
    component: "elasticsearch"
    group: "core"
    props: { structure: "inverted", shardingStrategy: "time", indexing: "async", replicas: 2 }
    nfr: { rps: 26000 }

  - id: "firehose"
    component: "websocket-gateway"
    group: "edge"
    props: { protocol: "websocket", stateful: true, channelAssignment: "hash", drainOnScaleIn: true }

edges:
  - { from: "web-client", to: "tfe", protocol: "https", mode: "sync" }
  - { from: "tfe", to: "write-api", protocol: "http", mode: "sync", label: "post tweet" }
  - { from: "tfe", to: "timeline-service", protocol: "http", mode: "sync", label: "read home timeline" }
  - { from: "tfe", to: "search-service", protocol: "http", mode: "sync", label: "search" }
  - { from: "write-api", to: "tweet-store", protocol: "mysql", mode: "sync", idempotent: true, label: "persist first" }
  - { from: "tweet-store", to: "tweet-cdc", protocol: "mysql-binlog", mode: "async", delivery: "at-least-once" }
  - { from: "tweet-cdc", to: "tweet-events", protocol: "kafka", mode: "async", delivery: "at-least-once" }
  - { from: "tweet-events", to: "fanout-daemon", protocol: "kafka", mode: "async", delivery: "at-least-once" }
  - { from: "fanout-daemon", to: "social-graph", protocol: "thrift", mode: "sync", timeoutMs: 500, retryPolicy: "exponential-jitter", circuitBreaker: true, label: "list followers" }
  - { from: "fanout-daemon", to: "home-timeline-cache", protocol: "redis", mode: "sync", batched: true, label: "push tweet id to followers under threshold" }
  - { from: "tweet-events", to: "ingester", protocol: "kafka", mode: "async", delivery: "at-least-once" }
  - { from: "ingester", to: "search-index", protocol: "http", mode: "async", delivery: "at-least-once", batched: true, label: "index" }
  - { from: "tweet-events", to: "firehose", protocol: "kafka", mode: "async", delivery: "at-most-once" }
  - { from: "timeline-service", to: "home-timeline-cache", protocol: "redis", mode: "sync", timeoutMs: 50, label: "timeline ids, fastest of 3 rings" }
  - { from: "timeline-service", to: "social-graph", protocol: "thrift", mode: "sync", timeoutMs: 50, label: "followed accounts over threshold" }
  - { from: "timeline-service", to: "tweet-cache", protocol: "memcached", mode: "sync", label: "hydrate" }
  - { from: "timeline-service", to: "tweet-store", protocol: "mysql", mode: "sync", fallback: "degraded", label: "hydrate on miss, reconstruct cold timeline" }
  - { from: "search-service", to: "search-index", protocol: "http", mode: "sync", timeoutMs: 200, label: "scatter-gather" }
