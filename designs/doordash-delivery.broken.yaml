# yaml-language-server: $schema=../schema/design.schema.json
# Reference architecture: DoorDash order and delivery platform, broken variant. Same shape
# as doordash-delivery.yaml but as it stood before the migrations: one single-writer Aurora
# primary at 1.6M QPS with async replicas as the only scaling, a stateful monolith pinned to
# one zone, BFF retries into services with no circuit breaker or load shedding, merchant
# calls inline with no workflow fallback, and Flink event-time windows with no watermark.
#
# This file MUST trip:
#   - single-writer-primary-at-peak-qps           (orders-db multiWriter false, sharded false, rps 1600000)
#   - read-replica-as-sole-scaling                (orders-db replication async, sharded false, distributed false, rps 1600000)
#   - stateful-node-without-zone-redundancy       (legacy-monolith stateless false, only in us-west-2a, not in a cell)
#   - retry-without-adaptive-shedding             (bff -> order-service retryPolicy exponential, no circuitBreaker, no rate limiter in front)
#   - external-call-inline-without-durable-path   (delivery-service calls merchant-pos sync, no queue or workflow engine attached)
#   - windowed-aggregation-without-watermark      (event-processor windowing event-time, no watermarkSeconds)
# and MUST NOT trip:
#   - datastore-missing-backup                    (orders-db declares backup and retention)
#   - datastore-single-region                     (multiRegion false)
#   - sync-chain-too-deep                         (bff -> order-service -> orders-db is 2 hops)
#   - cache-missing-eviction-policy               (feature-store declares lru)
#   - read-heavy-path-without-cache               (feature-store is a cache node)
#   - credentials-without-rotation                (security.credentialRotationDays set)
#   - money-mutation-without-idempotency-key      (correctness.exactlyOnceEffect not set)
#   - object-store-single-zone-with-durability-target (events-buffer spans 3 zones)
schemaVersion: "1"
type: "design"
id: "doordash-delivery"

requirements:
  availability:
    multiRegion: false
    sla: "99.99"
    zones: 2
  latency:
    p95Ms: 500
  messaging:
    replay: true
  data:
    lossDetection: true
  traffic:
    peakMultiplier: 3
  isolation:
    tenancy: "shared"
  freshness:
    maxSeconds: 300
  security:
    credentialRotationDays: 90

groups:
  - { id: "us-west-2", kind: "region" }
  - { id: "us-west-2a", kind: "availability-zone", parent: "us-west-2" }
  - { id: "us-west-2b", kind: "availability-zone", parent: "us-west-2" }

nodes:
  - id: "consumer-app"
    component: "mobile-app"
    props: { platform: "mobile", resendPolicy: "retry" }

  - id: "bff"
    component: "kong"
    group: "us-west-2"
    props: { auth: "jwt", rateLimiting: true, protocol: "http" }
    nfr: { rps: 30000 }

  - id: "order-service"
    component: "container-service"
    group: "us-west-2"
    props: { orchestrator: "kubernetes", stateless: true, autoscaling: true, instances: 40, runtime: "kotlin-jvm", criticality: "high" }

  - id: "delivery-service"
    component: "container-service"
    group: "us-west-2"
    props: { orchestrator: "kubernetes", stateless: true, autoscaling: true, instances: 30, runtime: "kotlin-jvm", criticality: "high" }

  - id: "legacy-monolith"
    component: "vm-service"
    group: "us-west-2a"
    props: { stateless: false, instances: 8, runtime: "python-2", criticality: "medium" }

  - id: "orders-db"
    component: "aurora"
    group: "us-west-2a"
    props: { multiWriter: false, distributed: false, sharded: false, replication: "async", replicaFanout: 15, backupEnabled: true, backupRetentionDays: 30, encryptionAtRest: true }
    nfr: { rps: 1600000, consistency: "strong" }

  - id: "merchant-pos"
    component: "supplier-api"
    props: { idempotent: true, callbackStyle: "webhook", handlesMoney: false }

  - id: "order-events"
    component: "kafka"
    group: "us-west-2"
    props: { partitions: 64, replicationFactor: 3, minInsyncReplicas: 2, acks: "all", retentionHours: 168, schemaEnforced: true }

  - id: "event-processor"
    component: "flink"
    group: "us-west-2"
    props: { windowing: "event-time", checkpointIntervalSeconds: 30, exactlyOnce: true, stateBackend: "rocksdb", instances: 12 }

  - id: "events-buffer"
    component: "s3"
    group: "us-west-2"
    props: { zones: 3, replication: "erasure-coded", versioning: true, encryptionAtRest: true, durabilityNines: 11 }

  - id: "warehouse"
    component: "snowflake"
    group: "us-west-2"
    props: { realtime: false, format: "columnar", managed: true }

  - id: "feature-store"
    component: "redis"
    group: "us-west-2"
    props: { cluster: true, evictionPolicy: "lru", ttlSeconds: 3600, replication: "multi-az" }

  - id: "dispatch-model"
    component: "tensorflow-serving"
    group: "us-west-2"
    props: { training: "batch", inputs: "live", instances: 10 }

edges:
  - { from: "consumer-app", to: "bff", protocol: "https", mode: "sync", timeoutMs: 5000 }
  - { from: "bff", to: "order-service", protocol: "grpc", mode: "sync", timeoutMs: 2000, retryPolicy: "exponential", label: "retries with no breaker" }
  - { from: "bff", to: "legacy-monolith", protocol: "https", mode: "sync", timeoutMs: 3000 }
  - { from: "order-service", to: "orders-db", protocol: "postgres", mode: "sync", timeoutMs: 1000 }
  - { from: "legacy-monolith", to: "orders-db", protocol: "postgres", mode: "sync", timeoutMs: 1000, label: "via pgbouncer, single writer" }
  - { from: "order-service", to: "order-events", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "order created" }
  - { from: "order-events", to: "delivery-service", protocol: "kafka", mode: "async", delivery: "at-least-once" }
  - { from: "delivery-service", to: "orders-db", protocol: "postgres", mode: "sync", timeoutMs: 1000 }
  - { from: "delivery-service", to: "merchant-pos", protocol: "https", mode: "sync", timeoutMs: 3000, idempotent: true, label: "transmit order to merchant, inline" }
  - { from: "delivery-service", to: "dispatch-model", protocol: "grpc", mode: "sync", timeoutMs: 500 }
  - { from: "dispatch-model", to: "feature-store", protocol: "redis", mode: "sync", timeoutMs: 50 }
  - { from: "order-events", to: "event-processor", protocol: "kafka", mode: "async", delivery: "at-least-once" }
  - { from: "event-processor", to: "events-buffer", protocol: "s3", mode: "async", delivery: "at-least-once", batched: true, label: "Parquet buffer" }
  - { from: "event-processor", to: "feature-store", protocol: "redis", mode: "async", delivery: "at-least-once", label: "materialised features" }
  - { from: "events-buffer", to: "warehouse", protocol: "snowpipe", mode: "async", delivery: "at-least-once", batched: true }
