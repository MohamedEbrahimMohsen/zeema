  note: >-
    Union of Figure 11-4 (feed publishing, page 171) and Figure 11-7 (news feed retrieval,
    page 174): one system, two flows. Each distinct box is counted once, so the caches, the
    databases and the web tier, drawn in both figures, are one node each. The two figures draw
    21 distinct arrows; five of them are drawn at the "User" boundary and are modelled once per
    client inside that boundary (Web browser and Mobile app), which makes 26 edges.
