gaps:
  - "An arrow drawn at a boundary has no single node to attach to: the five arrows at the User boundary (to DNS, to CDN, the two requests to the Load balancer, the response from the Web servers) were modelled once per client inside the group, which is why 21 drawn arrows become 26 edges."
  - "Arrows that enter or leave the unlabelled dashed web tier had to be attributed to the Web servers node; the format cannot make a group an edge endpoint."
  - "No engine-less generic graph store exists in the catalogue, so the unbranded Graph DB box had to be mapped to a named product (neo4j, confidence assumed)."
  - "The design cannot say that a node belongs to one flow rather than the other: the union of Figure 11-4 and Figure 11-7 is one flat design, and the publishing and retrieval paths are only distinguishable from the edge labels."
  - "The five-layer cache architecture of Figure 11-8 (News Feed, Content, Social Graph, Action, Counters) is a decomposition of the cache tier that the architecture figures do not draw; there is no way to attach it to the cache nodes."
