gaps:
  - "Politeness (one page at a time per host, a delay between two downloads) has no expression: the queue kind has ordering and the worker kind has rateControl, but neither says per-host serialisation with a delay."
  - "Content Storage is described as disk with popular content kept in memory; object-store has tier hot/warm/cold and no memory tier, so the split is not encoded."
  - "The URL frontier's internal structure (front queues for priority, back queues for politeness, prioritizer, queue routers and selectors, mapping table, worker threads) is a separate figure and cannot be expressed inside one node; it is left out."
  - "The chapter states 1 billion pages a month, 500 KB per page, 500 TB a month and 30 PB over five years; requirements has no path for stored volume or retention, so only traffic.peakMultiplier could be encoded."
  - "Freshness (periodic recrawl) is stated without a number, and freshness.maxSeconds needs one."
