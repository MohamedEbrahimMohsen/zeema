gaps:
  - "The chapter states volumes (10 million push notifications, 1 million SMS and 5 million emails per day) but requirements has no throughput or daily-volume path, so the numbers are recorded in notes.md only."
  - "The chapter promises notifications are never lost but may be delayed or re-ordered; requirements has no 'no message loss' path (durability.* is about stored objects, messaging.replay is a different promise), so the promise is not encoded."
  - "The chapter states delivery is explicitly not exactly-once and a dedupe check on the event ID reduces duplicates; a requirement can say exactlyOnce is required but not that it is deliberately not required, and dedupe by event id has no place on a node or an edge."
  - "Figure 10-14 draws the deep-dive additions (analytics, notification template, notification log) on the iOS lane only. The format has no way to say 'this also applies to the other three lanes', so they hang off the iOS workers exactly as drawn."
  - "The two figures share eight boxes and eight arrows; nothing in mapping.yaml records which figure an item came from, so that is carried in the source transcription instead."
