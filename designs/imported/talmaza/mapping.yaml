gaps:
  - "Six dashed frames (Secretless Layer, Monitoring & Alerts Tools, Storage, DB & Cache, AI, Secret Store) are label-only visual clusters. No group kind means 'drawn together, no network, failure or ownership meaning', and using system would claim a boundary the diagram does not. They are ignored; the members stay in the VNet and the cluster names survive only as layout notes."
  - "Every drawn arrow ends on a frame at one end or both (ten of them end on one of the visual clusters). from and to must be node ids, so each end was attached to the nearest box, which turns 'the identity layer reaches the storage tier' into single node pairs such as Managed Identity -> File Storage."
  - "The Cloudflare Tunnel is one double-headed arrow modelled as two directed edges; nothing links them as one persistent outbound-dialled connection."
  - "The AKS cluster is drawn as a boundary, so it is a system group, and the fact on its title, private API server, has no place: groups carry no properties and there is no azure-aks node to hold it."
  - "Microsoft Azure is a cloud, not a region; the source names no region. region is the closest kind and overstates what is known."
  - "The drawn replicas (2+ cloudflared pods, two web pods, two api pods) are separate nodes; nothing says they are instances of one workload."
  - "Free text that states policy (NSG 'no public IP, no public LB', NetworkPolicy 'cloudflared -> frontend / api only', DNS resolving only to Cloudflare anycast) has no property or requirement path; it lives in notes.md and the layout notes."
  - "External Systems is an empty boundary. The format allows it, but the layout derives frames from members, so it is not drawn."
