gaps:
  - "Trie DB and Trie Cache are the same two boxes in figures 13-9 and 13-11; mapping.yaml has no way to record that a node comes from two figures, so the union is recorded in source/search-autocomplete.md and the figures are listed in source.figures."
  - "The User boundary is a client-side grouping of devices, not a network or trust boundary; trust-zone is the closest group kind in v1."
  - "Trie DB is described as either a document store or a key-value store; a design cannot express 'either model', so the nosql-store default (key-value) stands."
  - "The offline pipeline arrows carry no sync/async marking in the figure; all five are modelled async because they are weekly batch flows, and mode is required."
  - "The chapter's 100 ms promise is an absolute response-time budget, not a percentile; it is recorded as latency.p95Ms because v1 has no absolute latency path."
