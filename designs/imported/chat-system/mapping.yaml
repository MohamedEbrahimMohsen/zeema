nodes:
  - { source: "User", node: "user", component: "user-device", confidence: "close", note: "rounded box holding a laptop icon and a phone icon; the generic user-device component, platform multi" }
  - { source: "Load balancer", node: "load-balancer", component: "load-balancer-tier", confidence: "close", note: "unbranded load balancer icon, no product named." }
  - { source: "Chat servers", node: "chat-servers", component: "container-service", confidence: "close", note: "purple server cluster inside the Real time service boundary; no product named. stateless: false because the high-level design section states the chat service is the only stateful service, each client holding a persistent connection to a chat server." }
  - { source: "Presence servers", node: "presence-servers", component: "container-service", confidence: "close", note: "purple server cluster inside the Real time service boundary; no product named. Left stateless because the chapter names the chat service as the only stateful service." }
  - { source: "Notification servers", node: "notification-servers", component: "container-service", confidence: "close", note: "green server cluster; the paragraph after the figure says notification servers send push notifications. No product named and no third-party push provider drawn." }
  - { source: "API servers", node: "api-servers", component: "container-service", confidence: "close", note: "green server cluster handling login, signup and profile changes; no product named." }
  - { source: "KV store", node: "kv-store", component: "nosql-store", confidence: "close", note: "left-hand of the three cylinder boxes inside the unlabelled dashed boundary. The chapter recommends key-value stores, which is the nosql-store default model, so no props." }
  - { source: "KV store", node: "kv-store-2", component: "nosql-store", confidence: "close", note: "centre of the three cylinder boxes; a separate box with the same caption, so a separate node." }
  - { source: "KV store", node: "kv-store-3", component: "nosql-store", confidence: "close", note: "right-hand of the three cylinder boxes; a separate box with the same caption, so a separate node." }
