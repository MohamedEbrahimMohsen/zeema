gaps:
  - "No group kind for a consistent-hash ring (or a cluster of peer nodes generally): the ring is the whole store, its members are peers rather than a containment hierarchy. Mapped to `system`."
  - "No way to say that n0-n7 are members of one clustered store rather than nine independent stores; cluster-level properties (replicationFactor, quorum sizes, conflict resolution) had to be repeated on every node."
  - "No way to mark an edge as the response to another edge. The four dashed reply arrows of Figure 6-17 are ordinary directed edges, so the design shows eight edges where the picture shows four request/response pairs."
  - "No way to express node-internal structure. Figures 6-18 to 6-21 draw the inside of a single node (client API, conflict resolution, replication, failure detection, storage engine; commit log, memory cache, SSTable, bloom filter). Those are sub-parts of one node, not placeable nodes, and the format has neither node-internal parts nor a 'storage engine internals' property, so they were left out entirely."
  - "The nosql-database `replication` enum has no leaderless value. Dynamo-style quorum replication with no leader was recorded as `multi-region-multi-leader`, which is the closest of `single-region`, `multi-region-single-leader`, `multi-region-multi-leader`."
  - "No property records the failure-detection or anti-entropy mechanism (gossip, hinted handoff, sloppy quorum, Merkle trees), which are the chapter's main design decisions for these nodes."
