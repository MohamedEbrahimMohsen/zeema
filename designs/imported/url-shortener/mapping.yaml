gaps:
  - "The estimation section states 1160 writes per second and 11,600 reads per second for the whole design, but requirements has no throughput path; only the 10:1 ratio (traffic.readWriteRatio) could be expressed."
  - "The chapter states 365 billion records and 365 TB over 10 years; the format has no capacity or retention requirement path."
  - "Figure 8-7 is a flow chart: an ordered procedure with a branch. The design format has no way to express a sequence of steps or a conditional path, so the write path survives only as the Web servers -> Database edge, with the ordering recorded in notes.md."
  - "No protocol string exists for an unnamed cache tier (the catalogue's cache protocols are product names such as redis and memcached); the edge uses \"cache\"."
  - "The design is the union of two figures. mapping.yaml can list source.figures but each node, edge and ignored entry has to say in its note which figure it came from; there is no per-item figure field."
