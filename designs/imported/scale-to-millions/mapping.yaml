  - { source: "Shard 1", reason: "shard label drawn on a cylinder inside the Databases box, not a box of its own" }
  - { source: "Shard 2", reason: "shard label drawn on a cylinder inside the Databases box, not a box of its own" }
  - { source: "Shard ...", reason: "an ellipsis standing for the remaining shards inside the Databases box" }
  - { source: "CACHE (x3)", reason: "identical stacked tiles inside the Caches box, the drawing device for several cache servers in one tier" }
  - { source: "www.mysite.com / api.mysite.com", reason: "arrow labels, carried on the edges" }
  - { source: "1 / 2 (circled)", reason: "footnote markers keyed to the numbered notes in the running text" }
  - { source: "Figure 1-23", reason: "figure caption" }
unmapped: []
gaps:
  - "Edges can only join nodes. Four of the eleven arrows in Figure 1-23 start or end on a boundary (User -> DNS, User -> CDN, Load balancer -> DC1, Tools -> DC1) and had to be re-pointed at a representative node inside that boundary."
  - "A tier drawn as one box that contains several instances (three shard cylinders in Databases, three CACHE tiles in Caches, the server stacks in Web servers and Workers) has no expression: the design has one node per tier and the multiplicity survives only as props.sharded on the databases node."
  - "There is no generic automation / CI component in the default provider, so the Automation box in the Tools group had to be mapped to observability-stack."
  - "A group has no kind for a client-side boundary such as User; trust-zone is the closest of the seven."
