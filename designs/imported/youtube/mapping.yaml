nodes:
  - { source: "User", node: "user", component: "user-device", confidence: "close", note: "Figure 14-4; rounded box holding a TV, a laptop and a phone icon. Figures 14-3 and 14-7 label the same box \"Client\". The chapter supports mobile apps, web browsers and smart TV in one box; the catalogue has no multi-platform client, so the web client stands for it. No product named." }
  - { source: "Load balancer", node: "load-balancer", component: "load-balancer-tier", confidence: "close", note: "Figures 14-4, 14-5 and 14-6; unbranded load balancer icon, \"distributes requests among API servers\". No product named." }
  - { source: "API servers", node: "api-servers", component: "container-service", confidence: "close", note: "Figures 14-3, 14-4, 14-5 and 14-6; stateless server cluster that carries everything except video streaming. No product named." }
  - { source: "Metadata Cache", node: "metadata-cache", component: "cache-cluster", confidence: "close", note: "Figures 14-4, 14-5 and 14-6; caches video metadata and user objects. No product named." }
  - { source: "Metadata DB", node: "metadata-db", component: "relational-database", confidence: "close", note: "Figures 14-4, 14-5 and 14-6; \"sharded and replicated\" per the text under Figure 14-4, master/slave in the error-handling playbook, so relational. No engine named." }
  - { source: "Original storage", node: "original-storage", component: "blob-store", confidence: "close", note: "Figures 14-4 and 14-5; \"a blob storage system is used to store original videos\". No product named." }
  - { source: "Transcoding servers", node: "transcoding-servers", component: "container-service", confidence: "close", note: "Figures 14-4 and 14-5; the server cluster that transcodes. Figure 14-10 is its inside. No product named; the catalogue's media-transcoder components are all named products (ffmpeg, MediaConvert...), so the generic service box is used." }
  - { source: "Transcoded storage", node: "transcoded-storage", component: "blob-store", confidence: "close", note: "Figures 14-4 and 14-5; \"a blob storage that stores transcoded video files\". No product named." }
  - { source: "CDN", node: "cdn", component: "content-delivery-network", confidence: "close", note: "Figures 14-3, 14-4, 14-5 and 14-7; videos are cached in and streamed from the CDN. CloudFront appears only in the cost estimation, not as a box label, so the generic CDN." }
  - { source: "Completion queue", node: "completion-queue", component: "message-queue", confidence: "close", note: "Figures 14-4 and 14-5; \"a message queue that stores information about video transcoding completion events\". No broker named." }
  - { source: "Completion handler", node: "completion-handler", component: "container-worker", confidence: "close", note: "Figures 14-4 and 14-5; \"a list of workers that pull event data from the completion queue\". No product named." }
  - { source: "Preprocessor", node: "preprocessor", component: "container-service", confidence: "close", note: "Figure 14-10; splits video by GOP, generates the DAG and caches segments. No product named." }
  - { source: "DAG scheduler", node: "dag-scheduler", component: "container-service", confidence: "close", note: "Figure 14-10; splits the DAG into stages of tasks. No product named; the catalogue's workflow-engine components are all named products, so the generic service box." }
  - { source: "Resource manager", node: "resource-manager", component: "container-service", confidence: "close", note: "Figure 14-10; holds the task, worker and running queues and the task scheduler (Figure 14-17 zooms into it). Its internals are inside this one box, so one node. No product named." }
  - { source: "Task workers", node: "task-workers", component: "container-worker", confidence: "close", note: "Figure 14-10; run the tasks defined in the DAG (Figure 14-19 zooms into the watermark, encoder, thumbnail and merger workers). No product named." }
  - { source: "Temporary storage", node: "temporary-storage", component: "blob-store", confidence: "close", note: "Figure 14-10; \"multiple storage systems\" - metadata cached in memory, video and audio in blob storage. One box, mapped to the storage the chapter names for the video and audio data." }
  - { source: "Encoded video", node: "encoded-video", component: "blob-store", confidence: "assumed", note: "Figure 14-10; the final output of the encoding pipeline (example: funny_720p.mp4). The box is the output artefact rather than a server; an object store is the closest runtime element the catalogue has." }
