gaps:
  - "The client box covers a web browser, a mobile app and a smart TV in one drawing; the client kind has a single `platform` enum, and the catalogue has no multi-platform client component, so the box is mapped to web-browser alone."
  - "The Temporary storage box is described as several storage systems at once (metadata cached in memory, video and audio in blob storage). One box has to become one node, so the in-memory half of it is lost."
  - "The Encoded video box is an output artefact (funny_720p.mp4), not a runtime element; the format has no artefact node, so it is an object store with confidence assumed."
  - "The chapter states 5 million DAU, 5 videos watched per user per day, 150 TB of new video per day and about $150,000 per day of CDN cost. requirements has no throughput, capacity or cost path, so none of those numbers could be expressed."
  - "The interviewer states that encryption is required. There is no requirement path for encryption (only security.certificateRotationAutomated and security.credentialRotationDays), and no figure states which store is encrypted, so it is recorded here only."
  - "The Metadata DB is stated to be replicated but the flavour is not; replication is an enum with no `unspecified` value, so async was chosen from the master/slave promotion in the error-handling playbook."
  - "No protocol string exists for an unnamed cache tier (the catalogue's cache protocols are product names such as redis and memcached); those edges use \"cache\"."
  - "Figure 14-10 is the inside of the Transcoding servers box, but a node cannot contain other nodes and the book draws no arrow between the two pictures, so the transcoding pipeline stands beside the upload flow with no edge joining them."
  - "The design is the union of six figures. mapping.yaml can list source.figures but each node, edge and ignored entry has to say in its note which figure it came from; there is no per-item figure field."
