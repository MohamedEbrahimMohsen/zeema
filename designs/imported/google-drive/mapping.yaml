gaps:
  - "One client box stands for two platforms (browser and mobile app). The client kind's platform property takes a single value and a box may not be split, so the node is web-browser only."
  - "The metadata database states replication without a mode; the replication enum forces a choice, so async is assumed rather than left unstated."
  - "A long poll is a held request: the client calls and waits, but the payload is a server-initiated event. Edge mode is sync or async with nothing in between, so the drawn direction (client -> service) is modelled sync."
  - "The upload completion callback from cloud storage is an object-store event delivered as an HTTP request; there is no edge mode for 'event delivered synchronously', so it is sync."
