# yaml-language-server: $schema=../schema/design.schema.json
# Reference architecture 2, clean variant: read-heavy web application with a real
# multi-region posture.
#
# Fixes relative to multi-region-web.broken.yaml:
#   - session-cache declares lru eviction with a 30 minute TTL, and a second cache exists in eu
#   - catalog-db is backed up with 35 days retention and replicates asynchronously
#   - catalog-db-replica in eu-west-1 serves European reads
# This file MUST trip no rule.
schemaVersion: "1"
type: "design"
id: "multi-region-web"

requirements:
  availability:
    multiRegion: true
    sla: "99.95"
  latency:
    p95Ms: 200

groups:
  - { id: "us-east-1", kind: "region" }
  - { id: "eu-west-1", kind: "region" }

nodes:
  - id: "api-us"
    component: "aws-api-gateway"
    group: "us-east-1"
    props: { auth: "oauth2" }
    nfr: { rps: 5000 }

  - id: "web-app-us"
    component: "container-service"
    group: "us-east-1"
    props: { orchestrator: "ecs", instances: 6 }

  - id: "session-cache-us"
    component: "redis"
    group: "us-east-1"
    props: { cluster: true, evictionPolicy: "lru", ttlSeconds: 1800 }

  - id: "catalog-db"
    component: "postgres"
    group: "us-east-1"
    props: { version: "16", backupEnabled: true, backupRetentionDays: 35, replication: "async", encryptionAtRest: true }
    nfr: { consistency: "strong" }

  - id: "api-eu"
    component: "aws-api-gateway"
    group: "eu-west-1"
    props: { auth: "oauth2" }
    nfr: { rps: 2000 }

  - id: "web-app-eu"
    component: "container-service"
    group: "eu-west-1"
    props: { orchestrator: "ecs", instances: 3 }

  - id: "session-cache-eu"
    component: "redis"
    group: "eu-west-1"
    props: { cluster: true, evictionPolicy: "lru", ttlSeconds: 1800 }

  - id: "catalog-db-replica"
    component: "postgres"
    group: "eu-west-1"
    props: { version: "16", backupEnabled: true, backupRetentionDays: 35, replication: "async", replicaOf: "catalog-db", encryptionAtRest: true }
    nfr: { consistency: "eventual" }

edges:
  - { from: "api-us", to: "web-app-us", protocol: "http", mode: "sync" }
  - { from: "web-app-us", to: "session-cache-us", protocol: "redis", mode: "sync" }
  - { from: "web-app-us", to: "catalog-db", protocol: "postgres", mode: "sync" }
  - { from: "api-eu", to: "web-app-eu", protocol: "http", mode: "sync" }
  - { from: "web-app-eu", to: "session-cache-eu", protocol: "redis", mode: "sync" }
  - { from: "web-app-eu", to: "catalog-db-replica", protocol: "postgres", mode: "sync", label: "reads" }
  - { from: "web-app-eu", to: "catalog-db", protocol: "postgres", mode: "sync", label: "writes, cross-region" }
  - { from: "catalog-db", to: "catalog-db-replica", protocol: "postgres-streaming", mode: "async", delivery: "at-least-once", label: "replication" }
