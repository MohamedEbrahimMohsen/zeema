# yaml-language-server: $schema=../../../schema/design.schema.json
# Reference architecture 2, broken variant: read-heavy web application promising a
# multi-region SLA, but with every stateful component in one region.
#
# This file MUST trip:
#   - cache-missing-eviction-policy  (session-cache declares no evictionPolicy)
#   - datastore-single-region        (catalog-db is in one region, replication none, multiRegion required)
#   - datastore-missing-backup       (catalog-db has backupEnabled false)
# and MUST NOT trip:
#   - queue-missing-dlq, pubsub-replay-required (no messaging in this design)
#   - sync-chain-too-deep            (longest sync chain from either gateway is 2 hops)
schemaVersion: "1"
type: "design"
id: "multi-region-web"

requirements:
  security:
    credentialRotationDays: 90
  availability:
    multiRegion: true
    sla: "99.95"
  latency:
    p95Ms: 200

groups:
  - { id: "us-east-1", kind: "region" }
  - { id: "eu-west-1", kind: "region" }

nodes:
  - id: "api-us"
    component: "aws-api-gateway"
    group: "us-east-1"
    props: { auth: "oauth2" }
    nfr: { rps: 5000 }

  - id: "web-app-us"
    component: "container-service"
    group: "us-east-1"
    props: { orchestrator: "ecs", instances: 6 }

  - id: "session-cache"
    component: "redis"
    group: "us-east-1"
    props: { cluster: true }

  - id: "catalog-db"
    component: "postgres"
    group: "us-east-1"
    props: { version: "16", backupEnabled: false, replication: "none" }
    nfr: { consistency: "strong" }

  - id: "api-eu"
    component: "aws-api-gateway"
    group: "eu-west-1"
    props: { auth: "oauth2" }
    nfr: { rps: 2000 }

  - id: "web-app-eu"
    component: "container-service"
    group: "eu-west-1"
    props: { orchestrator: "ecs", instances: 3 }

edges:
  - { from: "api-us", to: "web-app-us", protocol: "http", mode: "sync" }
  - { from: "web-app-us", to: "session-cache", protocol: "redis", mode: "sync" }
  - { from: "web-app-us", to: "catalog-db", protocol: "postgres", mode: "sync" }
  - { from: "api-eu", to: "web-app-eu", protocol: "http", mode: "sync" }
  - { from: "web-app-eu", to: "session-cache", protocol: "redis", mode: "sync", label: "cross-region" }
  - { from: "web-app-eu", to: "catalog-db", protocol: "postgres", mode: "sync", label: "cross-region" }
