# yaml-language-server: $schema=../../../schema/design.schema.json
# Reference architecture: DoorDash order and delivery platform (Kotlin gRPC services,
# CockroachDB, Kafka/Iguazu, Flink, Cadence fallback, Aperture load shedding), clean
# variant. Stateless services span both zones (group is the region); the legacy monolith
# runs in an autoscaling group across both zones.
#
# Fixes relative to doordash-delivery.broken.yaml:
#   - orders-db is CockroachDB: multi-writer, sharded, distributed
#   - the legacy monolith spans both availability zones instead of being pinned to one
#   - the BFF retry carries a circuit breaker and Aperture limits the services it retries into
#   - delivery-service hands failed merchant calls to Temporal instead of calling inline only
#   - Flink declares a 60 s watermark for its event-time windows
# This file MUST trip no rule.
schemaVersion: "1"
type: "design"
id: "doordash-delivery"

requirements:
  availability:
    multiRegion: false
    sla: "99.99"
    zones: 2
  latency:
    p95Ms: 500
  messaging:
    replay: true
  data:
    lossDetection: true
  traffic:
    peakMultiplier: 3
  isolation:
    tenancy: "shared"
  freshness:
    maxSeconds: 300
  security:
    credentialRotationDays: 90

groups:
  - { id: "us-west-2", kind: "region" }
  - { id: "us-west-2a", kind: "availability-zone", parent: "us-west-2" }
  - { id: "us-west-2b", kind: "availability-zone", parent: "us-west-2" }

nodes:
  - id: "consumer-app"
    component: "mobile-app"
    props: { platform: "mobile", resendPolicy: "retry" }

  - id: "bff"
    component: "kong"
    group: "us-west-2"
    props: { auth: "jwt", rateLimiting: true, protocol: "http", concurrencyLimit: true }
    nfr: { rps: 30000 }

  - id: "order-service"
    component: "container-service"
    group: "us-west-2"
    props: { orchestrator: "kubernetes", stateless: true, autoscaling: true, instances: 40, runtime: "kotlin-jvm", criticality: "high" }

  - id: "delivery-service"
    component: "container-service"
    group: "us-west-2"
    props: { orchestrator: "kubernetes", stateless: true, autoscaling: true, instances: 30, runtime: "kotlin-jvm", criticality: "high" }

  - id: "legacy-monolith"
    component: "vm-service"
    group: "us-west-2"
    props: { stateless: false, instances: 8, runtime: "python-2", criticality: "medium" }

  - id: "aperture"
    component: "envoy-ratelimit"
    group: "us-west-2"
    props: { algorithm: "adaptive", scope: "global", placement: "sidecar", distributed: true, failMode: "open" }

  - id: "orders-db"
    component: "cockroachdb"
    group: "us-west-2"
    props: { multiWriter: true, distributed: true, sharded: true, shardKey: "order_id", replication: "sync", backupEnabled: true, backupRetentionDays: 30, encryptionAtRest: true, concurrencyControl: "optimistic" }
    nfr: { rps: 60000, consistency: "strong" }

  - id: "merchant-pos"
    component: "supplier-api"
    props: { idempotent: true, callbackStyle: "webhook", handlesMoney: false }

  - id: "order-events"
    component: "kafka"
    group: "us-west-2"
    props: { partitions: 64, replicationFactor: 3, minInsyncReplicas: 2, acks: "all", retentionHours: 168, schemaEnforced: true }

  - id: "delivery-workflows"
    component: "temporal"
    group: "us-west-2"
    props: { durable: true, pattern: "saga", stepsIdempotent: true, compensation: true }

  - id: "event-processor"
    component: "flink"
    group: "us-west-2"
    props: { windowing: "event-time", watermarkSeconds: 60, checkpointIntervalSeconds: 30, exactlyOnce: true, stateBackend: "rocksdb", lateDataPolicy: "sideline", instances: 12 }

  - id: "events-buffer"
    component: "s3"
    group: "us-west-2"
    props: { zones: 3, replication: "erasure-coded", versioning: true, encryptionAtRest: true, durabilityNines: 11 }

  - id: "warehouse"
    component: "snowflake"
    group: "us-west-2"
    props: { realtime: false, format: "columnar", managed: true }

  - id: "feature-store"
    component: "redis"
    group: "us-west-2"
    props: { cluster: true, evictionPolicy: "lru", ttlSeconds: 3600, replication: "multi-az" }

  - id: "dispatch-model"
    component: "tensorflow-serving"
    group: "us-west-2"
    props: { training: "batch", inputs: "live", instances: 10 }

edges:
  - { from: "consumer-app", to: "bff", protocol: "https", mode: "sync", timeoutMs: 5000 }
  - { from: "bff", to: "order-service", protocol: "grpc", mode: "sync", timeoutMs: 2000, retryPolicy: "exponential-jitter", circuitBreaker: true }
  - { from: "bff", to: "legacy-monolith", protocol: "https", mode: "sync", timeoutMs: 3000, circuitBreaker: true }
  - { from: "aperture", to: "order-service", protocol: "grpc", mode: "sync", label: "adaptive concurrency limits" }
  - { from: "aperture", to: "delivery-service", protocol: "grpc", mode: "sync", label: "adaptive concurrency limits" }
  - { from: "order-service", to: "orders-db", protocol: "postgres", mode: "sync", timeoutMs: 1000 }
  - { from: "legacy-monolith", to: "orders-db", protocol: "postgres", mode: "sync", timeoutMs: 1000 }
  - { from: "order-service", to: "order-events", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "order created" }
  - { from: "order-events", to: "delivery-service", protocol: "kafka", mode: "async", delivery: "at-least-once" }
  - { from: "delivery-service", to: "orders-db", protocol: "postgres", mode: "sync", timeoutMs: 1000 }
  - { from: "delivery-service", to: "merchant-pos", protocol: "https", mode: "sync", timeoutMs: 3000, idempotent: true, circuitBreaker: true, label: "transmit order to merchant" }
  - { from: "delivery-service", to: "delivery-workflows", protocol: "grpc", mode: "async", delivery: "at-least-once", idempotent: true, label: "start fallback workflow on failure" }
  - { from: "delivery-workflows", to: "delivery-service", protocol: "grpc", mode: "async", delivery: "at-least-once", idempotent: true, label: "retried activities" }
  - { from: "delivery-service", to: "dispatch-model", protocol: "grpc", mode: "sync", timeoutMs: 500, fallback: "degraded" }
  - { from: "dispatch-model", to: "feature-store", protocol: "redis", mode: "sync", timeoutMs: 50 }
  - { from: "order-events", to: "event-processor", protocol: "kafka", mode: "async", delivery: "at-least-once" }
  - { from: "event-processor", to: "events-buffer", protocol: "s3", mode: "async", delivery: "at-least-once", batched: true, label: "Parquet buffer independent of Kafka retention" }
  - { from: "event-processor", to: "feature-store", protocol: "redis", mode: "async", delivery: "at-least-once", label: "materialised features" }
  - { from: "events-buffer", to: "warehouse", protocol: "snowpipe", mode: "async", delivery: "at-least-once", batched: true }
