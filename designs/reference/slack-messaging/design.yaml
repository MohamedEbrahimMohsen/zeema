# yaml-language-server: $schema=../../../schema/design.schema.json
# Reference architecture: Slack real-time messaging (channel servers on a consistent hash
# ring, gateway servers holding WebSockets, Vitess/MySQL, Kafka-fronted Redis job queue,
# AZ-scoped cells), clean variant.
# Cell-b is drawn abbreviated (admin and channel servers only); in production each cell
# holds the full stack. Client edges are modelled async: they ride the persistent
# WebSocket and the cell rule applies to server-side calls.
#
# Fixes relative to slack-messaging.broken.yaml:
#   - gateway servers have a reconnect stampede guard and drain on scale-in
#   - channels are assigned to gateway hosts by hash, not at random
#   - each Redis job queue has its own worker pool
#   - channel servers are attached to a ring manager (Helix) that owns the hash ring
#   - no synchronous call leaves its cell
# This file MUST trip no rule.
schemaVersion: "1"
type: "design"
id: "slack-messaging"

requirements:
  availability:
    multiRegion: false
    sla: "99.99"
    zones: 2
  latency:
    p95Ms: 500
  traffic:
    skew: "heavy-tail"
    readWriteRatio: 20
  isolation:
    tenancy: "cell"
    perQueue: true
  security:
    credentialRotationDays: 90

groups:
  - { id: "us-east-1", kind: "region" }
  - { id: "us-east-1a", kind: "availability-zone", parent: "us-east-1" }
  - { id: "us-east-1b", kind: "availability-zone", parent: "us-east-1" }
  - { id: "cell-a", kind: "cell", parent: "us-east-1a" }
  - { id: "cell-b", kind: "cell", parent: "us-east-1b" }

nodes:
  - id: "slack-client"
    component: "mobile-app"
    props: { platform: "mobile", persistentConnection: true, localCache: true, resendPolicy: "retry" }

  - id: "edge-envoy"
    component: "envoy"
    group: "cell-a"
    props: { layer: "l7", hashing: "consistent", healthChecks: true }

  - id: "gateway-server-a"
    component: "websocket-gateway"
    group: "cell-a"
    props: { protocol: "websocket", stateful: true, autoscaling: true, channelAssignment: "hash", drainOnScaleIn: true, stampedeGuard: true, sequenceNumbers: true }

  - id: "channel-server-a"
    component: "vm-service"
    group: "cell-a"
    props: { stateless: false, shardingStrategy: "consistent-hash", instances: 40, runtime: "java-17", criticality: "high" }

  - id: "admin-server-a"
    component: "container-service"
    group: "cell-a"
    props: { orchestrator: "kubernetes", stateless: true, instances: 6, runtime: "java-17" }

  - id: "channel-server-b"
    component: "vm-service"
    group: "cell-b"
    props: { stateless: false, shardingStrategy: "consistent-hash", instances: 40, runtime: "java-17", criticality: "high" }

  - id: "admin-server-b"
    component: "container-service"
    group: "cell-b"
    props: { orchestrator: "kubernetes", stateless: true, instances: 6, runtime: "java-17" }

  - id: "webapp"
    component: "container-service"
    group: "cell-a"
    props: { orchestrator: "kubernetes", stateless: true, instances: 200, runtime: "hhvm", criticality: "high" }

  - id: "consul"
    component: "consul"
    group: "cell-a"
    props: { role: "discovery", consensus: "raft", replicated: true, nodes: 5 }

  - id: "ring-manager"
    component: "apache-helix"
    group: "cell-a"
    props: { role: "sharding", consensus: "zab", replicated: true, nodes: 3 }

  - id: "messages-db"
    component: "mysql"
    group: "cell-a"
    props: { sharded: true, shardKey: "channel_id", replication: "async", backupEnabled: true, backupRetentionDays: 30, encryptionAtRest: true }
    nfr: { rps: 50000, consistency: "strong" }

  - id: "object-cache"
    component: "memcached"
    group: "cell-a"
    props: { evictionPolicy: "lru", ttlSeconds: 3600, hashing: "consistent" }

  - id: "job-log"
    component: "kafka"
    group: "cell-a"
    props: { partitions: 32, replicationFactor: 3, acks: "leader", retentionHours: 48 }

  - id: "jq-relay"
    component: "container-worker"
    group: "cell-a"
    props: { trigger: "stream", instances: 32, rateControl: "fixed", idempotent: true }

  - id: "jobs-redis"
    component: "redis-queue"
    group: "cell-a"
    props: { delivery: "at-least-once", role: "work", deadLetterQueue: true, persistence: false }

  - id: "job-workers"
    component: "container-worker"
    group: "cell-a"
    props: { trigger: "queue", instances: 100, concurrency: 8 }

edges:
  - { from: "slack-client", to: "edge-envoy", protocol: "wss", mode: "async", delivery: "at-least-once", label: "persistent WebSocket, TLS terminated at Envoy" }
  - { from: "edge-envoy", to: "gateway-server-a", protocol: "wss", mode: "async", delivery: "at-least-once", label: "subscriptions" }
  - { from: "edge-envoy", to: "webapp", protocol: "https", mode: "sync", timeoutMs: 5000, label: "send message" }
  - { from: "gateway-server-a", to: "consul", protocol: "http", mode: "sync", timeoutMs: 1000, label: "channel server discovery on connect" }
  - { from: "gateway-server-a", to: "slack-client", protocol: "ws", mode: "async", delivery: "at-most-once", label: "push events" }
  - { from: "webapp", to: "messages-db", protocol: "mysql", mode: "sync", label: "persist message via Vitess" }
  - { from: "webapp", to: "object-cache", protocol: "memcached", mode: "sync" }
  - { from: "webapp", to: "admin-server-a", protocol: "grpc", mode: "sync", timeoutMs: 500 }
  - { from: "admin-server-a", to: "channel-server-a", protocol: "grpc", mode: "sync", timeoutMs: 300, label: "hash ring lookup, same cell" }
  - { from: "admin-server-b", to: "channel-server-b", protocol: "grpc", mode: "sync", timeoutMs: 300, label: "hash ring lookup, same cell" }
  - { from: "admin-server-a", to: "consul", protocol: "http", mode: "sync", label: "discovery" }
  - { from: "channel-server-a", to: "gateway-server-a", protocol: "grpc", mode: "async", delivery: "at-most-once", label: "fan-out to subscribed gateways" }
  - { from: "channel-server-a", to: "ring-manager", protocol: "zookeeper", mode: "async", delivery: "at-least-once", label: "ring membership watch" }
  - { from: "channel-server-b", to: "ring-manager", protocol: "zookeeper", mode: "async", delivery: "at-least-once", label: "ring membership watch" }
  - { from: "ring-manager", to: "consul", protocol: "http", mode: "sync", label: "publish ring config" }
  - { from: "webapp", to: "job-log", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "enqueue job via Kafkagate" }
  - { from: "job-log", to: "jq-relay", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "offset advanced after Redis write" }
  - { from: "jq-relay", to: "consul", protocol: "http", mode: "sync", label: "one relay per partition lock" }
  - { from: "jq-relay", to: "jobs-redis", protocol: "redis", mode: "sync", label: "rate limited push" }
  - { from: "jobs-redis", to: "job-workers", protocol: "redis", mode: "async", delivery: "at-least-once" }
  - { from: "job-workers", to: "messages-db", protocol: "mysql", mode: "sync" }
