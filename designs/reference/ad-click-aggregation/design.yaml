# yaml-language-server: $schema=../../../schema/design.schema.json
# Reference architecture: billing-grade ad click event aggregation — clicks flow through Kafka
# into event-time windowed stream jobs that deduplicate, attribute and emit minute aggregates
# transactionally into a real-time OLAP store, with raw events kept for replay and reconciliation.
#
# Fixes relative to ad-click-aggregation.broken.yaml:
#   - aggregate-job declares a watermark for its event-time tumbling windows, so late clicks
#     have a defined fate instead of closing a billed window early
#   - dedup-state declares a ttl eviction policy, so the duplicate-suppression keyspace is bounded
#   - order-store stays single-region (the source states no cross-region replication) instead of
#     taking writes in both regions with no conflict policy
#   - log-ingest does not retry into the broker it is already saturating; the client carries the
#     resend policy and the ingest hop is a plain at-least-once produce
#   - security.credentialRotationDays is declared for the stores that hold billable event data
# This file MUST trip no rule.
schemaVersion: "1"
type: "design"
id: "ad-click-aggregation"

requirements:
  availability:
    multiRegion: true
    regions: 2
  messaging:
    exactlyOnce: true
    replay: true
    orderingScope: "partition"
  correctness:
    exactlyOnceEffect: true
    billingGrade: true
    reproducible: true
  data:
    reconciliation: true
  freshness:
    maxSeconds: 240
  traffic:
    skew: "heavy-tail"
  security:
    credentialRotationDays: 90

groups:
  - { id: "region-a", kind: "region", label: "Region A" }
  - { id: "region-b", kind: "region", label: "Region B" }
  - { id: "ingestion", kind: "trust-zone", parent: "region-a", label: "Ingestion" }
  - { id: "streaming", kind: "trust-zone", parent: "region-a", label: "Streaming" }
  - { id: "serving", kind: "trust-zone", parent: "region-a", label: "Serving and batch" }

nodes:
  - id: "ad-client"
    component: "mobile-app"
    label: "Mobile and web clients"
    props: { platform: "multi", resendPolicy: "retry", localCache: true }

  - id: "log-ingest"
    component: "container-worker"
    label: "Log watcher"
    group: "ingestion"
    props: { trigger: "stream", idempotent: false }

  - id: "raw-click-events"
    component: "kafka"
    label: "Kafka (raw ad events)"
    group: "ingestion"
    props: { delivery: "at-least-once", ordering: "per-key", retentionHours: 72 }

  - id: "order-events"
    component: "kafka"
    label: "Kafka (order data)"
    group: "ingestion"
    props: { delivery: "at-least-once", ordering: "per-key", retentionHours: 72 }

  - id: "map-job"
    component: "flink"
    label: "Map nodes"
    group: "streaming"
    props: { windowing: "none" }

  - id: "aggregate-job"
    component: "flink"
    label: "Aggregation job"
    group: "streaming"
    props: { windowing: "event-time", watermarkSeconds: 60, checkpointIntervalSeconds: 120, exactlyOnce: true, lateDataPolicy: "shift" }

  - id: "reduce-job"
    component: "flink"
    label: "Reduce nodes"
    group: "streaming"
    props: { windowing: "none", exactlyOnce: true, checkpointIntervalSeconds: 120 }

  - id: "dedup-state"
    component: "cache-cluster"
    label: "Dedup state (keyed by event id)"
    group: "streaming"
    props: { evictionPolicy: "ttl", structure: "key-value", invalidation: "ttl" }

  - id: "attribution-job"
    component: "flink"
    label: "Attribution job"
    group: "streaming"
    props: { windowing: "none", exactlyOnce: true, checkpointIntervalSeconds: 120 }

  - id: "order-store"
    component: "nosql-store"
    label: "Docstore"
    group: "streaming"
    props: { model: "document", consistency: "strong", replication: "single-region" }

  - id: "aggregate-events"
    component: "kafka"
    label: "Kafka (aggregates, transactional)"
    group: "streaming"
    props: { delivery: "exactly-once", transactions: true, idempotentProducer: true, retentionHours: 72 }

  - id: "checkpoint-store"
    component: "blob-store"
    label: "Checkpoint store"
    group: "streaming"

  - id: "aggregate-events-b"
    component: "kafka"
    label: "Kafka (Region B aggregates)"
    group: "region-b"
    props: { delivery: "exactly-once", transactions: true, idempotentProducer: true, retentionHours: 72 }

  - id: "union-load-job"
    component: "flink"
    label: "Union and load job"
    group: "streaming"
    props: { windowing: "none", exactlyOnce: true, checkpointIntervalSeconds: 120 }

  - id: "olap-store"
    component: "pinot"
    label: "Pinot (minute aggregates)"
    group: "serving"
    props: { realtime: true, upsert: true, streamIngestion: true, format: "columnar" }

  - id: "warehouse"
    component: "hive"
    label: "Hive"
    group: "serving"
    props: { realtime: false }

  - id: "raw-event-store"
    component: "cassandra"
    label: "Raw event store"
    group: "serving"
    props: { model: "wide-column", consistency: "tunable", replication: "single-region", compactionStrategy: "time-window" }

  - id: "query-service"
    component: "container-service"
    label: "Query service"
    group: "serving"
    props: { stateless: true, criticality: "high", ownsData: false }

  - id: "reconciliation-job"
    component: "spark-job"
    label: "Reconciliation batch job"
    group: "serving"
    props: { trigger: "schedule", schedule: "nightly", idempotent: true }

  - id: "alerting"
    component: "observability-stack"
    label: "Pacing and downtime alerting"
    group: "serving"
    props: { signal: "alerts", collectorMode: "push", alertGrouping: true }

edges:
  - { from: "ad-client", to: "log-ingest", protocol: "https", mode: "async", delivery: "at-least-once", label: "click and impression beacons (duplicates possible)" }
  - { from: "log-ingest", to: "raw-click-events", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "publish raw ad events" }
  - { from: "raw-click-events", to: "map-job", protocol: "kafka", mode: "async", delivery: "at-least-once" }
  - { from: "map-job", to: "aggregate-job", protocol: "shuffle", mode: "async", label: "repartition by ad id" }
  - { from: "aggregate-job", to: "dedup-state", protocol: "keyed-state", mode: "sync", idempotent: true, label: "drop duplicate event ids" }
  - { from: "aggregate-job", to: "order-store", protocol: "docstore", mode: "sync", idempotent: true, label: "store ad events for attribution" }
  - { from: "aggregate-job", to: "reduce-job", protocol: "shuffle", mode: "async", label: "partial minute counts and top-N heaps" }
  - { from: "reduce-job", to: "aggregate-events", protocol: "kafka", mode: "async", delivery: "exactly-once", idempotent: true, label: "transactional write, 2PC on checkpoint" }
  - { from: "order-events", to: "attribution-job", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "order data" }
  - { from: "attribution-job", to: "order-store", protocol: "docstore", mode: "sync", idempotent: true, label: "match ad events for order" }
  - { from: "attribution-job", to: "aggregate-events", protocol: "kafka", mode: "async", delivery: "exactly-once", idempotent: true, label: "attributed conversions, deterministic record UUID" }
  - { from: "aggregate-events", to: "union-load-job", protocol: "kafka", mode: "async", delivery: "exactly-once", label: "read_committed" }
  - { from: "aggregate-events-b", to: "union-load-job", protocol: "kafka", mode: "async", delivery: "exactly-once", label: "Region B output" }
  - { from: "union-load-job", to: "olap-store", protocol: "pinot", mode: "sync", idempotent: true, label: "upsert by record UUID" }
  - { from: "union-load-job", to: "warehouse", protocol: "hive", mode: "async", delivery: "at-least-once", idempotent: true, batched: true, label: "load, deduplicated by record UUID" }
  - { from: "map-job", to: "raw-event-store", protocol: "cql", mode: "async", delivery: "at-least-once", batched: true, label: "append raw events for replay" }
  - { from: "aggregate-job", to: "checkpoint-store", protocol: "blob", mode: "async", delivery: "at-least-once", label: "checkpoint every 2 minutes" }
  - { from: "attribution-job", to: "checkpoint-store", protocol: "blob", mode: "async", delivery: "at-least-once", label: "checkpoint every 2 minutes" }
  - { from: "union-load-job", to: "checkpoint-store", protocol: "blob", mode: "async", delivery: "at-least-once", label: "checkpoint every 2 minutes" }
  - { from: "query-service", to: "olap-store", protocol: "sql", mode: "sync", label: "counts per ad per minute, top ads" }
  - { from: "reconciliation-job", to: "raw-event-store", protocol: "cql", mode: "async", batched: true, label: "nightly recompute from raw events" }
  - { from: "reconciliation-job", to: "warehouse", protocol: "hive", mode: "async", batched: true, label: "batch truth" }
  - { from: "reconciliation-job", to: "olap-store", protocol: "sql", mode: "async", batched: true, label: "compare streaming aggregates to batch results" }
  - { from: "aggregate-job", to: "alerting", protocol: "http", mode: "async", delivery: "at-least-once", label: "job liveness and pacing metrics" }
