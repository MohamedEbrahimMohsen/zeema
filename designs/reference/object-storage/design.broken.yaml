# yaml-language-server: $schema=../../../schema/design.schema.json
# Reference architecture 4, broken variant: S3-like object storage promising eleven nines and
# redundant discovery, but with the hot data tier and the placement service pinned to one zone,
# a single DNS provider, multi-leader metadata with no conflict policy and no metadata cache.
#
# This file MUST trip:
#   - read-heavy-path-without-cache                    (metadata-db is read sync by api-service, readWriteRatio 20, no cache in the design)
#   - object-store-single-zone-with-durability-target  (data-nodes-hot: zones 1 while durability.annualNines 11)
#   - multi-leader-store-without-conflict-policy       (metadata-db: multi-region-multi-leader, no conflictResolution)
#   - stateful-engine-pinned-to-single-zone            (placement: sits in us-east-1a only, replicated false)
#   - shared-dependency-without-redundancy             (edge-dns: redundantProviders false; placement: replicated false; discoveryRedundant true)
# and MUST NOT trip:
#   - cache-missing-eviction-policy                    (no cache in this design)
#   - datastore-missing-backup, datastore-single-region (no sql-database in this design)
#   - queue-missing-dlq, pubsub-replay-required        (no queue or topic in this design)
#   - sync-chain-too-deep                              (longest sync chain from api-gateway is 3 hops)
#   - fanout-inline-in-request-path, push-fanout-without-celebrity-path, derived-store-without-cdc-or-rebuild,
#     business-updates-without-index-propagation, cache-as-primary-store-without-persistence,
#     materialised-cache-without-rebuild-path          (no such nodes or edges)
schemaVersion: "1"
type: "design"
id: "object-storage"

requirements:
  availability:
    multiRegion: false
    sla: "99.99"
    zones: 3
    discoveryRedundant: true
  durability:
    annualNines: 11
    minReplicasAcked: 2
  consistency:
    model: "cp"
    readAfterWrite: true
  latency:
    p95Ms: 100
  traffic:
    readWriteRatio: 20
  security:
    credentialRotationDays: 90

groups:
  - { id: "us-east-1", kind: "region" }
  - { id: "us-east-1a", kind: "availability-zone", parent: "us-east-1" }
  - { id: "us-east-1b", kind: "availability-zone", parent: "us-east-1" }
  - { id: "us-east-1c", kind: "availability-zone", parent: "us-east-1" }

nodes:
  - id: "sdk-client"
    component: "sdk-client"
    props: { platform: "sdk", resendPolicy: "retry" }

  - id: "edge-dns"
    component: "route53"
    props: { anycast: true, healthChecked: true, ttlSeconds: 60, redundantProviders: false }

  - id: "api-gateway"
    component: "kong"
    group: "us-east-1"
    props: { auth: "api-key", rateLimiting: true, tls: true }
    nfr: { rps: 200000 }

  - id: "api-service"
    component: "container-service"
    group: "us-east-1"
    props: { orchestrator: "kubernetes", instances: 60, autoscaling: true, criticality: "high" }
    nfr: { rps: 200000 }

  - id: "iam"
    component: "aws-iam"
    props: { protocol: "iam", authorizationModel: "abac", centralised: true }

  - id: "metadata-db"
    component: "cassandra"
    group: "us-east-1"
    props: { model: "wide-column", consistency: "tunable", replication: "multi-region-multi-leader", conflictResolution: "none", replicationFactor: 3, quorumReads: 2, quorumWrites: 2, partitionKey: "bucket_name,object_name", backupEnabled: true, backupRetentionDays: 30, encryptionAtRest: true }
    nfr: { rps: 220000, consistency: "strong" }

  - id: "placement"
    component: "etcd"
    group: "us-east-1a"
    props: { role: "placement", consensus: "raft", replicated: false, nodes: 1 }

  - id: "data-router"
    component: "container-service"
    group: "us-east-1"
    props: { orchestrator: "kubernetes", instances: 40, autoscaling: true }
    nfr: { rps: 200000 }

  - id: "data-nodes-hot"
    component: "minio"
    group: "us-east-1a"
    props: { zones: 1, replication: "primary-secondary", tier: "hot", checksumOnWrite: true, versioning: true, encryptionAtRest: true, durabilityNines: 11 }
    nfr: { rps: 150000 }

  - id: "warm-tier"
    component: "ceph-rgw"
    group: "us-east-1"
    props: { zones: 3, replication: "erasure-coded", tier: "warm", checksumOnWrite: true, versioning: true, encryptionAtRest: true, durabilityNines: 11 }
    nfr: { rps: 20000 }

  - id: "repair-worker"
    component: "container-worker"
    group: "us-east-1c"
    props: { trigger: "queue", instances: 8, idempotent: true, rateControl: "aimd" }

  - id: "auditor"
    component: "cron-job"
    group: "us-east-1b"
    props: { trigger: "schedule", schedule: "0 */6 * * *", idempotent: true }

edges:
  - { from: "sdk-client", to: "edge-dns", protocol: "dns", mode: "sync", label: "resolve bucket endpoint" }
  - { from: "sdk-client", to: "api-gateway", protocol: "https", mode: "sync", retryPolicy: "exponential-jitter", circuitBreaker: true, label: "REST, multipart, range" }
  - { from: "api-gateway", to: "api-service", protocol: "http", mode: "sync" }
  - { from: "api-service", to: "iam", protocol: "https", mode: "sync", timeoutMs: 100, label: "authorise" }
  - { from: "api-service", to: "metadata-db", protocol: "cql", mode: "sync", timeoutMs: 50, label: "object and bucket metadata" }
  - { from: "api-service", to: "data-router", protocol: "grpc", mode: "sync", label: "stream payload" }
  - { from: "data-router", to: "placement", protocol: "grpc", mode: "sync", timeoutMs: 20, label: "node set for object" }
  - { from: "data-router", to: "data-nodes-hot", protocol: "grpc", mode: "sync", label: "write, ack after quorum" }
  - { from: "data-nodes-hot", to: "warm-tier", protocol: "s3", mode: "async", delivery: "at-least-once", label: "tier after 90 days" }
  - { from: "auditor", to: "data-nodes-hot", protocol: "grpc", mode: "async", delivery: "at-least-once", label: "checksum scan" }
  - { from: "auditor", to: "warm-tier", protocol: "grpc", mode: "async", delivery: "at-least-once", label: "checksum scan" }
  - { from: "auditor", to: "repair-worker", protocol: "grpc", mode: "async", delivery: "at-least-once", label: "corrupt block found" }
  - { from: "placement", to: "repair-worker", protocol: "grpc", mode: "async", delivery: "at-least-once", label: "heartbeat lost, rebuild" }
  - { from: "repair-worker", to: "data-nodes-hot", protocol: "grpc", mode: "sync", label: "re-replicate" }
  - { from: "repair-worker", to: "warm-tier", protocol: "grpc", mode: "sync", label: "reconstruct stripe" }
