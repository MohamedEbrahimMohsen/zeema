# yaml-language-server: $schema=../../../schema/design.schema.json
# Reference architecture: Notion's sharded block store, broken variant. The reshard is done in a
# hurry: the application opens connections straight at the new 96-instance fleet instead of going
# through the sharded PgBouncer clusters, Debezium is never re-pointed at the new fleet so the
# search index is kept current by dual writes from application code, the new RDS instances are
# created with backups off, and the migration double-write is called inline on the request path.
#
# This file MUST trip:
#   - business-updates-without-index-propagation (postgres-shards-96 is written sync by notion-app, a search index exists, no CDC leaves it)
#   - derived-store-without-cdc-or-rebuild       (search-index only has a sync in-edge from notion-app)
#   - datastore-missing-backup                   (postgres-shards-96 declares backupEnabled false)
#   - fanout-inline-in-request-path              (notion-app calls catchup-worker synchronously to double-write)
#   - credentials-without-rotation               (security.credentialRotationDays dropped, no key-management node)
# and MUST NOT trip:
#   - read-heavy-path-without-cache              (no traffic.readWriteRatio is stated, so the rule is inert)
#   - single-writer-primary-at-peak-qps, read-replica-as-sole-scaling (no source states an rps, so no sql-database carries nfr.rps)
#   - datastore-single-region                    (availability.multiRegion is false)
#   - sync-chain-too-deep                        (no api-gateway node and no latency.p95Ms target)
#   - object-store-single-zone-with-durability-target (no durability.annualNines requirement; s3 spans 3 zones)
#   - windowed-aggregation-without-watermark     (hudi-deltastreamer does not window by event time)
#   - pubsub-replay-required, queue-missing-dlq, retry-queue-without-dlq (no pubsub-topic and no queue in this design)
#   - cache-as-primary-store-without-persistence, cache-missing-eviction-policy, materialised-cache-without-rebuild-path (no cache node)
#   - stateful-node-without-zone-redundancy, stateful-engine-pinned-to-single-zone (no availability-zone groups)
#   - stateful-hash-ring-without-ring-manager    (notion-app routes by lookup, not consistent-hash)
#   - retry-without-adaptive-shedding, retry-without-backoff (no edge declares a retryPolicy)
schemaVersion: "1"
type: "design"
id: "notion-sharding"

requirements:
  availability:
    multiRegion: false
  consistency:
    model: "cp"
    readAfterWrite: true
  messaging:
    replay: true
    orderingScope: "partition"
  freshness:
    maxSeconds: 7200
  correctness:
    reproducible: true
  data:
    ownershipExclusive: true

groups:
  - { id: "aws-us", kind: "region" }
  - { id: "app-tier", kind: "trust-zone", parent: "aws-us" }
  - { id: "db-tier", kind: "trust-zone", parent: "aws-us" }
  - { id: "data-platform", kind: "trust-zone", parent: "aws-us" }
  - { id: "migration", kind: "system", parent: "aws-us" }

nodes:
  - id: "web-client"
    component: "web-browser"
    props: { platform: "web" }

  - id: "notion-app"
    component: "container-service"
    group: "app-tier"
    label: "Notion application"
    props: { stateless: true, shardingStrategy: "lookup", criticality: "high", ownsData: true }

  - id: "pgbouncer-cluster"
    component: "pgbouncer"
    group: "db-tier"
    label: "PgBouncer, single cluster"
    props: { pooling: true, poolSharded: false, routing: "none" }

  - id: "postgres-monolith"
    component: "aws-rds"
    group: "db-tier"
    label: "Postgres monolith (pre-2021)"
    props: { engine: "postgres", sharded: false, publiclyAccessible: false, encryptionAtRest: true }

  - id: "postgres-shards-32"
    component: "aws-rds"
    group: "db-tier"
    label: "32 instances x 15 logical schemas"
    props: { engine: "postgres", sharded: true, shardKey: "space_id", replication: "async", publiclyAccessible: false, encryptionAtRest: true }

  - id: "postgres-shards-96"
    component: "aws-rds"
    group: "db-tier"
    label: "96 instances x 5 logical schemas"
    props: { engine: "postgres", sharded: true, shardKey: "space_id", replication: "async", backupEnabled: false, publiclyAccessible: false, encryptionAtRest: true }

  - id: "audit-log"
    component: "aws-rds"
    group: "migration"
    label: "Audit log (double-write capture)"
    props: { engine: "postgres", appendOnly: true, publiclyAccessible: false, encryptionAtRest: true }

  - id: "catchup-worker"
    component: "container-worker"
    group: "migration"
    label: "Backfill and catch-up script"
    props: { trigger: "manual", idempotent: false, orchestrator: "none" }

  - id: "cdc-connectors"
    component: "debezium"
    group: "data-platform"
    label: "Debezium, still attached to the pre-reshard fleet"
    props: { mode: "log-based", ordered: true, deployment: "kafka-connect" }

  - id: "cdc-topics"
    component: "kafka"
    group: "data-platform"
    label: "One topic per table"
    props: { delivery: "at-least-once", ordering: "per-key", storage: "persistent" }

  - id: "hudi-deltastreamer"
    component: "spark-streaming"
    group: "data-platform"
    label: "Hudi Deltastreamer, COPY_ON_WRITE upsert"
    props: { windowing: "none", stateBackend: "external" }

  - id: "data-lake"
    component: "s3"
    group: "data-platform"
    label: "S3 data lake, partitioned by shard"
    props: { versioning: true, encryptionAtRest: true }

  - id: "spark-job"
    component: "spark-job"
    group: "data-platform"
    label: "Spark denormalisation and permission tree traversal"
    props: { trigger: "batch", idempotent: true, resourceManager: "kubernetes" }

  - id: "snowflake"
    component: "snowflake"
    group: "data-platform"
    label: "Snowflake (insert-heavy and BI workloads)"
    props: { upsert: false, format: "columnar" }

  - id: "fivetran"
    component: "fivetran"
    group: "data-platform"
    label: "Fivetran (third-party and small datasets)"
    props: { trigger: "schedule", idempotent: true }

  - id: "search-index"
    component: "elasticsearch"
    group: "data-platform"
    label: "Search index"
    props: { structure: "inverted", indexing: "sync", shardingStrategy: "hash" }

edges:
  - { from: "web-client", to: "notion-app", protocol: "https", mode: "sync" }
  - { from: "notion-app", to: "postgres-shards-96", protocol: "postgres", mode: "sync", label: "direct connections, pooler bypassed" }
  - { from: "notion-app", to: "pgbouncer-cluster", protocol: "postgres", mode: "sync", label: "legacy reads" }
  - { from: "notion-app", to: "catchup-worker", protocol: "http", mode: "sync", timeoutMs: 5000, label: "double-write inline on the request path" }
  - { from: "notion-app", to: "search-index", protocol: "http", mode: "sync", label: "index inline (dual write)" }
  - { from: "pgbouncer-cluster", to: "postgres-shards-32", protocol: "postgres", mode: "sync", label: "pre-reshard fleet" }
  - { from: "pgbouncer-cluster", to: "postgres-monolith", protocol: "postgres", mode: "sync", label: "pre-2021 monolith" }
  - { from: "pgbouncer-cluster", to: "audit-log", protocol: "postgres", mode: "sync", label: "double-write audit record" }
  - { from: "postgres-monolith", to: "catchup-worker", protocol: "postgres", mode: "async", batched: true, label: "backfill 480 schemas" }
  - { from: "audit-log", to: "catchup-worker", protocol: "postgres", mode: "async", delivery: "at-least-once", batched: true, label: "replay double-write backlog" }
  - { from: "catchup-worker", to: "postgres-shards-32", protocol: "postgres", mode: "sync", label: "catch-up apply before switchover" }
  - { from: "postgres-shards-32", to: "postgres-shards-96", protocol: "postgres-logical-replication", mode: "async", delivery: "at-least-once", label: "copy with indexes in place" }
  - { from: "postgres-shards-32", to: "cdc-connectors", protocol: "postgres-logical-decoding", mode: "async", delivery: "at-least-once", label: "CDC never re-pointed at the new fleet" }
  - { from: "cdc-connectors", to: "cdc-topics", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "one topic per table" }
  - { from: "cdc-topics", to: "hudi-deltastreamer", protocol: "kafka", mode: "async", delivery: "at-least-once" }
  - { from: "hudi-deltastreamer", to: "data-lake", protocol: "s3", mode: "async", batched: true, label: "COPY_ON_WRITE upsert" }
  - { from: "data-lake", to: "spark-job", protocol: "s3", mode: "async", batched: true, label: "read Hudi tables" }
  - { from: "spark-job", to: "snowflake", protocol: "snowflake", mode: "async", batched: true, label: "denormalised permission trees" }
  - { from: "fivetran", to: "snowflake", protocol: "snowflake", mode: "async", batched: true, label: "third-party and small datasets" }
