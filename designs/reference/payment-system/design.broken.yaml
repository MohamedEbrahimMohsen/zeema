# yaml-language-server: $schema=../../../schema/design.schema.json
# Reference architecture: payment system (Xu vol 2 ch 10, Uber payments platform, Airbnb
# idempotency), broken variant. Same shape as payment-system.yaml but with the mistakes
# the sources warn about: no idempotency key on the PSP call, balances in a plain table
# instead of a double-entry ledger, a retry queue with no DLQ and no backoff, an unsigned
# webhook, a claimed exactly-once hand-off in front of an external side effect, and no
# credential rotation.
#
# This file MUST trip:
#   - money-mutation-without-idempotency-key   (payment-executor -> psp has no idempotent field, exactlyOnceEffect true)
#   - money-store-without-double-entry-ledger  (money.zeroSum true, no ledger kind; ledger-db is a postgres table)
#   - retry-queue-without-dlq                  (retry-queue role retry, deadLetterQueue false)
#   - retry-without-backoff                    (retry-queue role retry, backoff none)
#   - webhook-without-signature-or-idempotency (psp-webhook signatureVerified false)
#   - exactly-once-with-external-side-effects  (payment-service -> payment-executor exactly-once; executor calls psp sync)
#   - credentials-without-rotation             (data nodes, no security.credentialRotationDays, no key-management)
#   - queue-missing-dlq                        (pre-existing rule; retry-queue has async in-edge and no DLQ, same defect as retry-queue-without-dlq)
# and MUST NOT trip:
#   - external-call-inline-without-durable-path (payment-executor is attached to retry-queue)
#   - retry-without-adaptive-shedding           (no edge declares retryPolicy)
#   - datastore-missing-backup                  (both postgres nodes declare backup and retention)
#   - datastore-single-region                   (multiRegion false)
#   - sync-chain-too-deep                       (api -> payment-service -> payments-db is 2 hops)
#   - cache-missing-eviction-policy, pubsub-replay-required (no cache, no pubsub topic)
schemaVersion: "1"
type: "design"
id: "payment-system"

requirements:
  availability:
    multiRegion: false
    sla: "99.99"
  latency:
    p95Ms: 2000
  correctness:
    exactlyOnceEffect: true
    billingGrade: true
  money:
    zeroSum: true
    pci: true
  data:
    reconciliation: true
    immutableAudit: true
  isolation:
    tenancy: "shared"

groups:
  - { id: "eu-west-1", kind: "region" }
  - { id: "payments-vpc", kind: "vpc", parent: "eu-west-1" }
  - { id: "pci-scope", kind: "trust-zone", parent: "eu-west-1" }

nodes:
  - id: "checkout-client"
    component: "web-browser"
    props: { platform: "web", resendPolicy: "retry" }

  - id: "api"
    component: "aws-api-gateway"
    group: "payments-vpc"
    props: { auth: "jwt", apiType: "http", idempotencyKeys: true, keyTtlHours: 24 }
    nfr: { rps: 50 }

  - id: "payment-service"
    component: "container-service"
    group: "payments-vpc"
    props: { orchestrator: "kubernetes", instances: 3, runtime: "java-21", criticality: "high" }

  - id: "payments-db"
    component: "postgres"
    group: "payments-vpc"
    props: { version: "16", backupEnabled: true, backupRetentionDays: 35, replication: "sync", encryptionAtRest: true, concurrencyControl: "constraint" }
    nfr: { rps: 50, consistency: "strong" }

  - id: "payment-executor"
    component: "container-service"
    group: "payments-vpc"
    props: { orchestrator: "kubernetes", instances: 3, runtime: "java-21", criticality: "high" }

  - id: "psp"
    component: "stripe"
    group: "pci-scope"
    props: { handlesMoney: true, idempotent: true, hostedPage: true, callbackStyle: "webhook", slaPercent: "99.99" }

  - id: "psp-webhook"
    component: "webhook-receiver"
    group: "payments-vpc"
    props: { signatureVerified: false, idempotent: false, retriedByCaller: true }

  - id: "wallet-db"
    component: "dynamodb"
    group: "payments-vpc"
    props: { model: "key-value", consistency: "strong", partitionKey: "account_id", backupEnabled: true, backupRetentionDays: 35, encryptionAtRest: true }
    nfr: { rps: 100, consistency: "strong" }

  - id: "ledger-db"
    component: "postgres"
    group: "payments-vpc"
    props: { version: "16", backupEnabled: true, backupRetentionDays: 35, replication: "sync", encryptionAtRest: true, appendOnly: true }
    nfr: { rps: 100, consistency: "strong" }

  - id: "payment-events"
    component: "kafka"
    group: "payments-vpc"
    props: { partitions: 12, replicationFactor: 3, minInsyncReplicas: 2, acks: "all", retentionHours: 168, idempotentProducer: true }

  - id: "retry-queue"
    component: "sqs"
    group: "payments-vpc"
    props: { delivery: "at-least-once", role: "retry", deadLetterQueue: false, backoff: "none", fifo: true }

  - id: "reconciliation-job"
    component: "cron-job"
    group: "payments-vpc"
    props: { trigger: "schedule", schedule: "0 2 * * *", idempotent: true }

  - id: "settlement-bank"
    component: "bank-api"
    props: { handlesMoney: true, idempotent: true, callbackStyle: "poll" }

edges:
  - { from: "checkout-client", to: "api", protocol: "https", mode: "sync", timeoutMs: 5000, idempotent: true, label: "Idempotency-Key header" }
  - { from: "checkout-client", to: "psp", protocol: "https", mode: "sync", idempotent: true, label: "hosted page, card data never touches the platform" }
  - { from: "api", to: "payment-service", protocol: "http", mode: "sync", timeoutMs: 3000 }
  - { from: "payment-service", to: "payments-db", protocol: "postgres", mode: "sync", label: "payment_event, payment_order" }
  - { from: "payment-service", to: "payment-executor", protocol: "grpc", mode: "async", delivery: "exactly-once", label: "claimed exactly-once dispatch" }
  - { from: "payment-executor", to: "psp", protocol: "https", mode: "sync", timeoutMs: 10000, label: "charge; no idempotency key" }
  - { from: "payment-executor", to: "payments-db", protocol: "postgres", mode: "sync", label: "order status" }
  - { from: "payment-executor", to: "wallet-db", protocol: "dynamodb", mode: "sync", idempotent: true, label: "seller balance" }
  - { from: "payment-executor", to: "ledger-db", protocol: "postgres", mode: "sync", idempotent: true, label: "single-entry balance rows" }
  - { from: "payment-executor", to: "payment-events", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "payment events" }
  - { from: "payment-executor", to: "retry-queue", protocol: "sqs", mode: "async", delivery: "at-least-once", label: "transient PSP failure" }
  - { from: "retry-queue", to: "payment-executor", protocol: "sqs", mode: "async", delivery: "at-least-once", label: "immediate re-execute" }
  - { from: "psp", to: "psp-webhook", protocol: "https", mode: "async", delivery: "at-least-once", label: "status callback, retried by PSP" }
  - { from: "psp-webhook", to: "payments-db", protocol: "postgres", mode: "sync", label: "update order status" }
  - { from: "reconciliation-job", to: "settlement-bank", protocol: "sftp", mode: "sync", idempotent: true, label: "nightly settlement files" }
  - { from: "reconciliation-job", to: "ledger-db", protocol: "postgres", mode: "sync", idempotent: true, label: "compare settlement to balances" }
