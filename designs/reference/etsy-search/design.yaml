# yaml-language-server: $schema=../../../schema/design.schema.json
# Reference architecture: Etsy search — a PHP render path over ~1,000 MySQL shards routed by
# Vitess, a two-pass search service (Lucene candidate retrieval then a personalised ranking
# pass), Kafka-fed streaming indexers and BitTorrent index distribution to the search replicas.
#
# Fixes relative to etsy-search.broken.yaml:
#   - the unsharded index database is gone: vitess routes every sharded query with a hybrid
#     vindex and reads the shard mappings from a read-only SQLite copy on each Vitess server,
#     so no single unsharded table sits in front of all 1,000 shards
#   - the ORM no longer writes the shards directly; mysql-shards is reached only through the
#     Vitess proxy, which is what decouples the render path from shard routing
#   - memcached is a look-aside cache (materialised false): the personalised second pass is
#     ranked per user and query, so ranked results are not kept as the only copy of a view
#   - consistent hashing (Ketama) is a property of the cache pool, not a hash ring the render
#     path owns, so there is no ring for the application to manage by hand
#   - kafka and zookeeper are spread over three zones (broker.rack, RF=3), not pinned to zone a
#   - franz produces to kafka without a retry policy that outruns the brokers
# This file MUST trip no rule.
schemaVersion: "1"
type: "design"
id: "etsy-search"

requirements:
  availability:
    multiRegion: false
    zones: 3
  consistency:
    model: "ap"
  messaging:
    replay: true
    orderingScope: "partition"
  traffic:
    skew: "heavy-tail"
  security:
    credentialRotationDays: 90

groups:
  - { id: "gcp-prod", kind: "region", label: "Google Cloud, single region" }
  - { id: "render-path", kind: "trust-zone", label: "Production render path", parent: "gcp-prod" }
  - { id: "search-tier", kind: "trust-zone", label: "Search services on GKE", parent: "gcp-prod" }
  - { id: "data-tier", kind: "trust-zone", label: "Data tier", parent: "gcp-prod" }
  - { id: "relevance-offline", kind: "system", label: "Offline relevance pipeline", parent: "gcp-prod" }

nodes:
  - id: "buyer-client"
    component: "user-device"
    label: "Buyers on web, mobile web and app"
    props: { platform: "multi" }

  - id: "web-render-path"
    component: "container-service"
    label: "Production render path (PHP)"
    group: "render-path"
    props: { orchestrator: "kubernetes", runtime: "php", ownsData: false, criticality: "high", instances: 1000 }

  - id: "internal-api"
    component: "container-service"
    label: "Internal http API cluster"
    group: "render-path"
    props: { orchestrator: "kubernetes", ownsData: false, criticality: "high" }
    nfr: { rps: 300000 }

  - id: "varnish"
    component: "varnish"
    label: "Varnish"
    group: "render-path"
    props: { evictionPolicy: "lru", invalidation: "ttl", persistence: false, usedAsPrimaryStore: false, materialised: false }

  - id: "memcached"
    component: "memcached"
    label: "memcached pools"
    group: "data-tier"
    props: { evictionPolicy: "lru", hashing: "consistent", persistence: false, usedAsPrimaryStore: false, materialised: false, replication: "none" }
    nfr: { rps: 20000000 }

  - id: "vitess"
    component: "vitess"
    label: "Vitess"
    group: "data-tier"
    props: { routing: "lookup", pooling: true, poolSharded: true, scatterGather: false }

  - id: "shard-map-sqlite"
    component: "sqlite"
    label: "SQLite shard map on each Vitess server"
    group: "data-tier"
    props: { replication: "none", backupEnabled: true, backupRetentionDays: 30, sharded: false }

  - id: "mysql-shards"
    component: "mysql"
    label: "Sharded MySQL, ~1,000 shards"
    group: "data-tier"
    props: { sharded: true, shardKey: "shop_id", backupEnabled: true, backupRetentionDays: 30, encryptionAtRest: true, multiWriter: false, distributed: false }
    nfr: { rps: 1700000, consistency: "strong" }

  - id: "search-app"
    component: "container-service"
    label: "Search application"
    group: "search-tier"
    props: { orchestrator: "kubernetes", runtime: "java-scala", ownsData: false, criticality: "high" }

  - id: "spell-correction"
    component: "container-service"
    label: "spell_correction"
    group: "search-tier"
    props: { orchestrator: "kubernetes", ownsData: false }

  - id: "mixer"
    component: "container-service"
    label: "mixer"
    group: "search-tier"
    props: { orchestrator: "kubernetes", ownsData: false }

  - id: "listings-search"
    component: "solr"
    label: "listings_search replicas, candidate retrieval"
    group: "search-tier"
    props: { structure: "inverted", indexing: "async", replicas: 11, cloudMode: false }

  - id: "index-primary"
    component: "solr"
    label: "Index build primary"
    group: "search-tier"
    props: { structure: "inverted", indexing: "batch", replicas: 1, rebuildCadenceHours: 24 }

  - id: "torrent-replicator"
    component: "container-worker"
    label: "BitTorrent index replication"
    group: "search-tier"
    props: { trigger: "schedule", idempotent: true, orchestrator: "none" }

  - id: "ranking-service"
    component: "tensorflow-serving"
    label: "Second-pass ranking, TF Ranking"
    group: "search-tier"
    props: { training: "batch", inputs: "both", batching: false }

  - id: "relevance-student"
    component: "tensorflow-serving"
    label: "Semantic relevance student, two-tower BERT"
    group: "search-tier"
    props: { training: "batch", inputs: "live", batching: false }

  - id: "relevance-teacher"
    component: "vllm"
    label: "Qwen 3 VL teacher, offline labelling"
    group: "relevance-offline"
    props: { training: "batch", inputs: "historical", accelerator: "gpu" }

  - id: "search-indexer"
    component: "container-worker"
    label: "Search indexing streaming applications"
    group: "search-tier"
    props: { trigger: "stream", idempotent: true, orchestrator: "kubernetes" }

  - id: "kafka"
    component: "kafka"
    label: "Kafka on GKE"
    group: "data-tier"
    props: { replicationFactor: 3, delivery: "at-least-once", ordering: "per-key", storage: "persistent" }

  - id: "franz"
    component: "container-worker"
    label: "Franz, the primary Kafka producer"
    group: "data-tier"
    props: { trigger: "stream", orchestrator: "kubernetes" }

  - id: "zookeeper"
    component: "zookeeper"
    label: "ZooKeeper"
    group: "data-tier"
    props: { role: "metadata", replicated: true, consensus: "zab" }

  - id: "gke-search"
    component: "google-gke"
    label: "Search GKE cluster, search-flip and search-flop"
    group: "search-tier"
    props: { locationType: "regional", zonesSpanned: 3, rbac: true }

  - id: "deploy-pipeline"
    component: "jenkins"
    label: "Deployinator to Jenkins"
    props: { trigger: "manual", credentialsStore: "jenkins-internal", selfHostedRunners: true }

  - id: "metrics"
    component: "observability-stack"
    label: "StatsD relays and metrics"
    props: { signal: "all", collectorMode: "push" }

edges:
  - { from: "buyer-client", to: "web-render-path", protocol: "https", mode: "sync", label: "search query from web, mobile web or app" }
  - { from: "web-render-path", to: "varnish", protocol: "http", mode: "sync", label: "internal API call keyed on url, query and Vary" }
  - { from: "varnish", to: "internal-api", protocol: "http", mode: "sync", label: "miss forwards to the downstream server" }
  - { from: "web-render-path", to: "memcached", protocol: "memcached", mode: "sync", label: "look-aside: database and search index query results" }
  - { from: "web-render-path", to: "vitess", protocol: "mysql", mode: "sync", label: "every sharded query goes through Vitess" }
  - { from: "vitess", to: "shard-map-sqlite", protocol: "sqlite", mode: "sync", label: "ids below the threshold use the local lookup vindex" }
  - { from: "vitess", to: "mysql-shards", protocol: "mysql", mode: "sync", label: "routed by vindex on the shardifier id" }
  - { from: "web-render-path", to: "search-app", protocol: "http", mode: "sync", label: "search request" }
  - { from: "search-app", to: "spell-correction", protocol: "http", mode: "sync", label: "correct the query" }
  - { from: "search-app", to: "mixer", protocol: "http", mode: "sync" }
  - { from: "search-app", to: "listings-search", protocol: "http", mode: "sync", label: "first pass: top 1,000 of millions of listings" }
  - { from: "search-app", to: "memcached", protocol: "memcached", mode: "sync", label: "search index query results" }
  - { from: "listings-search", to: "ranking-service", protocol: "grpc", mode: "sync", label: "second pass: rank the candidate set per user and query" }
  - { from: "ranking-service", to: "relevance-student", protocol: "grpc", mode: "sync", timeoutMs: 10, label: "filter, feature, loss weight and boost, under 10 ms added" }
  - { from: "web-render-path", to: "franz", protocol: "http", mode: "async", delivery: "at-least-once", label: "marketplace change events" }
  - { from: "franz", to: "kafka", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "in-memory buffer in front of the brokers" }
  - { from: "kafka", to: "search-indexer", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "RF=3 over three zones, backlog replayed after an outage" }
  - { from: "search-indexer", to: "index-primary", protocol: "http", mode: "async", delivery: "at-least-once", batched: true, label: "index listing changes" }
  - { from: "index-primary", to: "torrent-replicator", protocol: "http", mode: "async", label: "hash the optimized index into a torrent" }
  - { from: "torrent-replicator", to: "listings-search", protocol: "bittorrent", mode: "async", label: "replicas download then seed, 60 min to 6 min" }
  - { from: "kafka", to: "zookeeper", protocol: "zookeeper", mode: "sync", label: "cluster metadata, run across zones" }
  - { from: "search-app", to: "relevance-teacher", protocol: "https", mode: "async", batched: true, label: "sampled search requests replayed daily" }
  - { from: "relevance-teacher", to: "relevance-student", protocol: "https", mode: "async", batched: true, label: "millions of query-listing labels distilled into the student" }
  - { from: "deploy-pipeline", to: "gke-search", protocol: "kubectl", mode: "sync", label: "build, push and kubectl apply per search service, in parallel" }
  - { from: "web-render-path", to: "metrics", protocol: "statsd", mode: "async", delivery: "at-most-once" }
  - { from: "search-app", to: "metrics", protocol: "statsd", mode: "async", delivery: "at-most-once" }
