# yaml-language-server: $schema=../../../schema/design.schema.json
# Reference architecture 46, broken variant: the same Pokemon GO stack as it stood into the 2016
# launch — a regional L4 Network Load Balancer as the only ingress, a client that retries on a
# constant backoff into it with nothing at the edge allowed to shed, a managed game-state database
# nobody backed up, and an analytics path that can neither replay nor say what "late" means.
#
# This file MUST trip:
#   - retry-without-adaptive-shedding        (player-phone -> network-load-balancer and network-load-balancer -> nginx-proxy retry with no circuit breaker and no rate limiter in front of the callee)
#   - datastore-missing-backup               (game-state-db: backupEnabled false, no retention)
#   - pubsub-replay-required                 (event-topic: replay false while messaging.replay is true)
#   - windowed-aggregation-without-watermark (analytics-pipeline windows by event time with no watermarkSeconds)
# and MUST NOT trip:
#   - credentials-without-rotation           (security.credentialRotationDays is still declared)
#   - read-heavy-path-without-cache          (the design states no traffic.readWriteRatio)
#   - datastore-single-region, object-store-single-zone-with-durability-target
#                                            (no availability.multiRegion and no durability.annualNines requirement)
#   - single-writer-primary-at-peak-qps, read-replica-as-sole-scaling
#                                            (game-state-db is still sharded, distributed and multi-writer)
#   - cache-missing-eviction-policy, cache-as-primary-store-without-persistence,
#     materialised-cache-without-rebuild-path (no cache node; the sources never name the spatial cache product)
#   - queue-missing-dlq, retry-queue-without-dlq, retry-without-backoff (no queue in this design)
#   - derived-store-without-cdc-or-rebuild, business-updates-without-index-propagation (no search index)
#   - sync-chain-too-deep                    (no api-gateway node and no latency.p95Ms target)
#   - stateful-node-without-zone-redundancy, stateful-engine-pinned-to-single-zone
#                                            (the sources never enumerate zones, so the design has no availability-zone group)
schemaVersion: "1"
type: "design"
id: "pokemon-go"

requirements:
  consistency:
    model: "cp"
    readAfterWrite: true
  messaging:
    replay: true
  latency:
    geoDistributed: true
  isolation:
    tenancy: "dedicated"
  security:
    credentialRotationDays: 90

groups:
  - { id: "google-cloud", kind: "region", label: "Google Cloud (global footprint)" }
  - { id: "edge", kind: "trust-zone", parent: "google-cloud", label: "Cloud Load Balancing and CDN edge" }
  - { id: "cluster", kind: "trust-zone", parent: "google-cloud", label: "GKE cluster" }
  - { id: "managed-data", kind: "trust-zone", parent: "google-cloud", label: "Managed data services" }

nodes:
  - id: "player-phone"
    component: "mobile-app"
    label: "Pokemon GO app"
    props: { platform: "mobile", os: "both", localCache: true, resendPolicy: "retry" }

  - id: "network-load-balancer"
    component: "google-cloud-load-balancing"
    label: "Network Load Balancer, regional L4"
    group: "edge"
    props: { layer: "l4", global: false, scheme: "external", managed: true, healthChecks: true }

  - id: "google-front-end"
    component: "load-balancer-tier"
    label: "Google Front End, shared pool"
    group: "edge"
    props: { layer: "l7", global: true }

  - id: "cloud-cdn"
    component: "google-cloud-cdn"
    label: "Cloud CDN"
    group: "edge"
    props: { caching: true, cacheMode: "cache-all-static", tls: true, managed: true }

  - id: "nginx-proxy"
    component: "nginx"
    label: "NGINX reverse proxy, buffering"
    group: "cluster"
    props: { layer: "l7", managed: false, hashing: "round-robin" }

  - id: "gke-cluster"
    component: "google-gke"
    label: "Google Kubernetes Engine"
    group: "cluster"
    props: { managed: true, nodeAutoUpgrade: false, releaseChannel: "none" }

  - id: "frontend-game-service"
    component: "container-service"
    label: "Front-end game service"
    group: "cluster"
    props: { orchestrator: "kubernetes", stateless: true, autoscaling: true, criticality: "high", ownsData: false }

  - id: "spatial-query-backend"
    component: "container-service"
    label: "Spatial query backend"
    group: "cluster"
    props: { orchestrator: "kubernetes", stateless: true, autoscaling: true, criticality: "high", ownsData: false }

  - id: "geospatial-platform"
    component: "container-service"
    label: "Geospatial platform, map and world data"
    group: "cluster"
    props: { orchestrator: "kubernetes", stateless: true, criticality: "high", ownsData: false }

  - id: "insights-service"
    component: "container-service"
    label: "Analytics, cheat detection and marketing reporting"
    group: "cluster"
    props: { orchestrator: "kubernetes", stateless: true, criticality: "medium", ownsData: false }

  - id: "event-topic"
    component: "google-pubsub"
    label: "Pub/Sub, game events"
    group: "managed-data"
    props: { delivery: "at-least-once", replay: false, ordering: "none", managed: true }

  - id: "analytics-pipeline"
    component: "google-dataflow"
    label: "Dataflow"
    group: "managed-data"
    props: { windowing: "event-time", lateDataPolicy: "drop", exactlyOnce: true, stateBackend: "external", streamingEngine: true, managed: true }

  - id: "game-state-db"
    component: "spanner"
    label: "Cloud Spanner, game state"
    group: "managed-data"
    props: { nodes: 5000, multiWriter: true, distributed: true, sharded: true, replication: "sync", commitProtocol: "two-phase", backupEnabled: false, encryptionAtRest: true, managed: true }
    nfr: { rps: 400000, consistency: "strong" }

  - id: "action-log"
    component: "bigtable"
    label: "Cloud Bigtable, protobuf action log"
    group: "managed-data"
    props: { model: "wide-column", consistency: "strong", replication: "single-region", encryptionAtRest: true, managed: true }

  - id: "static-media"
    component: "gcs"
    label: "Cloud Storage, static game media"
    group: "managed-data"
    props: { encryptionAtRest: true, managed: true }

  - id: "analytics-warehouse"
    component: "bigquery"
    label: "BigQuery"
    group: "managed-data"
    props: { streamingInserts: true, realtime: true, format: "columnar", managed: true }

  - id: "cloud-monitoring"
    component: "google-cloud-monitoring"
    label: "Cloud Monitoring and Logging"
    group: "managed-data"
    props: { signal: "all", collectorMode: "push", alertGrouping: true, managed: true }

edges:
  - { from: "player-phone", to: "network-load-balancer", protocol: "tls", mode: "sync", retryPolicy: "fixed", label: "one immediate retry, then constant backoff" }
  - { from: "network-load-balancer", to: "google-front-end", protocol: "internal", mode: "sync", label: "shared GFE pool" }
  - { from: "network-load-balancer", to: "cloud-cdn", protocol: "https", mode: "sync", label: "static media" }
  - { from: "cloud-cdn", to: "static-media", protocol: "https", mode: "sync", label: "origin fetch on cache miss" }
  - { from: "network-load-balancer", to: "nginx-proxy", protocol: "http", mode: "sync", retryPolicy: "fixed", label: "retries GET requests into a slow backend" }
  - { from: "gke-cluster", to: "nginx-proxy", protocol: "kubernetes", mode: "sync", label: "schedule proxy pods" }
  - { from: "gke-cluster", to: "frontend-game-service", protocol: "kubernetes", mode: "sync", label: "schedule and scale service pods" }
  - { from: "nginx-proxy", to: "frontend-game-service", protocol: "http", mode: "sync", label: "buffer, route and load balance across pods" }
  - { from: "frontend-game-service", to: "spatial-query-backend", protocol: "internal", mode: "sync", label: "what is near me" }
  - { from: "spatial-query-backend", to: "geospatial-platform", protocol: "internal", mode: "sync", label: "map and world data" }
  - { from: "spatial-query-backend", to: "game-state-db", protocol: "spanner", mode: "sync", idempotent: true, label: "catch, spin, battle as one ACID transaction" }
  - { from: "spatial-query-backend", to: "action-log", protocol: "bigtable", mode: "sync", idempotent: true, label: "protobuf representation of the user action" }
  - { from: "spatial-query-backend", to: "event-topic", protocol: "pubsub", mode: "async", delivery: "at-least-once", label: "publish event off the request path" }
  - { from: "event-topic", to: "analytics-pipeline", protocol: "pubsub", mode: "async", delivery: "at-least-once", label: "streaming path" }
  - { from: "action-log", to: "analytics-pipeline", protocol: "bigtable", mode: "async", delivery: "at-least-once", batched: true, label: "batch player logs" }
  - { from: "analytics-pipeline", to: "analytics-warehouse", protocol: "streaming-insert", mode: "async", delivery: "at-least-once", idempotent: true, label: "5-10 TB per day" }
  - { from: "analytics-warehouse", to: "insights-service", protocol: "sql", mode: "sync", label: "behaviour, distribution verification, cheat detection" }
  - { from: "gke-cluster", to: "cloud-monitoring", protocol: "metrics", mode: "async", delivery: "at-least-once", label: "cluster metrics and logs" }
  - { from: "frontend-game-service", to: "cloud-monitoring", protocol: "metrics", mode: "async", delivery: "at-least-once", label: "dashboards and alerting" }
