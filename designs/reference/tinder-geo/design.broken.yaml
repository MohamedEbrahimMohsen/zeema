# yaml-language-server: $schema=../../../schema/design.schema.json
# Reference architecture 8, broken variant: the same recommendation system before geosharding
# was done properly. Users are consistent-hashed onto shards with nothing owning the ring, the
# indexer writes Elasticsearch inline and retries into it bare, there is no reindex path, the
# profile cache declares no eviction policy, and CoreDNS is one central deployment.
#
# This file MUST trip:
#   - stateful-hash-ring-without-ring-manager   (recommendation-service shardingStrategy consistent-hash, no coordination-service anywhere)
#   - derived-store-without-cdc-or-rebuild      (geoshard-index has only sync in-edges; the reindex job is gone)
#   - retry-without-adaptive-shedding           (indexer -> geoshard-index retries exponential, no circuit breaker, no rate limiter in front of Elasticsearch)
#   - cache-missing-eviction-policy             (profile-cache declares no evictionPolicy)
#   - shared-dependency-without-redundancy      (cluster-dns redundantProviders false while availability.discoveryRedundant is true)
# and MUST NOT trip:
#   - cache-as-primary-store-without-persistence (profile-cache usedAsPrimaryStore false)
#   - materialised-cache-without-rebuild-path    (profile-cache is not materialised)
#   - fanout-inline-in-request-path              (no app-server calls a worker synchronously)
#   - read-heavy-path-without-cache              (a cache exists, and no readWriteRatio is stated)
#   - sync-chain-too-deep                        (no latency.p95Ms is stated, so the rule cannot apply)
#   - datastore-missing-backup, datastore-single-region, single-writer-primary-at-peak-qps,
#     read-replica-as-sole-scaling, business-updates-without-index-propagation (no sql-database node)
#   - queue-missing-dlq, retry-queue-without-dlq, retry-without-backoff, pubsub-replay-required (no queue or topic)
#   - multi-leader-store-without-conflict-policy (both DynamoDB tables are single-region)
#   - credentials-without-rotation               (security.credentialRotationDays is set)
#   - stateful-node-without-zone-redundancy, stateful-engine-pinned-to-single-zone (no availability-zone groups)
schemaVersion: "1"
type: "design"
id: "tinder-geo"

requirements:
  availability:
    multiRegion: false
    discoveryRedundant: true
  consistency:
    readAfterWrite: true
  messaging:
    orderingScope: "partition"
  data:
    reconciliation: true
  traffic:
    skew: "heavy-tail"
  security:
    credentialRotationDays: 90

groups:
  - { id: "aws-region", kind: "region", label: "AWS region" }
  - { id: "edge", kind: "trust-zone", parent: "aws-region" }
  - { id: "platform", kind: "trust-zone", parent: "aws-region", label: "Kubernetes cluster" }
  - { id: "data", kind: "trust-zone", parent: "aws-region" }

nodes:
  - id: "mobile-client"
    component: "mobile-app"
    props: { platform: "mobile", os: "both", localCache: true }

  - id: "elb"
    component: "aws-classic-load-balancer"
    group: "edge"
    props: { listenerProtocol: "https", healthChecks: true }

  - id: "api-front-proxy"
    component: "envoy-gateway"
    group: "edge"
    label: "Envoy front proxy"
    props: { tls: true, rateLimiting: false, protocol: "grpc" }

  - id: "recommendation-service"
    component: "container-service"
    group: "platform"
    label: "Recommendation abstraction service"
    props: { orchestrator: "kubernetes", stateless: true, shardingStrategy: "consistent-hash", criticality: "high" }

  - id: "envoy-sidecar"
    component: "envoy-sidecar"
    group: "platform"
    props: { sidecar: true, retries: false, circuitBreaking: false }

  - id: "cluster-dns"
    component: "coredns"
    group: "platform"
    label: "CoreDNS deployment"
    props: { role: "cluster", redundantProviders: false, managed: false }
    nfr: { rps: 250000 }

  - id: "kubernetes-cluster"
    component: "kubernetes"
    group: "platform"
    props: { nodeCount: 1000, cniPlugin: "flannel", autoscaling: true, managed: false }

  - id: "indexer"
    component: "container-worker"
    group: "platform"
    props: { trigger: "stream", orchestrator: "kubernetes", idempotent: false }

  - id: "user-updates"
    component: "kafka"
    group: "platform"
    label: "user update topic"
    props: { ordering: "per-key", delivery: "at-least-once", storage: "persistent" }

  - id: "geoshard-index"
    component: "elasticsearch"
    group: "data"
    label: "Geosharded Elasticsearch"
    props: { structure: "inverted", shardingStrategy: "geo", geoScheme: "s2", indexing: "sync", refreshIntervalSeconds: 1 }

  - id: "shard-mapping"
    component: "dynamodb"
    group: "data"
    label: "user to geoshard mapping"
    props: { model: "key-value", consistency: "eventual", replication: "single-region" }

  - id: "profile-store"
    component: "dynamodb"
    group: "data"
    label: "profiles and matches"
    props: { model: "key-value", consistency: "eventual", replication: "single-region" }

  - id: "profile-cache"
    component: "aws-elasticache"
    group: "data"
    props: { engine: "redis-oss", persistence: false, usedAsPrimaryStore: false }

edges:
  - { from: "mobile-client", to: "elb", protocol: "https", mode: "sync" }
  - { from: "elb", to: "api-front-proxy", protocol: "http", mode: "sync" }
  - { from: "api-front-proxy", to: "envoy-sidecar", protocol: "grpc", mode: "sync", label: "keepalive connections stick to the first ready pods" }
  - { from: "envoy-sidecar", to: "recommendation-service", protocol: "grpc", mode: "sync", label: "local container port" }
  - { from: "recommendation-service", to: "cluster-dns", protocol: "dns", mode: "sync", label: "resolve service name" }
  - { from: "recommendation-service", to: "geoshard-index", protocol: "http", mode: "sync", label: "consistent hash of the user id picks the shard" }
  - { from: "recommendation-service", to: "profile-cache", protocol: "redis", mode: "sync", label: "hydrate candidates" }
  - { from: "recommendation-service", to: "profile-store", protocol: "https", mode: "sync", label: "profiles and matches on miss" }
  - { from: "recommendation-service", to: "user-updates", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "location and profile update" }
  - { from: "user-updates", to: "indexer", protocol: "kafka", mode: "async", delivery: "at-least-once" }
  - { from: "indexer", to: "geoshard-index", protocol: "http", mode: "sync", retryPolicy: "exponential", label: "index inline, retry until it lands" }
  - { from: "indexer", to: "shard-mapping", protocol: "https", mode: "sync", label: "record the shard the user landed on" }
  - { from: "indexer", to: "cluster-dns", protocol: "dns", mode: "sync", label: "resolve service name" }
  - { from: "kubernetes-cluster", to: "cluster-dns", protocol: "http", mode: "sync", label: "pod and service records" }
  - { from: "kubernetes-cluster", to: "envoy-sidecar", protocol: "xds", mode: "sync", label: "inject and configure sidecars" }
