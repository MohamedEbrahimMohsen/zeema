# yaml-language-server: $schema=../../../schema/design.schema.json
# GitLab.com, broken variant: the Rails tier connects straight at the PostgreSQL primary with no
# pooler, the primary has no backup and no WAL archive (the January 2017 shape), the search index
# is dual-written inline from Rails, the Sidekiq job substrate has no dead-letter set and keeps no
# persistence, and one Sidekiq pool drains every queue.
#
# This file MUST trip:
#   - datastore-missing-backup                   (postgresql and postgresql-replica: backupEnabled false, no retention)
#   - business-updates-without-index-propagation (puma writes postgresql synchronously, a search index exists, no CDC leaves it)
#   - derived-store-without-cdc-or-rebuild       (elasticsearch is only written and read synchronously by puma)
#   - queue-missing-dlq                          (sidekiq-queue takes async traffic with deadLetterQueue false)
#   - cache-as-primary-store-without-persistence (redis-shared-state: usedAsPrimaryStore true, persistence false)
#   - shared-worker-pool-across-queues           (sidekiq consumes sidekiq-queue and mailroom-queue while isolation.perQueue is true)
# and MUST NOT trip:
#   - cache-missing-eviction-policy              (redis-cache declares lru, redis-shared-state declares ttl)
#   - credentials-without-rotation               (gkms is a key-management node)
#   - shared-dependency-without-redundancy       (consul is replicated although discoveryRedundant is required)
#   - datastore-single-region, read-heavy-path-without-cache, read-replica-as-sole-scaling,
#     single-writer-primary-at-peak-qps          (multiRegion false; no readWriteRatio; no rps is stated anywhere)
#   - reconnect-stampede-without-guard, stateful-websocket-scale-in-without-drain
#                                                (kas calls no coordination service and does not autoscale)
#   - stateful-node-without-zone-redundancy, stateful-engine-pinned-to-single-zone
#                                                (the design models zones as one region, not as availability-zone groups)
#   - retry-queue-without-dlq, retry-without-backoff (both queues are work queues, not retry queues)
#   - object-store-single-zone-with-durability-target (gcs keeps its three zones)
#   - fanout-inline-in-request-path              (no app-server calls a worker synchronously)
schemaVersion: "1"
type: "design"
id: "gitlab-architecture"

requirements:
  availability:
    multiRegion: false
    regions: 1
    sla: "99.95"
    discoveryRedundant: true
  consistency:
    model: "cp"
  isolation:
    perQueue: true
  observability:
    alertingIndependent: true

groups:
  - { id: "cloudflare-edge", kind: "point-of-presence", label: "Cloudflare global edge (WAF + DNS)" }
  - { id: "us-east1", kind: "region", label: "GCP us-east1" }
  - { id: "lb-tier", kind: "trust-zone", parent: "us-east1", label: "HAProxy origin fleet (VMs, not Kubernetes)" }
  - { id: "gke-zonal", kind: "trust-zone", parent: "us-east1", label: "Zonal GKE clusters us-east1-b/-c/-d, gitlab namespace" }
  - { id: "gke-regional", kind: "trust-zone", parent: "us-east1", label: "Regional GKE cluster, low-bandwidth services" }
  - { id: "datastores", kind: "trust-zone", parent: "us-east1", label: "Datastore VMs, deliberately off Kubernetes" }
  - { id: "ci-zones", kind: "trust-zone", parent: "us-east1", label: "CI runner managers, us-east1-c and us-east1-d" }
  - { id: "ops", kind: "trust-zone", label: "ops.gitlab.net and dev.gitlab.org, outside the production failure domain" }

nodes:
  - id: "git-client"
    component: "user-device"
    label: "Browsers and Git clients"
    props: { platform: "multi", persistentConnection: false }

  - id: "cloudflare"
    component: "cloudflare-waf"
    group: "cloudflare-edge"
    label: "Cloudflare (WAF + authoritative DNS)"
    props: { mode: "prevention", rateLimiting: true, botProtection: true, managed: true }

  - id: "haproxy"
    component: "haproxy"
    group: "lb-tier"
    label: "HAProxy (Cloudflare origin)"
    props: { layer: "l7", healthChecks: true, managed: false }

  - id: "nginx"
    component: "nginx"
    group: "gke-zonal"
    label: "NGINX ingress"
    props: { layer: "l7", healthChecks: true }

  - id: "gitlab-shell"
    component: "container-service"
    group: "gke-zonal"
    label: "GitLab Shell (Git over SSH, port 22)"
    props: { stateless: true, orchestrator: "kubernetes", criticality: "high", ownsData: false }

  - id: "workhorse"
    component: "container-service"
    group: "gke-zonal"
    label: "GitLab Workhorse (smart reverse proxy)"
    props: { stateless: true, orchestrator: "kubernetes", criticality: "high", ownsData: false }

  - id: "puma"
    component: "container-service"
    group: "gke-zonal"
    label: "Puma (GitLab Rails monolith)"
    props: { stateless: true, orchestrator: "kubernetes", criticality: "high", runtime: "ruby" }

  - id: "rack-attack"
    component: "redis-rate-limiter"
    group: "gke-zonal"
    label: "Rack::Attack (gprd-redis-ratelimiting)"
    props: { algorithm: "fixed-window", scope: "user", placement: "in-process", failMode: "open", distributed: true }

  - id: "sidekiq"
    component: "container-worker"
    group: "gke-regional"
    label: "Sidekiq (one pool, every queue)"
    props: { trigger: "queue", orchestrator: "kubernetes", idempotent: false }

  - id: "kas"
    component: "websocket-gateway"
    group: "gke-regional"
    label: "Kas (GitLab agent server)"
    props: { protocol: "grpc-stream", stateful: true, autoscaling: false, channelAssignment: "sticky" }

  - id: "gitlab-pages"
    component: "container-service"
    group: "gke-zonal"
    label: "GitLab Pages (*.gitlab.io)"
    props: { stateless: true, orchestrator: "kubernetes", ownsData: false }

  - id: "registry"
    component: "gitlab-registry"
    group: "gke-zonal"
    label: "GitLab Container Registry"
    props: { visibilityFollowsProject: true, enabledPerProject: true, managed: false }

  - id: "gitaly"
    component: "file-store"
    group: "datastores"
    label: "Gitaly fleet (t2d-standard-32, pd-ssd, sharded storages)"
    props: { protocol: "native", redundancy: "local", encryptionInTransit: true, backupEnabled: true, managed: false }

  - id: "postgresql"
    component: "postgres"
    group: "datastores"
    label: "PostgreSQL primary (main, ci, sec)"
    props: { replication: "async", backupEnabled: false, encryptionAtRest: true, sharded: false, distributed: false, managed: false }

  - id: "postgresql-replica"
    component: "postgres"
    group: "datastores"
    label: "PostgreSQL hot standby (failover only)"
    props: { replication: "async", replicaOf: "postgresql", backupEnabled: false, encryptionAtRest: true, managed: false }

  - id: "consul"
    component: "consul"
    group: "datastores"
    label: "Patroni + Consul"
    props: { role: "leader-election", consensus: "raft", replicated: true, managed: false }

  - id: "redis-cache"
    component: "redis"
    group: "datastores"
    label: "gprd-redis-cache (transient cache)"
    props: { evictionPolicy: "lru", persistence: false, usedAsPrimaryStore: false, replication: "single-az", cluster: false }

  - id: "redis-shared-state"
    component: "redis"
    group: "datastores"
    label: "gprd-sessions and CI trace chunks, kept only in memory"
    props: { evictionPolicy: "ttl", persistence: false, usedAsPrimaryStore: true, replication: "single-az", cluster: false }

  - id: "sidekiq-queue"
    component: "redis-queue"
    group: "datastores"
    label: "gprd-redis-sidekiq (job queues)"
    props: { delivery: "at-least-once", ordering: "per-key", deadLetterQueue: false, persistence: false, role: "work", implementation: "list" }

  - id: "mailroom-queue"
    component: "redis-queue"
    group: "datastores"
    label: "Mailroom and notification queue"
    props: { delivery: "at-least-once", ordering: "per-key", deadLetterQueue: true, persistence: true, role: "work", implementation: "list" }

  - id: "elasticsearch"
    component: "elasticsearch"
    group: "datastores"
    label: "Elasticsearch (dual-written from Rails)"
    props: { structure: "inverted", indexing: "sync", shardingStrategy: "time", managed: false }

  - id: "gcs"
    component: "gcs"
    group: "us-east1"
    label: "Google Cloud Storage (artifacts, LFS, uploads, registry blobs)"
    props: { locationType: "multi-region", storageClass: "standard", versioning: true, encryptionAtRest: true }

  - id: "runner-manager"
    component: "gitlab-ci"
    group: "ci-zones"
    label: "Runner managers (GitLab Runner + Docker Machine on GCE)"
    props: { trigger: "commit", selfHostedRunners: true, runnerScope: "instance", protectedVariables: true }

  - id: "prometheus"
    component: "prometheus"
    group: "ops"
    label: "Prometheus per cluster, remote-written to Mimir"
    props: { signal: "metrics", collectorMode: "pull", remoteWrite: true, independentOfMonitored: true, alertGrouping: true }

  - id: "gkms"
    component: "google-cloud-kms"
    group: "ops"
    label: "GKMS (Google Cloud KMS)"
    props: { hsm: false, envelopeEncryption: true, managed: true }

edges:
  - { from: "git-client", to: "cloudflare", protocol: "https", mode: "sync", label: "all web, Git HTTP and Git SSH traffic" }
  - { from: "cloudflare", to: "haproxy", protocol: "https", mode: "sync", label: "Cloudflare origin" }
  - { from: "haproxy", to: "nginx", protocol: "http", mode: "sync", label: "web and API into the GKE clusters" }
  - { from: "haproxy", to: "gitlab-shell", protocol: "ssh", mode: "sync", label: "Git over SSH, port 22, as the git user" }
  - { from: "nginx", to: "workhorse", protocol: "http", mode: "sync", label: "the default HTTP path" }
  - { from: "nginx", to: "gitlab-pages", protocol: "http", mode: "sync", label: "TCP 8090" }
  - { from: "nginx", to: "kas", protocol: "http", mode: "sync", label: "TCP 8150" }
  - { from: "nginx", to: "registry", protocol: "http", mode: "sync", label: "registry front door" }
  - { from: "workhorse", to: "puma", protocol: "http", mode: "sync", timeoutMs: 60000, label: "Unix socket" }
  - { from: "workhorse", to: "gitaly", protocol: "grpc", mode: "sync", label: "SmartHTTPService pack data" }
  - { from: "workhorse", to: "gcs", protocol: "https", mode: "sync", label: "direct upload and download" }
  - { from: "workhorse", to: "redis-cache", protocol: "redis", mode: "sync", label: "shared state read" }
  - { from: "gitlab-shell", to: "puma", protocol: "http", mode: "sync", label: "internal API: authorized_keys, then allowed?" }
  - { from: "gitlab-shell", to: "gitaly", protocol: "grpc", mode: "sync", label: "SSHService.SSHUploadPack" }
  - { from: "gitlab-shell", to: "sidekiq-queue", protocol: "redis", mode: "async", delivery: "at-least-once", label: "enqueue Sidekiq job" }
  - { from: "puma", to: "rack-attack", protocol: "redis", mode: "sync", label: "per-user and per-IP limits" }
  - { from: "puma", to: "postgresql", protocol: "postgres", mode: "sync", label: "direct connections, no pooler" }
  - { from: "puma", to: "consul", protocol: "http", mode: "sync", label: "database node discovery" }
  - { from: "postgresql", to: "consul", protocol: "http", mode: "sync", label: "registers; Patroni drives failover" }
  - { from: "postgresql", to: "postgresql-replica", protocol: "postgres-replication", mode: "async", delivery: "at-least-once", label: "the only recovery copy" }
  - { from: "puma", to: "redis-cache", protocol: "redis", mode: "sync", label: "transient cache, LRU eviction" }
  - { from: "puma", to: "redis-shared-state", protocol: "redis", mode: "sync", label: "sessions and CI trace chunks" }
  - { from: "puma", to: "sidekiq-queue", protocol: "redis", mode: "async", delivery: "at-least-once", label: "enqueue background job" }
  - { from: "puma", to: "mailroom-queue", protocol: "redis", mode: "async", delivery: "at-least-once", label: "enqueue notification mail" }
  - { from: "sidekiq-queue", to: "sidekiq", protocol: "redis", mode: "async", delivery: "at-least-once", label: "one pool drains every queue" }
  - { from: "mailroom-queue", to: "sidekiq", protocol: "redis", mode: "async", delivery: "at-least-once", label: "the same pool drains the mail queue" }
  - { from: "sidekiq", to: "postgresql", protocol: "postgres", mode: "sync", label: "direct connections, no pooler" }
  - { from: "sidekiq", to: "gitaly", protocol: "grpc", mode: "sync", label: "background Git work" }
  - { from: "sidekiq", to: "gcs", protocol: "https", mode: "sync", label: "artifacts, uploads, exports" }
  - { from: "puma", to: "elasticsearch", protocol: "http", mode: "sync", label: "index inline on save (dual write)" }
  - { from: "puma", to: "gitaly", protocol: "grpc", mode: "sync", label: "branches, tags, diffs, blobs" }
  - { from: "puma", to: "gkms", protocol: "https", mode: "sync", label: "service secrets" }
  - { from: "gitaly", to: "gcs", protocol: "https", mode: "async", delivery: "at-least-once", label: "repository backups" }
  - { from: "registry", to: "puma", protocol: "http", mode: "sync", label: "token auth: 401, client fetches a token, retries" }
  - { from: "registry", to: "gcs", protocol: "https", mode: "sync", label: "image blobs" }
  - { from: "gitlab-pages", to: "gcs", protocol: "https", mode: "sync", label: "site content" }
  - { from: "kas", to: "gitaly", protocol: "grpc", mode: "sync", label: "agent configuration from the repository" }
  - { from: "kas", to: "redis-shared-state", protocol: "redis", mode: "sync", label: "agent connection state" }
  - { from: "runner-manager", to: "puma", protocol: "https", mode: "sync", label: "POST /api/v4/jobs/request polling" }
  - { from: "runner-manager", to: "cloudflare", protocol: "https", mode: "sync", label: "ephemeral build VMs clone with a gitlab-ci-token" }
  - { from: "prometheus", to: "puma", protocol: "http", mode: "async", delivery: "at-most-once", label: "per-cluster scrape" }
  - { from: "prometheus", to: "postgresql", protocol: "http", mode: "async", delivery: "at-most-once", label: "exporters" }
