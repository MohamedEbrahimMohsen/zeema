# yaml-language-server: $schema=../../../schema/design.schema.json
# Reference architecture: Spotify playback and event delivery. Clients hold a connection to a
# nearest-datacentre access point in front of the squad-owned microservices, audio comes from a
# CDN, and every client and service event is published to one Cloud Pub/Sub topic per event type
# and windowed into hourly buckets by a per-type Dataflow ETL feeding GCS, BigQuery and 38,000
# scheduled pipelines.
#
# Fixes relative to spotify-playback.broken.yaml:
#   - event-topics keep retention so raw events can be re-read (Pub/Sub replay beside the GCS copy)
#   - event-etl declares a watermark, so an event-time hourly window knows when it is complete and
#     late data is shifted into the open bucket instead of being silently undefined
#   - access-point drains its connections on scale-in instead of dropping every socket at once
#   - service-discovery is served redundantly, so the SRV lookup every service depends on is not
#     one failure away from taking the fleet with it
#   - user-db is backed up with a stated retention, and the design declares a credential rotation
#     period for the stores it holds
# This file MUST trip no rule.
schemaVersion: "1"
type: "design"
id: "spotify-playback"

requirements:
  availability:
    multiRegion: true
    discoveryRedundant: true
    degradedModeAllowed: true
  messaging:
    replay: true
  correctness:
    reproducible: true
  data:
    lossDetection: true
  isolation:
    perEventType: true
  freshness:
    maxSeconds: 3600
  security:
    credentialRotationDays: 90

groups:
  - { id: "edge", kind: "trust-zone", label: "Edge" }
  - { id: "serving-platform", kind: "system", label: "Serving platform" }
  - { id: "event-delivery", kind: "system", label: "Event delivery" }
  - { id: "data-platform", kind: "system", label: "Data platform" }

nodes:
  - id: "spotify-mobile"
    component: "mobile-app"
    label: "Mobile client"
    props: { platform: "mobile", os: "both", localCache: true, offlineCapable: true, persistentConnection: true, resendPolicy: "store-and-forward" }

  - id: "spotify-web"
    component: "web-browser"
    label: "Web player"
    props: { platform: "web", localCache: true, persistentConnection: true, resendPolicy: "retry" }

  - id: "access-point"
    component: "websocket-gateway"
    group: "edge"
    label: "Access Point"
    props: { protocol: "websocket", stateful: true, autoscaling: true, drainOnScaleIn: true, stampedeGuard: true, channelAssignment: "hash" }

  - id: "service-discovery"
    component: "dns-resolver"
    group: "edge"
    label: "DNS SRV service discovery"
    props: { redundantProviders: true, healthChecked: true }

  - id: "audio-cdn"
    component: "content-delivery-network"
    group: "edge"
    label: "Audio CDN"
    props: { caching: true, tls: true, originShield: true }

  - id: "microservices"
    component: "container-service"
    group: "serving-platform"
    label: "Squad-owned microservices"
    props: { stateless: true, criticality: "high", autoscaling: true }

  - id: "metadata-store"
    component: "cassandra"
    group: "serving-platform"
    props: { model: "wide-column", consistency: "tunable", replication: "multi-region-multi-leader", conflictResolution: "last-writer-wins", backupEnabled: true, backupRetentionDays: 30, encryptionAtRest: true }

  - id: "user-db"
    component: "postgres"
    group: "serving-platform"
    props: { replication: "async", backupEnabled: true, backupRetentionDays: 30, encryptionAtRest: true, managed: false }

  - id: "object-cache"
    component: "memcached"
    group: "serving-platform"
    props: { evictionPolicy: "lru", hashing: "consistent", invalidation: "ttl" }

  - id: "audio-store"
    component: "blob-store"
    group: "serving-platform"
    label: "Audio storage"
    props: { tier: "hot", encryptionAtRest: true }

  - id: "event-delivery-service"
    component: "container-service"
    group: "event-delivery"
    label: "Event Delivery Service"
    props: { stateless: true, autoscaling: true, orchestrator: "kubernetes", criticality: "high", ownsData: false }
    nfr: { rps: 8000000 }

  - id: "schema-registry"
    component: "google-pubsub-schema"
    group: "event-delivery"
    label: "Avro schema registry"
    props: { schemaType: "avro", compatibility: "backward", enforced: true }

  - id: "event-topics"
    component: "google-pubsub"
    group: "event-delivery"
    label: "One topic per event type"
    props: { delivery: "at-least-once", replay: true, topicPerEventType: true, ordering: "none" }
    nfr: { rps: 8000000 }

  - id: "event-etl"
    component: "google-dataflow"
    group: "event-delivery"
    label: "Per event type ETL (Scio on Dataflow)"
    props: { windowing: "event-time", watermarkSeconds: 200, lateDataPolicy: "shift", exactlyOnce: false, streamingEngine: true }

  - id: "raw-datasets"
    component: "gcs"
    group: "data-platform"
    label: "Hourly datasets on Cloud Storage"
    props: { storageClass: "standard", locationType: "region", versioning: true }

  - id: "warehouse"
    component: "bigquery"
    group: "data-platform"
    props: { format: "columnar" }

  - id: "batch-pipelines"
    component: "container-worker"
    group: "data-platform"
    label: "38,000 scheduled pipelines"
    props: { trigger: "schedule", orchestrator: "kubernetes", idempotent: true }

  - id: "streaming-pipelines"
    component: "flink"
    group: "data-platform"
    label: "Flink streaming pipelines"
    props: { stateBackend: "rocksdb" }

  - id: "liveness-monitoring"
    component: "observability-stack"
    group: "data-platform"
    label: "Liveness and watermark lag monitoring"
    props: { signal: "metrics", independentOfMonitored: true, alertGrouping: true }

edges:
  - { from: "spotify-mobile", to: "service-discovery", protocol: "dns", mode: "sync", label: "SRV lookup for the access point" }
  - { from: "spotify-web", to: "service-discovery", protocol: "dns", mode: "sync", label: "SRV lookup for the access point" }
  - { from: "spotify-mobile", to: "access-point", protocol: "hermes", mode: "sync", label: "persistent connection to the nearest datacentre" }
  - { from: "spotify-web", to: "access-point", protocol: "https", mode: "sync", label: "persistent connection to the nearest datacentre" }
  - { from: "access-point", to: "service-discovery", protocol: "dns", mode: "sync", label: "SRV lookup for the target service" }
  - { from: "access-point", to: "microservices", protocol: "hermes", mode: "sync", label: "request-reply routing" }
  - { from: "microservices", to: "service-discovery", protocol: "dns", mode: "sync", label: "service to service lookup" }
  - { from: "microservices", to: "metadata-store", protocol: "cql", mode: "sync", label: "metadata, playlists" }
  - { from: "microservices", to: "user-db", protocol: "postgres", mode: "sync" }
  - { from: "microservices", to: "object-cache", protocol: "memcached", mode: "sync" }
  - { from: "spotify-mobile", to: "audio-cdn", protocol: "https", mode: "sync", label: "audio" }
  - { from: "spotify-web", to: "audio-cdn", protocol: "https", mode: "sync", label: "audio" }
  - { from: "audio-cdn", to: "audio-store", protocol: "https", mode: "sync", label: "origin fetch" }
  - { from: "spotify-mobile", to: "event-delivery-service", protocol: "https", mode: "sync", batched: true, idempotent: true, label: "batched events, resent immediately, minutes or days later" }
  - { from: "spotify-web", to: "event-delivery-service", protocol: "https", mode: "sync", batched: true, idempotent: true, label: "batched events" }
  - { from: "microservices", to: "event-delivery-service", protocol: "https", mode: "async", delivery: "at-least-once", batched: true, label: "service side events" }
  - { from: "event-delivery-service", to: "schema-registry", protocol: "http", mode: "sync", timeoutMs: 500, fallback: "cached", label: "validate the event type" }
  - { from: "event-delivery-service", to: "event-topics", protocol: "pubsub", mode: "async", delivery: "at-least-once", label: "publish to the topic of this event type" }
  - { from: "event-topics", to: "event-etl", protocol: "pubsub", mode: "async", delivery: "at-least-once", label: "pull, one job per event type" }
  - { from: "event-etl", to: "schema-registry", protocol: "http", mode: "sync", timeoutMs: 500, label: "Avro schema for this event type" }
  - { from: "event-etl", to: "raw-datasets", protocol: "gcs", mode: "async", label: "hourly buckets by event time, deduplicated" }
  - { from: "event-etl", to: "warehouse", protocol: "bigquery", mode: "async", label: "load the closed hour" }
  - { from: "event-etl", to: "liveness-monitoring", protocol: "http", mode: "async", delivery: "at-most-once", label: "watermark lag per event type" }
  - { from: "event-topics", to: "streaming-pipelines", protocol: "pubsub", mode: "async", delivery: "at-least-once", label: "streaming jobs" }
  - { from: "raw-datasets", to: "batch-pipelines", protocol: "gcs", mode: "async", label: "scheduled read of the raw hour" }
  - { from: "warehouse", to: "batch-pipelines", protocol: "bigquery", mode: "async", label: "scheduled SQL" }
  - { from: "batch-pipelines", to: "warehouse", protocol: "bigquery", mode: "async", label: "derived datasets" }
  - { from: "streaming-pipelines", to: "warehouse", protocol: "bigquery", mode: "async", label: "streaming output" }
