# yaml-language-server: $schema=../../../schema/design.schema.json
# Reference architecture: Facebook/Meta TAO, broken variant. The lookaside architecture TAO was
# built to replace, rebuilt at TAO's scale: one unsharded MySQL graph database with async read
# replicas as the only scaling, a PHP web tier that writes the database and the secondary index
# itself, no binlog tailer feeding the index, and a Wormhole topic that cannot replay the
# invalidations a leader failure loses.
#
# This file MUST trip:
#   - single-writer-primary-at-peak-qps          (graph-db: multiWriter false, sharded false, 1000000 rps)
#   - read-replica-as-sole-scaling               (graph-db: replication async, sharded false, distributed false)
#   - business-updates-without-index-propagation (web-server writes graph-db sync; no change-data-capture leaves it)
#   - derived-store-without-cdc-or-rebuild       (secondary-index has only sync in-edges from web-server)
#   - pubsub-replay-required                     (wormhole replay false while messaging.replay is true)
# and MUST NOT trip:
#   - datastore-missing-backup                 (both MySQL nodes declare backup and retention)
#   - datastore-single-region                  (both MySQL nodes declare async replication)
#   - multi-leader-store-without-conflict-policy (multiWriter stays false: one primary per graph)
#   - cache-missing-eviction-policy            (every cache and memcache node declares lru or ttl)
#   - cache-as-primary-store-without-persistence, materialised-cache-without-rebuild-path
#                                              (no cache is a primary store or a materialised view)
#   - read-heavy-path-without-cache            (the design is nothing but caches)
#   - credentials-without-rotation             (security.credentialRotationDays is set)
#   - fanout-inline-in-request-path            (web-server calls no worker synchronously)
#   - retry-without-adaptive-shedding          (no edge declares a retry policy)
#   - sync-chain-too-deep                      (no api-gateway node and no latency.p95Ms target)
#   - queue-missing-dlq, retry-queue-without-dlq (no queue node)
#   - stateful-node-without-zone-redundancy, stateful-engine-pinned-to-single-zone
#                                              (no availability-zone group)
#   - shared-dependency-without-redundancy     (availability.discoveryRedundant is not declared)
#   - stateful-hash-ring-without-ring-manager  (web-server declares no shardingStrategy)
schemaVersion: "1"
type: "design"
id: "facebook-tao"

requirements:
  availability:
    multiRegion: true
    regions: 10
    degradedModeAllowed: true
  consistency:
    model: "ap"
    readAfterWrite: true
  messaging:
    replay: true
    orderingScope: "partition"
  freshness:
    maxSeconds: 10
  traffic:
    readWriteRatio: 500
    skew: "heavy-tail"
  security:
    credentialRotationDays: 90

groups:
  - { id: "master-region", kind: "region", label: "Region holding the database master" }
  - { id: "slave-region", kind: "region", label: "A slave region" }
  - { id: "master-storage", kind: "trust-zone", parent: "master-region", label: "Storage cluster" }
  - { id: "frontend-cluster", kind: "trust-zone", parent: "slave-region", label: "Frontend cluster" }
  - { id: "storage-cluster", kind: "trust-zone", parent: "slave-region", label: "Storage cluster" }

nodes:
  - id: "end-user"
    component: "web-browser"
    props: { platform: "web", localCache: false }

  - id: "frontend-lb"
    component: "load-balancer-tier"
    group: "frontend-cluster"
    label: "Load balancer"
    props: { layer: "l7", hashing: "consistent", healthChecks: true }

  - id: "web-server"
    component: "container-service"
    group: "frontend-cluster"
    label: "PHP web tier"
    props: { stateless: true, runtime: "php", criticality: "high", ownsData: false }

  - id: "client-hot-cache"
    component: "cache-cluster"
    group: "frontend-cluster"
    label: "TAO client-side hot-item cache"
    props: { evictionPolicy: "lru", invalidation: "event", structure: "key-value", usedAsPrimaryStore: false }

  - id: "follower-primary"
    component: "cache-cluster"
    group: "frontend-cluster"
    label: "Follower tier (L1), primary"
    props: { evictionPolicy: "lru", hashing: "consistent", invalidation: "event", structure: "key-value", usedAsPrimaryStore: false, replication: "none" }

  - id: "follower-backup"
    component: "cache-cluster"
    group: "slave-region"
    label: "Follower tier (L1), backup"
    props: { evictionPolicy: "lru", hashing: "consistent", invalidation: "event", structure: "key-value", usedAsPrimaryStore: false, replication: "none" }

  - id: "leader"
    component: "cache-cluster"
    group: "slave-region"
    label: "Leader tier (L2), one per region"
    props: { evictionPolicy: "lru", hashing: "consistent", invalidation: "event", structure: "key-value", usedAsPrimaryStore: false }

  - id: "master-leader"
    component: "cache-cluster"
    group: "master-region"
    label: "Leader tier in the master region"
    props: { evictionPolicy: "lru", hashing: "consistent", invalidation: "event", structure: "key-value", usedAsPrimaryStore: false }

  - id: "refill-library"
    component: "cache-cluster"
    group: "slave-region"
    label: "RefillLibrary"
    props: { evictionPolicy: "lru", ttlSeconds: 180, invalidation: "event", structure: "key-value", usedAsPrimaryStore: false }

  - id: "mcrouter"
    component: "proxysql"
    group: "frontend-cluster"
    label: "mcrouter"
    props: { pooling: true, routing: "shard-key", requestCoalescing: true }

  - id: "memcache-tier"
    component: "memcached"
    group: "frontend-cluster"
    label: "memcache lookaside tier"
    props: { evictionPolicy: "lru", hashing: "consistent", invalidation: "event", usedAsPrimaryStore: false }
    nfr: { rps: 1000000000 }

  - id: "gutter-pool"
    component: "memcached"
    group: "frontend-cluster"
    label: "Gutter pool"
    props: { evictionPolicy: "ttl", hashing: "none", invalidation: "ttl", usedAsPrimaryStore: false }

  - id: "regional-pool"
    component: "memcached"
    group: "slave-region"
    label: "Regional pool"
    props: { evictionPolicy: "lru", hashing: "consistent", invalidation: "event", usedAsPrimaryStore: false }

  - id: "mcsqueal"
    component: "debezium"
    group: "storage-cluster"
    label: "mcsqueal"
    props: { mode: "log-based", ordered: true, deployment: "server", snapshotOnStart: false }

  - id: "wormhole"
    component: "mqtt-broker"
    label: "Wormhole pub-sub"
    props: { delivery: "at-least-once", replay: false, ordering: "per-key", topicPerEventType: false }

  - id: "inverse-repair-job"
    component: "container-worker"
    group: "master-region"
    label: "Inverse-association repair job"
    props: { trigger: "schedule", idempotent: true }

  - id: "secondary-index"
    component: "elasticsearch"
    group: "slave-region"
    label: "Global secondary indexes and materialised views"
    props: { structure: "inverted", shardingStrategy: "hash", indexing: "sync" }

  - id: "global-config"
    component: "etcd"
    label: "Global configuration"
    props: { role: "placement", consensus: "raft", replicated: true }

  - id: "graph-db"
    component: "mysql"
    group: "master-storage"
    label: "Graph MySQL primary"
    props: { sharded: false, multiWriter: false, distributed: false, replication: "async", backupEnabled: true, backupRetentionDays: 30, encryptionAtRest: true, concurrencyControl: "pessimistic", commitProtocol: "single" }
    nfr: { rps: 1000000, consistency: "strong" }

  - id: "graph-db-replica"
    component: "mysql"
    group: "storage-cluster"
    label: "Graph MySQL read replica"
    props: { sharded: false, multiWriter: false, distributed: false, replication: "async", replicaOf: "graph-db", backupEnabled: true, backupRetentionDays: 30, encryptionAtRest: true }
    nfr: { consistency: "eventual" }

edges:
  - { from: "end-user", to: "frontend-lb", protocol: "https", mode: "sync" }
  - { from: "frontend-lb", to: "web-server", protocol: "http", mode: "sync", label: "sticky to one frontend cluster" }
  - { from: "web-server", to: "client-hot-cache", protocol: "in-process", mode: "sync", label: "hot objects and associations" }
  - { from: "web-server", to: "follower-primary", protocol: "tao-rpc", mode: "sync", label: "graph read" }
  - { from: "web-server", to: "follower-backup", protocol: "tao-rpc", mode: "sync", fallback: "cached", label: "failover tier" }
  - { from: "web-server", to: "graph-db", protocol: "mysql", mode: "sync", label: "write the graph, then delete the cache key" }
  - { from: "web-server", to: "graph-db-replica", protocol: "mysql", mode: "sync", label: "read around the cache" }
  - { from: "web-server", to: "secondary-index", protocol: "rpc", mode: "sync", label: "index inline (dual write)" }
  - { from: "web-server", to: "mcrouter", protocol: "memcache", mode: "sync", label: "lookaside get/set/delete" }
  - { from: "follower-primary", to: "client-hot-cache", protocol: "tao-rpc", mode: "async", delivery: "at-most-once", label: "access-rate feedback" }
  - { from: "follower-primary", to: "refill-library", protocol: "in-process", mode: "sync", label: "recent writes consulted on a miss" }
  - { from: "follower-primary", to: "leader", protocol: "tao-rpc", mode: "sync", label: "read miss" }
  - { from: "follower-backup", to: "leader", protocol: "tao-rpc", mode: "sync", label: "read miss" }
  - { from: "leader", to: "graph-db-replica", protocol: "mysql", mode: "sync", label: "always the local region's database" }
  - { from: "leader", to: "master-leader", protocol: "tao-rpc", mode: "sync", label: "forward the write to the master region" }
  - { from: "master-leader", to: "graph-db", protocol: "mysql", mode: "sync", idempotent: true, label: "synchronous write" }
  - { from: "inverse-repair-job", to: "master-leader", protocol: "tao-rpc", mode: "async", delivery: "at-least-once", idempotent: true, label: "repair hanging associations" }
  - { from: "leader", to: "follower-primary", protocol: "tao-invalidation", mode: "async", delivery: "at-least-once", idempotent: true, label: "invalidate" }
  - { from: "leader", to: "follower-backup", protocol: "tao-invalidation", mode: "async", delivery: "at-least-once", idempotent: true, label: "invalidate" }
  - { from: "graph-db", to: "graph-db-replica", protocol: "mysql-replication", mode: "async", delivery: "at-least-once", label: "asynchronous replication" }
  - { from: "graph-db", to: "wormhole", protocol: "pubsub", mode: "async", delivery: "at-least-once", label: "cache-maintenance messages, not replayable" }
  - { from: "wormhole", to: "leader", protocol: "pubsub", mode: "async", delivery: "at-least-once", idempotent: true, label: "invalidate / refill" }
  - { from: "wormhole", to: "refill-library", protocol: "pubsub", mode: "async", delivery: "at-least-once", idempotent: true, label: "recent writes" }
  - { from: "graph-db-replica", to: "mcsqueal", protocol: "mysql-binlog", mode: "async", delivery: "at-least-once", label: "tail the commit log and extract deletes" }
  - { from: "mcsqueal", to: "mcrouter", protocol: "memcache", mode: "async", delivery: "at-least-once", batched: true, label: "batched deletes" }
  - { from: "mcrouter", to: "memcache-tier", protocol: "memcache", mode: "sync", label: "route by key" }
  - { from: "mcrouter", to: "gutter-pool", protocol: "memcache", mode: "sync", fallback: "cached", label: "keys whose cache server has failed" }
  - { from: "mcrouter", to: "regional-pool", protocol: "memcache", mode: "sync", label: "low-access-rate items and remote markers" }
  - { from: "global-config", to: "graph-db", protocol: "config", mode: "sync", label: "mastership and automatic promotion" }
  - { from: "global-config", to: "graph-db-replica", protocol: "config", mode: "sync", label: "mark down replicas that fall behind" }
