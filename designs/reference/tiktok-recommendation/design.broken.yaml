# yaml-language-server: $schema=../../../schema/design.schema.json
# Reference architecture 10, broken variant: the same TikTok recommendation loop built the way a team
# builds it the first time — the joiner windows by event time and drops anything late, so the label
# that arrives after the window never trains anything; the parameter synchroniser is gone and model
# servers write embeddings straight into the serving parameter server, which is then the only copy
# of them; and ByteGraph's second-region replica accepts writes with no stated conflict policy.
#
# This file MUST trip:
#   - windowed-aggregation-without-watermark      (flink-joiner windows by event time, no watermarkSeconds)
#   - cache-as-primary-store-without-persistence  (serving-ps: usedAsPrimaryStore true, persistence false)
#   - materialised-cache-without-rebuild-path     (serving-ps is materialised; only model-server writes it)
#   - multi-leader-store-without-conflict-policy  (bytegraph-kv and bytegraph-kv-remote are multi-leader with no conflictResolution)
# and MUST NOT trip:
#   - cache-missing-eviction-policy               (serving-ps still declares ttl)
#   - datastore-missing-backup, datastore-single-region, read-replica-as-sole-scaling,
#     single-writer-primary-at-peak-qps           (no sql-database node in this design)
#   - queue-missing-dlq, retry-queue-without-dlq, pubsub-replay-required (no queue and no pubsub-topic)
#   - derived-store-without-cdc-or-rebuild, business-updates-without-index-propagation (no search index)
#   - read-heavy-path-without-cache               (no app-server node, and a cache exists)
#   - credentials-without-rotation                (the design still states credentialRotationDays)
#   - retry-without-backoff, retry-without-adaptive-shedding (the one retrying edge keeps jittered backoff and a breaker)
#   - sync-chain-too-deep                         (no api-gateway node to start the chain at)
#   - object-store-single-zone-with-durability-target (snapshot-store states no durability target)
#   - stateful-node-without-zone-redundancy, stateful-engine-pinned-to-single-zone (no availability-zone groups)
schemaVersion: "1"
type: "design"
id: "tiktok-recommendation"

requirements:
  availability:
    multiRegion: true
    regions: 2
  consistency:
    model: "ap"
  messaging:
    replay: true
  freshness:
    maxSeconds: 60
  security:
    credentialRotationDays: 90

groups:
  - { id: "region-a", kind: "region" }
  - { id: "region-b", kind: "region" }
  - { id: "serving", kind: "trust-zone", parent: "region-a" }
  - { id: "training", kind: "trust-zone", parent: "region-a" }
  - { id: "bytegraph-primary", kind: "system", parent: "region-a" }
  - { id: "bytegraph-remote", kind: "system", parent: "region-b" }

nodes:
  - id: "mobile-client"
    component: "mobile-app"
    label: "TikTok / Douyin app"
    props: { platform: "mobile", os: "both", localCache: true }

  - id: "model-server"
    component: "tensorflow-serving"
    label: "Monolith model server"
    group: "serving"
    props: { training: "online", inputs: "live", snapshotToObjectStore: false, batching: true }

  - id: "serving-ps"
    component: "cache-cluster"
    label: "Serving parameter server"
    group: "serving"
    props: { structure: "key-value", evictionPolicy: "ttl", invalidation: "ttl", materialised: true, usedAsPrimaryStore: true, persistence: false }

  - id: "training-worker"
    component: "container-worker"
    label: "Monolith training worker"
    group: "training"
    props: { trigger: "stream", idempotent: false, accelerator: "gpu" }

  - id: "flink-joiner"
    component: "flink"
    label: "Online feature joiner"
    group: "training"
    props: { windowing: "event-time", stateBackend: "memory", lateDataPolicy: "drop", exactlyOnce: false }

  - id: "kafka-actions"
    component: "kafka"
    label: "User action log"
    group: "training"
    props: { delivery: "at-least-once", ordering: "per-key", storage: "persistent" }

  - id: "kafka-features"
    component: "kafka"
    label: "Feature log"
    group: "training"
    props: { delivery: "at-least-once", ordering: "per-key", storage: "persistent" }

  - id: "kafka-training"
    component: "kafka"
    label: "Joined training examples"
    group: "training"
    props: { delivery: "at-least-once", ordering: "per-key", storage: "persistent" }

  - id: "training-ps"
    component: "nosql-store"
    label: "Training parameter server"
    group: "training"
    props: { model: "key-value", consistency: "eventual", replication: "single-region", backupEnabled: true, backupRetentionDays: 1 }

  - id: "snapshot-store"
    component: "blob-store"
    label: "Daily parameter snapshots"
    group: "training"
    props: { tier: "warm", versioning: true, checksumOnWrite: true }

  - id: "bytegraph-bge"
    component: "graph-store"
    label: "ByteGraph BGE"
    group: "bytegraph-primary"
    props: { inMemory: false }

  - id: "bytegraph-bgs"
    component: "graph-store"
    label: "ByteGraph BGS"
    group: "bytegraph-primary"
    props: { inMemory: true, masterPerShard: true }

  - id: "bytegraph-kv"
    component: "nosql-store"
    label: "ByteGraph persistent KV"
    group: "bytegraph-primary"
    props: { model: "key-value", consistency: "eventual", replication: "multi-region-multi-leader", tombstoneTtlDays: 7, backupEnabled: true, backupRetentionDays: 7 }

  - id: "bytegraph-kv-remote"
    component: "nosql-store"
    label: "ByteGraph persistent KV, second region"
    group: "bytegraph-remote"
    props: { model: "key-value", consistency: "eventual", replication: "multi-region-multi-leader", tombstoneTtlDays: 7, backupEnabled: true, backupRetentionDays: 7 }

edges:
  - { from: "mobile-client", to: "model-server", protocol: "grpc", mode: "sync", label: "feed request" }
  - { from: "model-server", to: "serving-ps", protocol: "grpc", mode: "sync", batched: true, label: "look up, and write back, sparse embeddings" }
  - { from: "model-server", to: "bytegraph-bge", protocol: "grpc", mode: "sync", label: "social and interaction lookups" }
  - { from: "mobile-client", to: "kafka-actions", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "watch, like, follow" }
  - { from: "model-server", to: "kafka-features", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "features of the served request" }
  - { from: "kafka-actions", to: "flink-joiner", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "labels, keyed by request id" }
  - { from: "kafka-features", to: "flink-joiner", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "features, keyed by request id" }
  - { from: "flink-joiner", to: "kafka-training", protocol: "kafka", mode: "async", delivery: "at-least-once", label: "joined training example" }
  - { from: "kafka-training", to: "training-worker", protocol: "kafka", mode: "async", delivery: "at-least-once" }
  - { from: "training-worker", to: "training-ps", protocol: "grpc", mode: "sync", timeoutMs: 1000, retryPolicy: "exponential-jitter", circuitBreaker: true, label: "apply sparse and dense gradients" }
  - { from: "training-ps", to: "snapshot-store", protocol: "https", mode: "async", delivery: "at-least-once", label: "daily snapshot" }
  - { from: "bytegraph-bge", to: "bytegraph-bgs", protocol: "grpc", mode: "sync", label: "two-phase commit, predicate pushdown" }
  - { from: "bytegraph-bgs", to: "bytegraph-kv", protocol: "grpc", mode: "sync", label: "edge-tree pages and write-ahead log" }
  - { from: "bytegraph-kv", to: "bytegraph-kv-remote", protocol: "replication", mode: "async", delivery: "at-least-once", label: "multi-leader, no stated conflict policy" }
