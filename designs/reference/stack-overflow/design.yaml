# yaml-language-server: $schema=../../../schema/design.schema.json
# Stack Overflow, clean variant: the scale-up runtime path of the Stack Exchange network — four
# HAProxy boxes in front of nine IIS web servers, an L1/L2 cache pair (in-process + Redis with a
# pub/sub purge channel), two SQL Server clusters with async AlwaysOn replicas, Elasticsearch fed
# by the indexing job, the in-house tag engine, Providence and the Bosun/Opserver monitoring path.
#
# Fixes relative to stack-overflow.broken.yaml:
#   - the elastic indexing job reads changed rows (ROWVERSION) out of both SQL clusters and writes
#     Elasticsearch asynchronously, so the index has a rebuild path and the web tier never dual-writes
#   - redis-master is a cache, not a store: usedAsPrimaryStore false, all data re-populable from source
#   - no nfr.rps is claimed for a single unsharded SQL primary; the stated 504.8M queries/day is a
#     whole-tier number and is recorded in the edge label instead of as a per-box ceiling
#   - cloudflare declares redundantProviders true (multiple DNS providers after the 2016 Dyn attack)
# This file MUST trip no rule.
schemaVersion: "1"
type: "design"
id: "stack-overflow"

requirements:
  availability:
    multiRegion: false
    regions: 2
    degradedModeAllowed: true
    discoveryRedundant: true
  consistency:
    model: "cp"
  freshness:
    maxSeconds: 120
  security:
    credentialRotationDays: 90

groups:
  - { id: "ny", kind: "region", label: "New York datacenter (primary)" }
  - { id: "colorado", kind: "region", label: "Colorado datacenter (DR)" }
  - { id: "dmz", kind: "trust-zone", parent: "ny", label: "DMZ" }
  - { id: "internal", kind: "trust-zone", parent: "ny", label: "Internal VLANs" }

nodes:
  - id: "client"
    component: "web-browser"
    label: "Browsers and mobile clients"
    props: { platform: "multi", persistentConnection: true, localCache: true }

  - id: "cloudflare"
    component: "cloudflare-dns"
    label: "CloudFlare"
    props: { proxied: true, anycast: true, redundantProviders: true, managed: true }

  - id: "haproxy-cloudflare"
    component: "haproxy"
    label: "HAProxy (CloudFlare traffic)"
    group: "dmz"
    props: { layer: "l7", healthChecks: true, hashing: "round-robin" }

  - id: "haproxy-direct"
    component: "haproxy"
    label: "HAProxy (direct traffic)"
    group: "dmz"
    props: { layer: "l7", healthChecks: true, hashing: "round-robin" }

  - id: "web-tier"
    component: "iis"
    label: "Web tier NY-WEB01-09"
    group: "internal"
    props: { instances: 9, stateless: true, runtime: "dotnet", criticality: "high", pipelineMode: "integrated" }
    nfr: { rps: 2423 }

  - id: "l1-cache"
    component: "cache-cluster"
    label: "L1 in-process cache"
    group: "internal"
    props: { evictionPolicy: "ttl", invalidation: "event", persistence: false, replication: "none", structure: "key-value", tier: "core", usedAsPrimaryStore: false, materialised: false }

  - id: "socket-server"
    component: "websocket-gateway"
    label: "Socket server (StackExchange.NetGain)"
    group: "internal"
    props: { protocol: "websocket", stateful: true, autoscaling: false, drainOnScaleIn: false }

  - id: "tag-engine"
    component: "vm-service"
    label: "Stack Server / tag engine"
    group: "internal"
    props: { instances: 3, stateless: false, runtime: "dotnet-http-sys", criticality: "medium", provider: "on-prem" }
    nfr: { rps: 42 }

  - id: "elastic-indexer"
    component: "debezium"
    label: "Elastic indexing job (ROWVERSION)"
    group: "internal"
    props: { mode: "polling", ordered: true }

  - id: "redis-master"
    component: "redis"
    label: "Redis master"
    group: "internal"
    props: { evictionPolicy: "ttl", persistence: true, replication: "single-az", invalidation: "event", cluster: false, structure: "key-value", usedAsPrimaryStore: false, materialised: false, tier: "core" }
    nfr: { rps: 18363 }

  - id: "redis-slave"
    component: "redis"
    label: "Redis slave"
    group: "internal"
    props: { evictionPolicy: "ttl", persistence: true, replication: "single-az", invalidation: "event", cluster: false, structure: "key-value", usedAsPrimaryStore: false, materialised: false, tier: "core" }

  - id: "purge-channel"
    component: "redis-pubsub"
    label: "Redis purge channel"
    group: "internal"
    props: { delivery: "at-most-once", replay: false, ordering: "none", topicPerEventType: false, cluster: false }

  - id: "elasticsearch"
    component: "elasticsearch"
    label: "Elasticsearch 1.4 (3 nodes)"
    group: "internal"
    props: { structure: "inverted", indexing: "async" }
    nfr: { rps: 199 }

  - id: "sql-cluster-1"
    component: "sql-server"
    label: "SQL cluster 1 primary (Stack Overflow, Sites, PRIZM, Mobile)"
    group: "internal"
    props: { alwaysOn: true, replication: "async", sharded: false, multiWriter: false, distributed: false, backupEnabled: true, backupRetentionDays: 30, concurrencyControl: "pessimistic" }

  - id: "sql-cluster-1-replica"
    component: "sql-server"
    label: "SQL cluster 1 read replica (NY)"
    group: "internal"
    props: { alwaysOn: true, replication: "async", replicaOf: "sql-cluster-1", backupEnabled: true, backupRetentionDays: 30 }
    nfr: { consistency: "eventual" }

  - id: "sql-cluster-1-dr"
    component: "sql-server"
    label: "SQL cluster 1 DR replica (Colorado)"
    group: "colorado"
    props: { alwaysOn: true, replication: "async", replicaOf: "sql-cluster-1", backupEnabled: true, backupRetentionDays: 30 }
    nfr: { consistency: "eventual" }

  - id: "sql-cluster-2"
    component: "sql-server"
    label: "SQL cluster 2 primary (Talent, OpenID, Chat, exceptions, other sites)"
    group: "internal"
    props: { alwaysOn: true, replication: "async", sharded: false, multiWriter: false, distributed: false, backupEnabled: true, backupRetentionDays: 30, concurrencyControl: "pessimistic" }

  - id: "sql-cluster-2-replica"
    component: "sql-server"
    label: "SQL cluster 2 read replica (NY)"
    group: "internal"
    props: { alwaysOn: true, replication: "async", replicaOf: "sql-cluster-2", backupEnabled: true, backupRetentionDays: 30 }
    nfr: { consistency: "eventual" }

  - id: "providence-api"
    component: "iis"
    label: "Providence API"
    group: "internal"
    props: { stateless: true, runtime: "dotnet", criticality: "low", pipelineMode: "integrated" }

  - id: "providence-ml"
    component: "container-worker"
    label: "Providence ML servers"
    group: "internal"
    props: { trigger: "batch", instances: 2, idempotent: true, orchestrator: "none", accelerator: "none" }

  - id: "providence-redis"
    component: "redis"
    label: "Providence Redis slaves"
    group: "internal"
    props: { evictionPolicy: "ttl", persistence: true, replication: "single-az", cluster: false, structure: "key-value", usedAsPrimaryStore: false, materialised: false, tier: "core" }

  - id: "traffic-processor"
    component: "container-worker"
    label: "Traffic processing service"
    group: "internal"
    props: { trigger: "stream", idempotent: false, orchestrator: "none" }

  - id: "http-logging-sql"
    component: "sql-server"
    label: "HTTP logging SQL Server (columnstore)"
    group: "internal"
    props: { appendOnly: true, replication: "none", sharded: false, multiWriter: false, backupEnabled: true, backupRetentionDays: 30 }

  - id: "bosun"
    component: "observability-stack"
    label: "Bosun + OpenTSDB/HBase"
    group: "internal"
    props: { signal: "metrics", collectorMode: "push", alertGrouping: true, independentOfMonitored: true }

  - id: "opserver"
    component: "observability-stack"
    label: "Opserver"
    group: "internal"
    props: { signal: "all", collectorMode: "pull", independentOfMonitored: true }

edges:
  - { from: "client", to: "cloudflare", protocol: "https", mode: "sync", label: "public DNS and proxy" }
  - { from: "cloudflare", to: "haproxy-cloudflare", protocol: "https", mode: "sync", label: "proxied traffic, dedicated HAProxy pair" }
  - { from: "client", to: "haproxy-direct", protocol: "https", mode: "sync", label: "direct traffic, second HAProxy pair" }
  - { from: "haproxy-cloudflare", to: "web-tier", protocol: "http", mode: "sync", label: "TLS terminated at HAProxy; 3 good health checks to re-enter rotation" }
  - { from: "haproxy-direct", to: "web-tier", protocol: "http", mode: "sync", label: "TLS terminated at HAProxy" }
  - { from: "haproxy-cloudflare", to: "traffic-processor", protocol: "syslog", mode: "async", delivery: "at-most-once", label: "request summaries with timing headers" }
  - { from: "haproxy-direct", to: "traffic-processor", protocol: "syslog", mode: "async", delivery: "at-most-once", label: "request summaries with timing headers" }
  - { from: "client", to: "socket-server", protocol: "wss", mode: "async", delivery: "at-most-once", label: "~500k concurrent sockets, push-only live counts" }
  - { from: "web-tier", to: "l1-cache", protocol: "in-process", mode: "sync", label: "L1, checked before Redis; serves stale while refreshing" }
  - { from: "web-tier", to: "redis-master", protocol: "resp", mode: "sync", retryPolicy: "none", batched: true, label: "L2 on L1 miss; pipelined, never retried" }
  - { from: "web-tier", to: "purge-channel", protocol: "resp-publish", mode: "async", delivery: "at-most-once", label: "publish key name after the DEL/UNLINK" }
  - { from: "purge-channel", to: "web-tier", protocol: "resp-subscribe", mode: "async", delivery: "at-most-once", label: "fan-out to every web server; flush matching L1 entries" }
  - { from: "redis-master", to: "redis-slave", protocol: "redis-replication", mode: "async", delivery: "at-least-once", label: "one master + one slave per datacenter" }
  - { from: "web-tier", to: "sql-cluster-1", protocol: "tds", mode: "sync", label: "Dapper over POCOs; 504.8M queries/day across both clusters" }
  - { from: "web-tier", to: "sql-cluster-2", protocol: "tds", mode: "sync", label: "chat, OpenID, Talent, exception log, other Q&A sites" }
  - { from: "sql-cluster-1", to: "sql-cluster-1-replica", protocol: "alwayson", mode: "async", delivery: "at-least-once", label: "async AlwaysOn read replica" }
  - { from: "sql-cluster-1", to: "sql-cluster-1-dr", protocol: "alwayson-mpls", mode: "async", delivery: "at-least-once", label: "async DR replica over the 10 Gbps MPLS circuit" }
  - { from: "sql-cluster-2", to: "sql-cluster-2-replica", protocol: "alwayson", mode: "async", delivery: "at-least-once", label: "async AlwaysOn read replica" }
  - { from: "web-tier", to: "tag-engine", protocol: "http-sys", mode: "sync", timeoutMs: 1000, fallback: "degraded", label: "tag intersection queries SQL could not afford" }
  - { from: "tag-engine", to: "sql-cluster-1", protocol: "tds", mode: "sync", label: "reload post and tag changes every 2 minutes" }
  - { from: "sql-cluster-1", to: "elastic-indexer", protocol: "tds-rowversion", mode: "async", delivery: "at-least-once", label: "changed rows tracked by ROWVERSION" }
  - { from: "sql-cluster-2", to: "elastic-indexer", protocol: "tds-rowversion", mode: "async", delivery: "at-least-once", label: "changed rows tracked by ROWVERSION" }
  - { from: "elastic-indexer", to: "elasticsearch", protocol: "http", mode: "async", delivery: "at-least-once", batched: true, label: "index writes, one index per site; full reindex is the rebuild path" }
  - { from: "web-tier", to: "elasticsearch", protocol: "http", mode: "sync", fallback: "degraded", label: "/search, related questions, ask-a-question suggestions" }
  - { from: "web-tier", to: "providence-api", protocol: "http", mode: "sync", fallback: "static", label: "home-page recommendations, job matching" }
  - { from: "providence-api", to: "providence-redis", protocol: "resp", mode: "sync", label: "predictions, dedicated slaves" }
  - { from: "providence-ml", to: "providence-redis", protocol: "resp", mode: "async", delivery: "at-most-once", label: "computed predictions written out" }
  - { from: "http-logging-sql", to: "providence-ml", protocol: "batch", mode: "async", delivery: "at-least-once", batched: true, label: "tag-view deviation features from traffic logs" }
  - { from: "traffic-processor", to: "http-logging-sql", protocol: "tds", mode: "async", delivery: "at-least-once", batched: true, label: "one summary row per request, clustered columnstore per day" }
  - { from: "traffic-processor", to: "bosun", protocol: "http", mode: "async", delivery: "at-most-once", label: "request metrics" }
  - { from: "web-tier", to: "bosun", protocol: "http", mode: "async", delivery: "at-most-once", label: "BosunReporter application metrics" }
  - { from: "opserver", to: "sql-cluster-1", protocol: "tds", mode: "sync", label: "availability-group status polled directly" }
  - { from: "opserver", to: "redis-master", protocol: "resp", mode: "sync", label: "Redis dashboard" }
  - { from: "opserver", to: "elasticsearch", protocol: "http", mode: "sync", label: "cluster health" }
  - { from: "opserver", to: "haproxy-cloudflare", protocol: "haproxy-admin", mode: "sync", label: "backend state" }
