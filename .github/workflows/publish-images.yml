# Builds the four images docker-compose.deploy.yml runs and pushes them to the GitHub
# Container Registry, so a deployment pulls ready-made images instead of compiling from
# source on the server.
#
# Two of the images are the application itself; the other two are stock images with this
# repository's configuration baked in, which is what lets the deploy compose file run
# without any files on the host.
#
# Images land at ghcr.io/<owner>/<name>, tagged `latest` and with the commit sha. They are
# private until the package is made public in GitHub -> Packages -> Package settings; a
# Docker host pulling them anonymously needs them public, or a registry login.
name: publish images

on:
  push:
    branches: [main]
    # Documentation-only commits do not change any image.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # One image per job, so a failure names the image that broke and the others still ship.
      fail-fast: false
      matrix:
        include:
          - name: zeema-web
            dockerfile: apps/web/Dockerfile
          - name: zeema-landing
            dockerfile: apps/landing/Dockerfile
          - name: zeema-grafana
            dockerfile: ops/grafana/Dockerfile
          - name: zeema-db
            dockerfile: ops/postgres/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by Actions; no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry paths must be lowercase, and the owner name is not.
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache between runs, so only what changed is rebuilt.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
