# Publishes the `zeema` package (packages/zeema) to npm: the command line and its MCP server,
# with the catalogue bundled in. It is the only package this repository publishes; the
# @zeema/* workspace packages are private and are bundled into it.
#
# Release: set "version" in packages/zeema/package.json, commit, then push a tag `v<version>`
# (for example `git tag v1.1.0 && git push origin v1.1.0`). The job refuses a tag that does not
# match the package version. `workflow_dispatch` publishes the version on the chosen ref, and
# still refuses when that ref is a tag that does not match.
#
# Authentication is npm Trusted Publishing: no token is stored anywhere. One-time setup by the
# owner on npmjs.com -> package `zeema` -> Settings -> Trusted Publisher -> GitHub Actions, with
# repository zeema-canvas/zeema and workflow file publish-npm.yml (no environment). The
# job then proves its identity to npm with the OIDC token `id-token: write` grants, and npm
# attaches provenance to the version itself. Needs npm 11.5.1 or later, hence the upgrade step.
name: publish npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here: the action reads packageManager from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # No registry-url: that would write an .npmrc expecting NODE_AUTH_TOKEN, and an empty
          # token takes precedence over the OIDC exchange, which the registry answers with 404.

      - name: Refuse a tag that is not the package version
        run: |
          version=$(node -p "require('./packages/zeema/package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/zeema version $version"
            exit 1
          fi
          echo "publishing zeema $version"

      - run: pnpm install --frozen-lockfile

      # The same gate as every pull request: catalogue, tests (which build and pack the
      # package and drive its MCP server), lint.
      - run: pnpm validate
      - run: pnpm test
        env:
          TURBO_FORCE: "true"
      - run: pnpm lint

      # Built again outside Turbo so the bundled catalogue names this exact commit.
      - run: node build.js
        working-directory: packages/zeema

      # The published manifest carries no workspace: references and no scripts that point at
      # files outside the tarball. Users install `dependencies` only; this is tidiness.
      - run: npm pkg delete devDependencies scripts
        working-directory: packages/zeema

      # Trusted Publishing arrived in npm 11.5.1; Node 22 ships an older npm. Pinned rather than
      # @latest: a fresh npm release has mis-reported a rejected OIDC exchange before
      # (npm/cli#9088), and a rejected exchange shows up as 404 or ENEEDAUTH, never as itself.
      - run: npm install -g npm@11.6.2

      # What the registry will see. The OIDC token exists only with `id-token: write`, and the
      # publisher registered on npmjs.com must match repository and workflow file exactly.
      - name: Trusted Publishing preflight
        run: |
          echo "npm $(npm --version) on node $(node --version)"
          echo "repository=$GITHUB_REPOSITORY workflow=$(basename "$GITHUB_WORKFLOW_REF" | cut -d@ -f1) ref=$GITHUB_REF"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" || { echo "::error::no OIDC token request URL: id-token: write missing"; exit 1; }
          test -z "$NODE_AUTH_TOKEN" || { echo "::error::NODE_AUTH_TOKEN is set; it would shadow OIDC"; exit 1; }
          npm config get registry
          npm whoami 2>/dev/null || echo "(no token session, as intended)"

      - run: npm publish --access public
        working-directory: packages/zeema
