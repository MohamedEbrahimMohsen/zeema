# yaml-language-server: $schema=../schema/rule.schema.json
# The design stores data but says nothing about rotating the credentials that reach it,
# and there is no key-management node that would rotate them. Leaked credentials then
# stay valid forever.
# Tripped by: designs/payment-system.broken.yaml
schemaVersion: "1"
type: "rule"
id: "credentials-without-rotation"
severity: "warning"
select:
  design: true
when:
  all:
    - hasNode:
        category: "data"
    - requirement: "security.credentialRotationDays"
      exists: false
    - not:
        hasNode:
          kind: "key-management"
message: "Design '{{design.id}}' holds data but declares no credential rotation period and has no key-management node."
