# yaml-language-server: $schema=../../schema/component.schema.json
# Oracle Cloud Secret Management Service: passwords, keys and tokens stored as versioned secrets in a vault.
# Defaults from "Secret Management Service Overview": a secret is encrypted with a vault master encryption key,
# every secret carries versions, and contents are replicated across two availability or fault domains.
schemaVersion: "1"
type: "component"
id: "oci-secret-management"
kind: "key-management"
provider: "oci"
defaults:
  managed: true
  hsm: false
  rotationAutomated: false
  envelopeEncryption: true
properties:
  versioned:
    type: "boolean"
    default: true
  crossRegionReplication:
    type: "boolean"
    default: false
  reuseRule:
    type: "boolean"
    default: false
