# yaml-language-server: $schema=../../schema/component.schema.json
# Oracle Cloud Managed Access: approval workflow for temporary operator access to resources in a tenancy.
# Defaults from "Managed Access Overview": access requests from service representatives are routed to customer
# approvers through approval templates, can be revoked, and operator actions are audited.
schemaVersion: "1"
type: "component"
id: "oci-managed-access"
kind: "policy-engine"
provider: "oci"
defaults:
  managed: true
  effect: "deny"
  enforcementMode: "enforced"
  scope: "account"
  remediation: false
properties:
  approvalRequired:
    type: "boolean"
    default: true
  autoApproval:
    type: "boolean"
    default: false
  operatorActionsAudited:
    type: "boolean"
    default: true
  accessTemporary:
    type: "boolean"
    default: true
