# yaml-language-server: $schema=../../schema/component.schema.json
# Oracle API Access Control: a privileged API control marks selected management operations on Autonomous
# AI Databases, Autonomous Container Databases and Autonomous Exadata VM Clusters as privileged, so that
# invoking them raises a privileged API request. Defaults from "Oracle API Access Control Configuration and
# Administration Guide": a controlled operation needs prior approval from an authorised group in the
# tenancy, and the control covers the operation whether it is invoked from the Console or the REST API.
schemaVersion: "1"
type: "component"
id: "oci-api-access-control"
kind: "policy-engine"
provider: "oci"
docs: "https://docs.oracle.com/en-us/iaas/oracle-api-access-control/doc/manage-privileged-api-control.html"
defaults:
  managed: true
  effect: "deny"
  enforcementMode: "enforced"
  scope: "resource"
  remediation: false
properties:
  approvalRequired:
    type: "boolean"
    default: true
  targetResourceType:
    type: "enum"
    values: ["autonomous-ai-database", "autonomous-container-database", "autonomous-exadata-vm-cluster"]
  consoleOperationsCovered:
    type: "boolean"
    default: true
