# yaml-language-server: $schema=../../schema/component.schema.json
# Oracle Analytics Cloud: managed self-service analytics, data preparation and enterprise reporting.
# "Create a service" sizes an instance either in OCPUs (1 for non-production, 2-52 for production) or in
# users, offers Enterprise and Professional editions, and deploys the instance with a public internet
# endpoint or a private endpoint; the network access choice cannot be changed after deployment.
schemaVersion: "1"
type: "component"
id: "oci-analytics-cloud"
kind: "bi-service"
provider: "oci"
defaults:
  managed: true
  capacityMode: "dedicated"
properties:
  edition:
    type: "enum"
    values: ["enterprise", "professional"]
  capacityUnit:
    type: "enum"
    values: ["ocpu", "users"]
    default: "ocpu"
  networkAccess:
    type: "enum"
    values: ["public", "private"]
    default: "public"
  license:
    type: "enum"
    values: ["license-included", "bring-your-own-license"]
    default: "license-included"
  updateCycle:
    type: "enum"
    values: ["regular", "early"]
    default: "regular"
