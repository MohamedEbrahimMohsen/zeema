# yaml-language-server: $schema=../../schema/component.schema.json
# Oracle Cloud Vault: managed keys and secrets with HSM-backed master keys and opt-in rotation.
schemaVersion: "1"
type: "component"
id: "oci-vault"
kind: "key-management"
provider: "oci"
docs: "https://docs.oracle.com/en-us/iaas/Content/KeyManagement/Concepts/keyoverview.htm"
aliases: ["KMS"]
defaults:
  managed: true
  hsm: true
  rotationAutomated: false
  envelopeEncryption: true
