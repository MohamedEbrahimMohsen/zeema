# yaml-language-server: $schema=../../schema/component.schema.json
# Oracle Cloud Dynamic Routing Gateway: regional virtual router hubbing VCN, IPSec tunnel,
# FastConnect virtual circuit and remote peering attachments ("Dynamic Routing Gateways (DRGs)").
# Two default route tables and two default import route distributions are autogenerated; BGP is
# supported and a route table load-balances over at most eight ECMP paths.
schemaVersion: "1"
type: "component"
id: "oci-dynamic-routing-gateway"
kind: "network-fabric"
provider: "oci"
docs: "https://docs.oracle.com/en-us/iaas/Content/Network/Tasks/managingDRGs.htm"
defaults:
  managed: true
  overlay: true
  interconnect: "private"
  multicast: false
properties:
  vcnRouteType:
    type: "enum"
    values: ["subnet-cidrs", "vcn-cidrs"]
    default: "subnet-cidrs"
  defaultRouteTablesCreated:
    type: "boolean"
    default: true
  bgp:
    type: "boolean"
    default: true
  maxEcmpPaths:
    type: "integer"
    default: 8
