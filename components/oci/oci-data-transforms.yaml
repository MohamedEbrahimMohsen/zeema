# yaml-language-server: $schema=../../schema/component.schema.json
# Oracle Data Transforms: the Oracle Data Integrator based, code-free ELT tool for data loads, data flows and
# workflows ("Introduction to Oracle Data Transforms"). It generates code and pushes the transformation down
# to the target, keeps its repository in an Autonomous Database, and ships either embedded in Autonomous
# Database Data Tools or as the "Data Integrator: Web Edition" Marketplace instance you run yourself.
schemaVersion: "1"
type: "component"
id: "oci-data-transforms"
kind: "worker"
provider: "oci"
docs: "https://docs.oracle.com/en/database/data-integration/data-transforms/using/introduction-oracle-data-transforms.html"
defaults:
  managed: true
  trigger: "schedule"
properties:
  deployment:
    type: "enum"
    values: ["autonomous-database-embedded", "marketplace-instance", "goldengate", "compute-cloud-at-customer"]
    default: "autonomous-database-embedded"
  pushdown:
    type: "boolean"
    default: true
  repositoryOnAutonomousDatabase:
    type: "boolean"
    default: true
