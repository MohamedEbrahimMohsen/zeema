# yaml-language-server: $schema=../../schema/component.schema.json
# Device Data FHIR Service: a managed FHIR repository instance with its own regional endpoint, holding
# Device, Patient, Observation, Encounter and related clinical resources as FHIR documents. Defaults from
# "FHIR R6 Resources": each instance answers on its own <instance-id>.ddfs.<region>.oci.oraclecloud.com
# endpoint and callers present OAuth 2.0 bearer tokens carrying scopes issued by OCI Identity Domains.
schemaVersion: "1"
type: "component"
id: "oci-device-data-fhir"
kind: "nosql-database"
provider: "oci"
docs: "https://docs.oracle.com/en-us/iaas/device-data-fhir/fhir-r6-resources.htm"
defaults:
  managed: true
  model: "document"
properties:
  fhirVersion:
    type: "enum"
    values: ["r4", "r6-ballot4"]
  scopedAuthorization:
    type: "boolean"
    default: true
  dedicatedEndpoint:
    type: "boolean"
    default: true
  subscriptionsSupported:
    type: "boolean"
    default: true
