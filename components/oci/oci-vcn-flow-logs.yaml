# yaml-language-server: $schema=../../schema/component.schema.json
# Oracle Cloud VCN flow logs: service log recording accepted and rejected flows for every VNIC in a
# subnet, aggregated over one-minute windows and not sampled ("Details for VCN Flow Logs").
# Flow logging is off until it is explicitly enabled on the resource.
schemaVersion: "1"
type: "component"
id: "oci-vcn-flow-logs"
kind: "monitoring"
provider: "oci"
docs: "https://docs.oracle.com/en-us/iaas/Content/Logging/Reference/details_for_vcn_flow_logs.htm"
defaults:
  managed: true
  signal: "logs"
  collectorMode: "push"
  independentOfMonitored: false
  alertGrouping: false
properties:
  scope:
    type: "enum"
    values: ["vcn", "subnet", "vnic"]
    default: "subnet"
  capturedActions:
    type: "enum"
    values: ["accept", "reject", "all"]
    default: "all"
  aggregationIntervalSeconds:
    type: "integer"
    default: 60
  sampling:
    type: "boolean"
    default: false
