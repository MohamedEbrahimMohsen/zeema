# yaml-language-server: $schema=../../schema/component.schema.json
# Oracle OCI Media Streams: a managed packager and origin that segments and encrypts adaptive
# bitrate content and hands delivery to an edge network. "Media Streams Overview": a
# distribution channel pairs an origination with a packaging configuration, delivery runs over
# the no-configuration OCI Edge Stream CDN or Akamai acting on the channel as origin, and a
# tenant may hold 1,000 distribution channels and 10,000 HLS packaging configurations.
schemaVersion: "1"
type: "component"
id: "oci-media-streams"
kind: "cdn"
provider: "oci"
defaults:
  caching: true
  tls: true
  edgeCompute: false
  originShield: false
  managed: true
properties:
  packaging:
    type: "enum"
    values: ["hls"]
    default: "hls"
  delivery:
    type: "enum"
    values: ["oci-edge-stream-cdn", "akamai-stream-cdn", "direct-serve"]
  maxDistributionChannels:
    type: "integer"
    default: 1000
  maxPackagingConfigurations:
    type: "integer"
    default: 10000
