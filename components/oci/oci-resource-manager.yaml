# yaml-language-server: $schema=../../schema/component.schema.json
# OCI Resource Manager stack: managed Terraform runner that stores and locks the state file for you.
# Jobs (plan, apply, destroy, drift detection) are started by hand and only one job runs per stack at
# a time, so there is no trigger and no approval gate. Facts from "Overview of Resource Manager".
schemaVersion: "1"
type: "component"
id: "oci-resource-manager"
kind: "ci-pipeline"
provider: "oci"
defaults:
  managed: true
  trigger: "manual"
  selfHostedRunners: false
  approvalRequired: false
  concurrency: 1
properties:
  jobType:
    type: "enum"
    values: ["plan", "apply", "destroy", "import-state", "drift-detection"]
  stateManagedByService:
    type: "boolean"
    default: true
  driftDetection:
    type: "boolean"
    default: false
  configurationSource:
    type: "enum"
    values: ["zip-upload", "object-storage", "github", "gitlab", "bitbucket", "devops"]
