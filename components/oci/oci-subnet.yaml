# yaml-language-server: $schema=../../schema/component.schema.json
# Oracle Cloud subnet: subdivision of a VCN, regional or availability-domain scoped ("Creating a
# Subnet"). DNS hostnames are opt-in and IPv6 prefixes are opt-in; a subnet may carry up to five
# security lists (Service Limits: security lists per subnet = 5).
schemaVersion: "1"
type: "component"
id: "oci-subnet"
kind: "network-fabric"
provider: "oci"
defaults:
  managed: true
  overlay: true
  interconnect: "private"
  multicast: false
properties:
  scope:
    type: "enum"
    values: ["regional", "availability-domain"]
    default: "regional"
  access:
    type: "enum"
    values: ["public", "private"]
  dnsHostnames:
    type: "boolean"
    default: false
  ipv6Enabled:
    type: "boolean"
    default: false
