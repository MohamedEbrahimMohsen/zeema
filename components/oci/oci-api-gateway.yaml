# yaml-language-server: $schema=../../schema/component.schema.json
# Oracle Cloud API Gateway: managed REST front door with rate limiting and TLS.
schemaVersion: "1"
type: "component"
id: "oci-api-gateway"
kind: "api-gateway"
provider: "oci"
docs: "https://docs.oracle.com/en-us/iaas/Content/APIGateway/Concepts/apigatewayoverview.htm"
defaults:
  managed: true
  tls: true
  rateLimiting: true
  protocol: "http"
