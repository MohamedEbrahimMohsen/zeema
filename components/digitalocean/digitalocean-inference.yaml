# yaml-language-server: $schema=../../schema/component.schema.json
# DigitalOcean Inference (part of the Gradient AI platform): "a single control plane for managing
# inference workflows" with a model catalogue, routing, and serverless or dedicated deployment
# ("Inference"). Serverless inference lets you "send API requests directly to foundation models
# without creating an AI agent or managing infrastructure"; quota is reported through
# quota-specific response headers.
schemaVersion: "1"
type: "component"
id: "digitalocean-inference"
kind: "ai-service"
provider: "digitalocean"
docs: "https://docs.digitalocean.com/products/inference/"
defaults:
  auth: "api-key"
  managed: true
  modality: "multimodal"
  publicEndpoint: true
properties:
  deploymentMode:
    type: "enum"
    values: ["serverless", "dedicated"]
    default: "serverless"
  modelSource:
    type: "enum"
    values: ["digitalocean-hosted", "third-party-commercial"]
