# yaml-language-server: $schema=../../schema/component.schema.json
# DigitalOcean Volume: "network-attached block storage" for Droplets and Kubernetes nodes, moved
# between Droplets in the same datacenter and snapshotted on demand ("Volumes"). "Volumes
# Features": SSD-backed with bursting, built on Ceph with replication across multiple hosts, and
# "All DigitalOcean Volumes are encrypted with LUKS", an encryption snapshots inherit. "Volumes
# Limits": 1 GiB to 16,384 GiB, 15 volumes per Droplet or DOKS node, 5,000 volumes per account,
# and 7,500 IOPS on shared-CPU Droplets against 10,000 on dedicated.
schemaVersion: "1"
type: "component"
id: "digitalocean-volumes"
kind: "block-storage"
provider: "digitalocean"
docs: "https://docs.digitalocean.com/products/volumes/"
defaults:
  managed: true
  mediaType: "ssd"
  encryptionAtRest: true
  redundancy: "zonal"
  snapshots: false
properties:
  minSizeGib:
    type: "integer"
    default: 1
  maxSizeGib:
    type: "integer"
    default: 16384
  maxVolumesPerDroplet:
    type: "integer"
    default: 15
  maxIopsSharedCpu:
    type: "integer"
    default: 7500
  maxIopsDedicatedCpu:
    type: "integer"
    default: 10000
