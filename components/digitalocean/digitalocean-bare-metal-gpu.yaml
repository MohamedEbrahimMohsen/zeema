# yaml-language-server: $schema=../../schema/component.schema.json
# DigitalOcean Bare Metal GPUs: "dedicated, single-tenant servers with 8 GPUs of various models
# that can operate standalone or in multi-node clusters" ("Bare Metal GPUs"). Unlike GPU
# Droplets, which are a Droplet plan family on virtualized hardware, these are physical machines
# provisioned through DigitalOcean sales. AMD MI300X is among the available GPU models.
schemaVersion: "1"
type: "component"
id: "digitalocean-bare-metal-gpu"
kind: "virtual-machine"
provider: "digitalocean"
docs: "https://docs.digitalocean.com/products/bare-metal-gpus/"
defaults:
  managed: false
  os: "linux"
  zoneRedundant: false
properties:
  tenancy:
    type: "enum"
    values: ["single-tenant"]
    default: "single-tenant"
  gpusPerServer:
    type: "integer"
    default: 8
  multiNodeCluster:
    type: "boolean"
    default: false
