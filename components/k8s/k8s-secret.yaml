# yaml-language-server: $schema=../../schema/component.schema.json
# Kubernetes Secret: a small object holding a password, token or key. Per "Secrets" the values are
# base64 encoded for convenience, not encrypted: they are stored unencrypted in etcd unless
# encryption at rest is enabled explicitly, and anyone with API access to the namespace -- or read
# access to etcd -- can retrieve them. The default type is Opaque, the cap is 1 MiB, and a Secret
# is mutable unless immutable: true is set. Kubernetes does not rotate Secret material.
schemaVersion: "1"
type: "component"
id: "k8s-secret"
kind: "key-management"
provider: "k8s"
docs: "https://kubernetes.io/docs/concepts/configuration/secret/"
defaults:
  managed: false
  hsm: false
  rotationAutomated: false
  envelopeEncryption: false
properties:
  encryptionAtRest:
    type: "boolean"
    default: false
  base64Encoded:
    type: "boolean"
    default: true
  secretType:
    type: "enum"
    values: ["opaque", "service-account-token", "docker-cfg", "docker-config-json", "basic-auth", "ssh-auth", "tls", "bootstrap-token"]
    default: "opaque"
  maxSizeBytes:
    type: "integer"
    default: 1048576
  immutable:
    type: "boolean"
    default: false
