# yaml-language-server: $schema=../../schema/component.schema.json
# Network Error Logging: browsers report failed connections to a Cloudflare-hosted NEL endpoint.
# "Network Error Logging" describes a browser-based reporting system posting to
# a.nel.cloudflare.com; "Get started" turns it on with a dashboard toggle, so it is off until then.
schemaVersion: "1"
type: "component"
id: "cloudflare-network-error-logging"
kind: "monitoring"
provider: "cloudflare"
docs: "https://developers.cloudflare.com/network-error-logging/"
aliases: ["NEL"]
defaults:
  managed: true
  signal: "logs"
  collectorMode: "push"
properties:
  monitoringEnabled:
    type: "boolean"
    default: false
  cloudflareHostedEndpoint:
    type: "boolean"
    default: true
