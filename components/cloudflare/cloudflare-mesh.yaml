# yaml-language-server: $schema=../../schema/component.schema.json
# Cloudflare Mesh: post-quantum encrypted private connectivity between servers running the
# Cloudflare One Client headless and enrolled devices. Every participant gets a Mesh IP out of
# 100.96.0.0/12 and all traffic passes through Cloudflare ("Cloudflare Mesh").
schemaVersion: "1"
type: "component"
id: "cloudflare-mesh"
kind: "network-fabric"
provider: "cloudflare"
defaults:
  managed: true
  overlay: true
  interconnect: "cloud-backbone"
properties:
  tunnelProtocol:
    type: "enum"
    values: ["masque", "wireguard"]
    default: "masque"
  meshIpRange:
    type: "string"
    default: "100.96.0.0/12"
  postQuantumEncryption:
    type: "boolean"
    default: true
