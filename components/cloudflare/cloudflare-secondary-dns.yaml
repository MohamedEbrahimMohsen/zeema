# yaml-language-server: $schema=../../schema/component.schema.json
# Cloudflare Secondary DNS: Cloudflare serves a zone it pulls from a primary provider.
# "Zone transfers": incoming AXFR/IXFR transfers, one TSIG shared secret per peer, Enterprise only.
schemaVersion: "1"
type: "component"
id: "cloudflare-secondary-dns"
kind: "dns"
provider: "cloudflare"
defaults:
  managed: true
  anycast: true
  redundantProviders: true
properties:
  transferDirection:
    type: "enum"
    values: ["incoming", "outgoing"]
    default: "incoming"
  incrementalTransfer:
    type: "boolean"
    default: false
  tsigAuthentication:
    type: "boolean"
    default: false
