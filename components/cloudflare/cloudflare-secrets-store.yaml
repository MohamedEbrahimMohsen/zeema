# yaml-language-server: $schema=../../schema/component.schema.json
# Secrets Store: an account-level store for secrets consumed by Workers and AI Gateway. "Secrets
# Store" states secrets are securely encrypted and stored across all Cloudflare data centers, and
# documents no automatic rotation, so rotation stays manual. Currently open beta.
schemaVersion: "1"
type: "component"
id: "cloudflare-secrets-store"
kind: "key-management"
provider: "cloudflare"
docs: "https://developers.cloudflare.com/secrets-store/"
defaults:
  managed: true
  hsm: false
  rotationAutomated: false
properties:
  scope:
    type: "enum"
    values: ["account", "zone"]
    default: "account"
  encryptedAtRest:
    type: "boolean"
    default: true
  bindingExposed:
    type: "boolean"
    default: true
