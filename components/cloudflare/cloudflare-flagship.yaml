# yaml-language-server: $schema=../../schema/component.schema.json
# Cloudflare Flagship: feature flags evaluated inside Workers through a binding, or remotely
# through the OpenFeature SDKs ("Cloudflare Flagship"). Flags belong to an app and support
# percentage rollouts with consistent hashing, so staged rollout is available out of the box.
schemaVersion: "1"
type: "component"
id: "cloudflare-flagship"
kind: "feature-flag-service"
provider: "cloudflare"
docs: "https://developers.cloudflare.com/flagship/"
defaults:
  stagedRollout: true
  managed: true
properties:
  evaluation:
    type: "enum"
    values: ["worker-binding", "openfeature-sdk"]
    default: "worker-binding"
  variantType:
    type: "enum"
    values: ["boolean", "string", "number", "json"]
    default: "boolean"
  consistentHashing:
    type: "boolean"
    default: true
