# yaml-language-server: $schema=../../schema/component.schema.json
# Cloudflare DNS: managed anycast authoritative DNS. Records are proxied through the edge by default.
schemaVersion: "1"
type: "component"
id: "cloudflare-dns"
kind: "dns"
provider: "cloudflare"
docs: "https://developers.cloudflare.com/dns/"
defaults:
  managed: true
  anycast: true
properties:
  proxied:
    type: "boolean"
    default: true
