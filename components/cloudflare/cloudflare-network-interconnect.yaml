# yaml-language-server: $schema=../../schema/component.schema.json
# Cloudflare Network Interconnect: a private link into Cloudflare instead of the public Internet,
# as a physical cross-connect, through a connectivity partner, or as a cloud circuit; dataplane v2
# routes without GRE tunnelling ("Cloudflare Network Interconnect overview").
schemaVersion: "1"
type: "component"
id: "cloudflare-network-interconnect"
kind: "network-fabric"
provider: "cloudflare"
docs: "https://developers.cloudflare.com/network-interconnect/"
aliases: ["CNI"]
defaults:
  managed: true
  interconnect: "private"
properties:
  connectionType:
    type: "enum"
    values: ["direct", "partner", "cloud"]
  dataplaneVersion:
    type: "enum"
    values: ["v1", "v2"]
