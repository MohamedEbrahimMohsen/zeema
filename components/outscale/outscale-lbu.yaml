# yaml-language-server: $schema=../../schema/component.schema.json
# OUTSCALE Load Balancer Unit (LBU): a managed load balancer in front of backend VMs
# ("About Load Balancers"). That page states what drives the defaults: listeners speak
# HTTP/HTTPS or TCP/SSL and a frontend protocol must match its backend level, an
# internet-facing LBU gets a public DNS name while an internal one is reachable only inside
# the Net's CIDR, health checks decide which backends receive traffic, TLS 1.1 to 1.3 is
# supported, and sticky sessions exist for HTTP/HTTPS listeners only.
schemaVersion: "1"
type: "component"
id: "outscale-lbu"
kind: "load-balancer"
provider: "outscale"
docs: "https://docs.outscale.com/en/userguide/About-Load-Balancers.html"
defaults:
  managed: true
  healthChecks: true
  global: false
properties:
  scheme:
    type: "enum"
    values: ["internet-facing", "internal"]
  listenerProtocol:
    type: "enum"
    values: ["http", "https", "tcp", "ssl"]
  stickySessions:
    type: "enum"
    values: ["none", "duration-based", "application-controlled"]
  minimumTlsVersion:
    type: "string"
    default: "1.1"
