# yaml-language-server: $schema=../../schema/component.schema.json
# Red Hat OpenShift on IBM Cloud: OpenShift Container Platform clusters whose masters IBM
# manages, running on VPC, classic or Satellite infrastructure ("Getting started with Red Hat
# OpenShift on IBM Cloud"). OpenShift ships Kubernetes RBAC; node count and version are per
# cluster and left unset.
schemaVersion: "1"
type: "component"
id: "ibm-openshift"
kind: "container-orchestrator"
provider: "ibm"
docs: "https://cloud.ibm.com/docs/openshift?topic=openshift-getting-started"
defaults:
  managed: true
  rbac: true
properties:
  infrastructure:
    type: "enum"
    values: ["vpc", "classic", "satellite"]
  zoneSpread:
    type: "enum"
    values: ["single-zone", "multizone"]
