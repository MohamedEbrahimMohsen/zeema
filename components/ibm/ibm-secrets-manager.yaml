# yaml-language-server: $schema=../../schema/component.schema.json
# IBM Cloud Secrets Manager: "create, lease, and centrally manage secrets that are used in IBM
# Cloud services or your custom-built applications", as "a dedicated, single-tenant instance"
# "built on HashiCorp Vault" ("Getting started with Secrets Manager"). Rotation is available per
# secret type but is not applied unless a rotation policy is set, so rotationAutomated is false.
schemaVersion: "1"
type: "component"
id: "ibm-secrets-manager"
kind: "key-management"
provider: "ibm"
docs: "https://cloud.ibm.com/docs/secrets-manager?topic=secrets-manager-getting-started"
defaults:
  managed: true
  rotationAutomated: false
properties:
  tenancy:
    type: "enum"
    values: ["dedicated"]
    default: "dedicated"
  secretType:
    type: "enum"
    values: ["arbitrary", "username-password", "iam-credentials", "imported-certificate", "public-certificate", "private-certificate", "kv", "service-credentials"]
