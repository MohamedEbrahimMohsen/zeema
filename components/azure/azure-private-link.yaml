# yaml-language-server: $schema=../../schema/component.schema.json
# Azure Private Link / Private Endpoint: a NIC in your subnet mapped to one instance of a PaaS or partner
# service, reached over the Microsoft backbone ("What is Azure Private Link?"). A private endpoint does
# not by itself restrict public network access, and it needs separate private DNS settings to resolve.
schemaVersion: "1"
type: "component"
id: "azure-private-link"
kind: "private-link"
provider: "azure"
docs: "https://learn.microsoft.com/en-us/azure/private-link/private-link-overview"
defaults:
  managed: true
  crossRegion: true
  publicAccessDisabled: false
  privateDnsIntegration: false
properties:
  linkType:
    type: "enum"
    values: ["private-endpoint", "private-link-service"]
  connectionApproval:
    type: "enum"
    values: ["automatic", "manual"]
  zoneResilient:
    type: "boolean"
    default: true
