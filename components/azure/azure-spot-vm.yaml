# yaml-language-server: $schema=../../schema/component.schema.json
# Azure Spot Virtual Machines: unused capacity that Azure reclaims with 30 seconds' notice and no
# SLA ("About Azure Spot Virtual Machines"). The eviction policy defaults to Deallocate and the max
# price defaults to -1, which means the VM is never evicted for price reasons.
schemaVersion: "1"
type: "component"
id: "azure-spot-vm"
kind: "virtual-machine"
provider: "azure"
docs: "https://learn.microsoft.com/en-us/azure/virtual-machines/spot-vms"
defaults:
  managed: false
  diskEncryption: true
  zoneRedundant: false
properties:
  evictionPolicy:
    type: "enum"
    values: ["deallocate", "delete"]
    default: "deallocate"
  maxPriceUsd:
    type: "string"
    default: "-1"
  evictionNoticeSeconds:
    type: "integer"
    default: 30
  slaBacked:
    type: "boolean"
    default: false
