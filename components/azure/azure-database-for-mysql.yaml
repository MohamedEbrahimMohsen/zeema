# yaml-language-server: $schema=../../schema/component.schema.json
# Azure Database for MySQL flexible server: managed MySQL Community Edition.
# "Azure Database for MySQL flexible server": automatic backups retained 7 days by default
# (1-35), AES-256 storage encryption with system-managed keys, TLS enforced by default,
# and high availability plus read replicas are opt-in.
schemaVersion: "1"
type: "component"
id: "azure-database-for-mysql"
kind: "sql-database"
provider: "azure"
docs: "https://learn.microsoft.com/en-us/azure/mysql/flexible-server/overview"
defaults:
  managed: true
  replication: "none"
  backupEnabled: true
  backupRetentionDays: 7
  encryptionAtRest: true
properties:
  computeTier:
    type: "enum"
    values: ["burstable", "general-purpose", "memory-optimized"]
  highAvailability:
    type: "enum"
    values: ["disabled", "same-zone", "zone-redundant"]
    default: "disabled"
  geoRedundantBackup:
    type: "boolean"
    default: false
  tlsEnforced:
    type: "boolean"
    default: true
  readReplicas:
    type: "integer"
    default: 0
