# yaml-language-server: $schema=../../schema/component.schema.json
# Azure NetApp Files: first-party bare-metal file service serving NFSv3, NFSv4.1, SMB and dual
# protocol volumes out of a capacity pool of at least 1 TiB, with encryption at rest and
# snapshots built in ("What is Azure NetApp Files", "Service levels for Azure NetApp Files").
schemaVersion: "1"
type: "component"
id: "azure-netapp-files"
kind: "file-storage"
provider: "azure"
docs: "https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-introduction"
aliases: ["ANF"]
defaults:
  protocol: "multi"
  managed: true
properties:
  serviceLevel:
    type: "enum"
    values: ["standard", "premium", "ultra", "flexible", "elastic"]
  qosType:
    type: "enum"
    values: ["auto", "manual", "shared"]
  minCapacityPoolTib:
    type: "integer"
    default: 1
  maxVolumeTib:
    type: "integer"
    default: 100
  crossRegionReplication:
    type: "boolean"
    default: false
