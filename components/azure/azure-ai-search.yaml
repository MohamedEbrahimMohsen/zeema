# yaml-language-server: $schema=../../schema/component.schema.json
# Azure AI Search: managed search service partitioned by hash with one replica by default.
schemaVersion: "1"
type: "component"
id: "azure-ai-search"
kind: "search-index"
provider: "azure"
docs: "https://learn.microsoft.com/en-us/azure/search/search-what-is-azure-search"
aliases: ["Azure Cognitive Search", "Azure Search"]
defaults:
  structure: "inverted"
  shardingStrategy: "hash"
  indexing: "async"
  replicas: 1
  managed: true
properties:
  partitions:
    type: "integer"
    default: 1
  vectorSearch:
    type: "boolean"
    default: false
