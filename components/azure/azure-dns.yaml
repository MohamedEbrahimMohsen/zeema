# yaml-language-server: $schema=../../schema/component.schema.json
# Azure DNS: managed anycast authoritative DNS. Geo and failover routing need Traffic Manager.
schemaVersion: "1"
type: "component"
id: "azure-dns"
kind: "dns"
provider: "azure"
docs: "https://learn.microsoft.com/en-us/azure/dns/dns-overview"
defaults:
  managed: true
  anycast: true
properties:
  trafficManager:
    type: "boolean"
    default: false
