# yaml-language-server: $schema=../../schema/component.schema.json
# Azure API Management: managed API gateway with policy pipeline. Rate limiting and auth are opt-in policies.
schemaVersion: "1"
type: "component"
id: "azure-api-management"
kind: "api-gateway"
provider: "azure"
docs: "https://learn.microsoft.com/en-us/azure/api-management/api-management-key-concepts"
aliases: ["APIM"]
defaults:
  managed: true
  tls: true
  rateLimiting: false
properties:
  tier:
    type: "enum"
    values: ["consumption", "developer", "basic", "standard", "premium"]
    default: "developer"
