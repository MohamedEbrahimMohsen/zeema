# yaml-language-server: $schema=../../schema/component.schema.json
# Azure Data Factory pipeline: managed data-movement and orchestration. Pipelines run manually until a trigger is attached.
schemaVersion: "1"
type: "component"
id: "azure-data-factory"
kind: "worker"
provider: "azure"
docs: "https://learn.microsoft.com/en-us/azure/data-factory/introduction"
defaults:
  managed: true
  trigger: "manual"
properties:
  integrationRuntime:
    type: "enum"
    values: ["azure", "self-hosted", "azure-ssis"]
    default: "azure"
