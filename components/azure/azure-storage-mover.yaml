# yaml-language-server: $schema=../../schema/component.schema.json
# Azure Storage Mover: managed migration service that copies file shares and buckets into Azure
# Storage. Migrations start when you start them, so jobs are on demand, and a copy runs either
# through an agent VM deployed near the source or agentless ("Introduction to Azure Storage
# Mover").
schemaVersion: "1"
type: "component"
id: "azure-storage-mover"
kind: "worker"
provider: "azure"
defaults:
  trigger: "manual"
  managed: true
properties:
  migrationMode:
    type: "enum"
    values: ["agent-based", "agentless"]
    default: "agent-based"
  sourceProtocol:
    type: "enum"
    values: ["smb", "nfs", "s3", "azure-blob"]
  targetType:
    type: "enum"
    values: ["blob-container", "file-share"]
