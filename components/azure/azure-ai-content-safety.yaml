# yaml-language-server: $schema=../../schema/component.schema.json
# Azure AI Content Safety: text and image harm detection plus prompt shields, groundedness and protected material detection.
# "What is Azure AI Content Safety?" gives the S0 rate limits (1,000 requests per 10 seconds for the moderation APIs, so 6,000 per minute) and the input limits of 10,000 characters for analyze text and 4 MB for analyze image; managed identity is enabled automatically on resource creation.
schemaVersion: "1"
type: "component"
id: "azure-ai-content-safety"
kind: "ai-service"
provider: "azure"
docs: "https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview"
defaults:
  managed: true
  modality: "multimodal"
  contentFiltering: true
  publicEndpoint: true
  customerManagedKeys: false
  quotaUnitsPerMinute: 6000
properties:
  tier:
    type: "enum"
    values: ["f0", "s0"]
  maxTextLength:
    type: "integer"
    default: 10000
  maxImageSizeMb:
    type: "integer"
    default: 4
  blocklists:
    type: "boolean"
    default: false
  customCategories:
    type: "boolean"
    default: false
