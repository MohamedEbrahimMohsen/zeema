# yaml-language-server: $schema=../../schema/component.schema.json
# Azure Functions: managed FaaS. Consumption plan by default with a 5-minute function timeout.
schemaVersion: "1"
type: "component"
id: "azure-functions"
kind: "app-server"
provider: "azure"
docs: "https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview"
defaults:
  managed: true
  stateless: true
  autoscaling: true
properties:
  # What invokes the function: its trigger binding ("Azure Functions triggers and bindings"). No
  # default: a function app has none until one is declared.
  trigger:
    type: "enum"
    values: ["http", "timer", "queue-storage", "service-bus", "event-grid", "event-hubs", "blob", "cosmos-db", "durable"]
  timeoutSeconds:
    type: "integer"
    default: 300
  plan:
    type: "enum"
    values: ["consumption", "flex-consumption", "premium", "dedicated"]
    default: "consumption"
