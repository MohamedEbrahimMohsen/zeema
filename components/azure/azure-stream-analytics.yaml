# yaml-language-server: $schema=../../schema/component.schema.json
# Azure Stream Analytics: managed SQL-style stream jobs. Uses arrival time unless TIMESTAMP BY is given,
# guarantees exactly-once to supported outputs, late-arriving events are adjusted (shifted) by default.
schemaVersion: "1"
type: "component"
id: "azure-stream-analytics"
kind: "stream-processor"
provider: "azure"
defaults:
  managed: true
  windowing: "processing-time"
  exactlyOnce: true
  stateBackend: "external"
  lateDataPolicy: "shift"
properties:
  streamingUnits:
    type: "integer"
