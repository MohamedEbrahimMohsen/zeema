# yaml-language-server: $schema=../../schema/component.schema.json
# Azure Sphere: secured crossover MCU running the Azure Sphere OS, attested and updated by the
# Azure Sphere Security Service ("What is Azure Sphere"): password-less certificate auth,
# automatic OS and application updates, at least 4 MB RAM and 16 MB integrated flash.
schemaVersion: "1"
type: "component"
id: "azure-sphere"
kind: "client"
provider: "azure"
defaults:
  platform: "embedded"
properties:
  automaticOsUpdates:
    type: "boolean"
    default: true
  remoteAttestation:
    type: "boolean"
    default: true
  integratedRamMb:
    type: "integer"
    default: 4
  integratedFlashMb:
    type: "integer"
    default: 16
