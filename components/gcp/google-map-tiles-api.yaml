# yaml-language-server: $schema=../../schema/component.schema.json
# Google Map Tiles API: serves 2D map tiles, Street View tiles and Photorealistic 3D Tiles in OGC 3D Tiles format.
# "Map Tiles API Usage and Billing": 6,000 2D/Street View tile queries per project per minute and 15,000 per day;
# 10,000 3D root tileset queries per day with a 12,000 queries per minute tile-renderer limit; requests use session tokens.
schemaVersion: "1"
type: "component"
id: "google-map-tiles-api"
kind: "third-party-api"
provider: "gcp"
docs: "https://developers.google.com/maps/documentation/tile/usage-and-billing"
defaults:
  managed: true
  idempotent: true
  callbackStyle: "none"
  hostedPage: false
  handlesMoney: false
  slaPercent: "99.9"
properties:
  tileQueriesPerMinute:
    type: "integer"
    default: 6000
  tileQueriesPerDay:
    type: "integer"
    default: 15000
  rendererQueriesPerMinute:
    type: "integer"
    default: 12000
  sessionToken:
    type: "boolean"
    default: true
