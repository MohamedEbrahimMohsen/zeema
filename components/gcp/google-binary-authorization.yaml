# yaml-language-server: $schema=../../schema/component.schema.json
# Binary Authorization: deploy-time admission control for GKE, Cloud Run, Cloud Service Mesh and
# Google Distributed Cloud. Per "Set up for GKE / configure a policy", the policy a project starts
# with carries defaultAdmissionRule evaluationMode ALWAYS_ALLOW with enforcementMode
# ENFORCED_BLOCK_AND_AUDIT_LOG, so enforcement is on but every image passes until a rule is added.
schemaVersion: "1"
type: "component"
id: "google-binary-authorization"
kind: "policy-engine"
provider: "gcp"
docs: "https://cloud.google.com/binary-authorization/docs/overview"
defaults:
  effect: "deny"
  enforcementMode: "enforced"
  scope: "account"
  remediation: false
  managed: true
properties:
  defaultEvaluationMode:
    type: "enum"
    values: ["always-allow", "always-deny", "require-attestation"]
    default: "always-allow"
  platform:
    type: "enum"
    values: ["gke", "cloud-run", "cloud-service-mesh", "google-distributed-cloud"]
  dryRun:
    type: "boolean"
    default: false
  continuousValidation:
    type: "boolean"
    default: false
