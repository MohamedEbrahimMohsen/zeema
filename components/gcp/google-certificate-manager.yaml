# yaml-language-server: $schema=../../schema/component.schema.json
# Certificate Manager: issues and automatically renews Google-managed TLS certificates for
# load balancers, selected through certificate maps; DNS authorization covers up to 100 SANs,
# load balancer authorization up to 5 ("Certificate Manager overview").
schemaVersion: "1"
type: "component"
id: "google-certificate-manager"
kind: "key-management"
provider: "gcp"
docs: "https://cloud.google.com/certificate-manager/docs/overview"
defaults:
  managed: true
  hsm: false
  rotationAutomated: true
properties:
  certificateType:
    type: "enum"
    values: ["google-managed", "self-managed"]
    default: "google-managed"
  domainAuthorization:
    type: "enum"
    values: ["dns", "load-balancer"]
  certificateMap:
    type: "boolean"
    default: false
