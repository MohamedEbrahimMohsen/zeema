# yaml-language-server: $schema=../../schema/component.schema.json
# Certificate Authority Service: a CA pool issuing private certificates. The operation tier is
# required and immutable at pool creation; DevOps cannot list, describe or revoke certificates
# and supports HSM-protected keys only, Enterprise adds those operations and Cloud KMS keys
# ("CA Service overview", "Select the operation tiers").
schemaVersion: "1"
type: "component"
id: "google-certificate-authority-service"
kind: "key-management"
provider: "gcp"
docs: "https://cloud.google.com/certificate-authority-service/docs/ca-service-overview"
defaults:
  managed: true
  hsm: true
  rotationAutomated: false
properties:
  tier:
    type: "enum"
    values: ["devops", "enterprise"]
  certificateRevocation:
    type: "boolean"
  customerManagedKey:
    type: "boolean"
    default: false
