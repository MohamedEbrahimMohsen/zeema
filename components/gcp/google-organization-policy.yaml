# yaml-language-server: $schema=../../schema/component.schema.json
# Organization Policy Service: constraints set on an organization, folder or project and inherited by
# every descendant. Per "Introduction to the Organization Policy Service" a policy in active mode
# blocks violations while a dry-run policy only audit-logs them, and constraints come as Google
# managed constraints, custom constraints or legacy managed constraints.
schemaVersion: "1"
type: "component"
id: "google-organization-policy"
kind: "policy-engine"
provider: "gcp"
defaults:
  effect: "deny"
  enforcementMode: "enforced"
  scope: "organization"
  remediation: false
  managed: true
properties:
  constraintType:
    type: "enum"
    values: ["managed", "custom", "legacy-managed"]
  dryRun:
    type: "boolean"
    default: false
