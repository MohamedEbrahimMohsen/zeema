# yaml-language-server: $schema=../../schema/component.schema.json
# Google Air Quality API: current conditions, hourly forecast, history and heatmap tiles for air quality indexes.
# "Air Quality API Usage and Billing": query rate limit of 6,000 requests per minute for each API method.
# Covered by the Google Maps Platform SLA (99.9% Monthly Uptime Percentage per Covered Service).
schemaVersion: "1"
type: "component"
id: "google-air-quality-api"
kind: "third-party-api"
provider: "gcp"
defaults:
  managed: true
  idempotent: true
  callbackStyle: "none"
  hostedPage: false
  handlesMoney: false
  slaPercent: "99.9"
properties:
  queriesPerMinutePerMethod:
    type: "integer"
    default: 6000
  heatmapTiles:
    type: "boolean"
    default: true
