# yaml-language-server: $schema=../../schema/component.schema.json
# Cloud SQL: managed MySQL, PostgreSQL and SQL Server instances. "Create instances" states
# backups are on by default with seven days of retained write-ahead logs, Google-managed
# encryption is the default, and point-in-time recovery is enabled at instance creation.
schemaVersion: "1"
type: "component"
id: "google-cloud-sql"
kind: "sql-database"
provider: "gcp"
defaults:
  backupEnabled: true
  backupRetentionDays: 7
  encryptionAtRest: true
  managed: true
properties:
  engine:
    type: "enum"
    values: ["postgres", "mysql", "sql-server"]
  edition:
    type: "enum"
    values: ["enterprise", "enterprise-plus"]
    default: "enterprise"
  availabilityType:
    type: "enum"
    values: ["zonal", "regional"]
    default: "zonal"
  pointInTimeRecovery:
    type: "boolean"
    default: true
