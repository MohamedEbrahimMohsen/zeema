# yaml-language-server: $schema=../../schema/component.schema.json
# Google Aerial View API: returns a rendered aerial flyover video for an address or place.
# "videos.lookupVideo" reference: renderVideo is asynchronous; lookupVideo answers with playback URIs for ACTIVE videos,
# a PROCESSING state for pending videos, or 404, so the caller polls. The docs state no numeric per-minute quota.
schemaVersion: "1"
type: "component"
id: "google-aerial-view-api"
kind: "third-party-api"
provider: "gcp"
docs: "https://developers.google.com/maps/documentation/aerial-view/reference/rest/v1/videos/lookupVideo"
defaults:
  managed: true
  idempotent: true
  callbackStyle: "poll"
  hostedPage: false
  handlesMoney: false
  slaPercent: "99.9"
properties:
  asyncRendering:
    type: "boolean"
    default: true
  prerenderedVideos:
    type: "boolean"
    default: true
