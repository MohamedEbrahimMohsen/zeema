# yaml-language-server: $schema=../../schema/component.schema.json
# Custom Search JSON API: API-key-authenticated search over a Programmable Search Engine. Per "Custom Search JSON API" it is
# closed to new customers and existing customers must move to an alternative (Vertex AI Search) by January 1, 2027;
# 100 queries a day are free, then $5 per 1,000 up to 10,000 a day.
schemaVersion: "1"
type: "component"
id: "google-custom-search-api"
kind: "third-party-api"
provider: "gcp"
docs: "https://developers.google.com/custom-search/v1/overview"
aliases: ["Programmable Search Engine"]
defaults:
  managed: true
  hostedPage: false
  handlesMoney: false
  callbackStyle: "none"
  idempotent: true
properties:
  freeQueriesPerDay:
    type: "integer"
    default: 100
  dailyQueryCap:
    type: "integer"
    default: 10000
  apiKeyRequired:
    type: "boolean"
    default: true
  siteRestricted:
    type: "boolean"
    default: false
