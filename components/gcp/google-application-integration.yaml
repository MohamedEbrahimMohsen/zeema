# yaml-language-server: $schema=../../schema/component.schema.json
# Google Cloud Application Integration: serverless iPaaS whose integrations are drawn as a task flow and
# started by a trigger. Per "Application Integration overview" it is fully managed and auto-scaling, an
# API trigger is the basic entry point, and error catchers are added per task rather than being present.
schemaVersion: "1"
type: "component"
id: "google-application-integration"
kind: "workflow-engine"
provider: "gcp"
docs: "https://cloud.google.com/application-integration/docs/overview"
defaults:
  managed: true
  durable: true
  pattern: "dag"
properties:
  triggerType:
    type: "enum"
    values: ["api", "pubsub", "scheduler", "salesforce"]
    default: "api"
  errorCatcher:
    type: "boolean"
    default: false
  autoScaling:
    type: "boolean"
    default: true
