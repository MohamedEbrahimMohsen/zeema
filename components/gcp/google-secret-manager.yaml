# yaml-language-server: $schema=../../schema/component.schema.json
# Secret Manager: global secrets with versioned payloads, encrypted at rest with AES-256
# Google-managed keys and replicated automatically by default; a rotation schedule only
# publishes a SECRET_ROTATE Pub/Sub message, it does not create a new version
# ("Secret Manager overview", "Choose a replication policy", "Event notifications").
schemaVersion: "1"
type: "component"
id: "google-secret-manager"
kind: "key-management"
provider: "gcp"
docs: "https://cloud.google.com/secret-manager/docs/overview"
defaults:
  managed: true
  hsm: false
  rotationAutomated: false
  envelopeEncryption: true
properties:
  replicationPolicy:
    type: "enum"
    values: ["automatic", "user-managed"]
    default: "automatic"
  versioned:
    type: "boolean"
    default: true
  customerManagedEncryption:
    type: "boolean"
    default: false
  regional:
    type: "boolean"
    default: false
