# yaml-language-server: $schema=../schema/component.schema.json
schemaVersion: "1"
type: "component"
id: "sqs"
kind: "queue"
defaults:
  delivery: "at-least-once"
  ordering: "none"
  replay: false
  retentionDays: 4
properties:
  fifo:
    type: "boolean"
    default: false
  visibilityTimeoutSeconds:
    type: "integer"
    default: 30
