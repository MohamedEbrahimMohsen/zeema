# yaml-language-server: $schema=../../schema/component.schema.json
# Hologres: a "one-stop real-time data warehouse engine" that is "PostgreSQL-compatible" and runs
# "multidimensional OLAP queries and ad hoc analysis on petabyte-scale data with sub-second
# response times". Tables choose "row-oriented, column-oriented, and hybrid row-column storage
# modes" per table, and Update, Delete and Upsert are supported ("What is Hologres?").
schemaVersion: "1"
type: "component"
id: "alibaba-hologres"
kind: "data-warehouse"
provider: "alibabacloud"
docs: "https://www.alibabacloud.com/help/en/hologres/product-overview/what-is-hologres"
defaults:
  managed: true
  realtime: true
  upsert: true
properties:
  storageMode:
    type: "enum"
    values: ["row", "column", "row-column"]
  postgresCompatible:
    type: "boolean"
    default: true
