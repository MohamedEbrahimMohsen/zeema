# yaml-language-server: $schema=../../schema/component.schema.json
# Simple Message Queue (formerly MNS): a distributed messaging service for moving data and notifications
# between components of an application ("What is Simple Message Queue (formerly MNS)?"). That page states the
# queue-based model has each message consumed by only one client and that every message in a queue is
# delivered at least once during its validity period; a retrieved message then enters a configurable
# invisibility period. The same page describes a topic-based publish-subscribe model and Internet or VPC
# access. No retention or dead-letter default is documented, so neither is set.
schemaVersion: "1"
type: "component"
id: "alibaba-mns"
kind: "queue"
provider: "alibabacloud"
docs: "https://www.alibabacloud.com/help/en/mns/"
defaults:
  managed: true
  delivery: "at-least-once"
  role: "work"
properties:
  messagingModel:
    type: "enum"
    values: ["queue", "topic"]
    default: "queue"
  networkAccess:
    type: "enum"
    values: ["internet", "vpc"]
