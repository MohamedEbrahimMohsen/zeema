# yaml-language-server: $schema=../../schema/component.schema.json
# ApsaraDB for SelectDB: managed Apache Doris, a real-time analytical database holding data in
# columnar storage and answering sub-second aggregate queries over the MySQL protocol
# ("What is ApsaraDB for SelectDB").
schemaVersion: "1"
type: "component"
id: "alibaba-selectdb"
kind: "data-warehouse"
provider: "alibabacloud"
docs: "https://www.alibabacloud.com/help/en/selectdb"
defaults:
  managed: true
  realtime: true
  format: "columnar"
properties:
  engine:
    type: "enum"
    values: ["apache-doris"]
    default: "apache-doris"
