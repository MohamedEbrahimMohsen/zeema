# yaml-language-server: $schema=../../schema/component.schema.json
# AWS AppSync GraphQL API: serverless GraphQL endpoint over one or more data sources, with a
# WebSocket endpoint for subscriptions. "Configuring server-side caching" says caching behaviour is
# None unless configured, caps cache TTL at 3,600 seconds and states cache encryption at rest and
# in transit is always on; API keys are configurable for up to 365 days.
schemaVersion: "1"
type: "component"
id: "aws-appsync"
kind: "api-gateway"
provider: "aws"
defaults:
  managed: true
  tls: true
  protocol: "http"
  idempotencyKeys: false
  concurrencyLimit: false
properties:
  authorizationMode:
    type: "enum"
    values: ["api-key", "aws-iam", "amazon-cognito-user-pools", "openid-connect", "aws-lambda"]
  serverSideCaching:
    type: "enum"
    values: ["none", "full-request", "per-resolver", "operation-level"]
    default: "none"
  cacheMaxTtlSeconds:
    type: "integer"
    default: 3600
  apiKeyMaxDays:
    type: "integer"
    default: 365
  visibility:
    type: "enum"
    values: ["global", "private"]
    default: "global"
