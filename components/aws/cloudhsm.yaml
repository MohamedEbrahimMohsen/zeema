# yaml-language-server: $schema=../../schema/component.schema.json
# AWS CloudHSM: single-tenant FIPS HSM cluster; one HSM unless more are added, all key lifecycle is customer-run.
schemaVersion: "1"
type: "component"
id: "cloudhsm"
kind: "key-management"
provider: "aws"
docs: "https://docs.aws.amazon.com/cloudhsm/latest/userguide/introduction.html"
defaults:
  managed: true
  hsm: true
  rotationAutomated: false
  envelopeEncryption: false
properties:
  clusterHsmCount:
    type: "integer"
    default: 1
