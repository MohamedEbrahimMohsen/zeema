# yaml-language-server: $schema=../../schema/component.schema.json
# AWS App Mesh: managed control plane with Envoy sidecars; mTLS and retries opt-in. Reaching end of support in 2026.
schemaVersion: "1"
type: "component"
id: "aws-app-mesh"
kind: "service-mesh"
provider: "aws"
docs: "https://docs.aws.amazon.com/app-mesh/latest/userguide/what-is-app-mesh.html"
defaults:
  managed: true
  sidecar: true
  mtls: false
  retries: false
