# yaml-language-server: $schema=../../schema/component.schema.json
# AWS Lambda: managed function-as-a-service, scales per request, 3-second timeout and 128 MB by default.
schemaVersion: "1"
type: "component"
id: "lambda"
kind: "app-server"
provider: "aws"
docs: "https://docs.aws.amazon.com/lambda/latest/dg/welcome.html"
defaults:
  managed: true
  stateless: true
  autoscaling: true
properties:
  # What invokes the function: a function URL (http), an event source mapping or a service
  # integration ("Invoking Lambda with events from other AWS services"). No default.
  trigger:
    type: "enum"
    values: ["http", "api-gateway", "schedule", "sqs", "sns", "eventbridge", "s3", "dynamodb-streams", "kinesis", "step-functions"]
  timeoutSeconds:
    type: "integer"
    default: 3
  memoryMb:
    type: "integer"
    default: 128
