# yaml-language-server: $schema=../../schema/component.schema.json
# AWS IAM: policy-based access for AWS principals; MFA optional, Identity Center opt-in.
schemaVersion: "1"
type: "component"
id: "aws-iam"
kind: "identity-provider"
provider: "aws"
docs: "https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html"
aliases: ["IAM"]
defaults:
  protocol: "iam"
  authorizationModel: "rbac"
  managed: true
  mfa: false
properties:
  identityCenter:
    type: "boolean"
    default: false
