# yaml-language-server: $schema=../../schema/component.schema.json
# Amazon SageMaker AI training job: a managed containerized batch training run on ML compute instances
# that SageMaker provisions and tears down. Per the CreateTrainingJob API Reference, network isolation,
# inter-container traffic encryption, managed spot training and VpcConfig are all opt-in.
schemaVersion: "1"
type: "component"
id: "aws-sagemaker-training-job"
kind: "worker"
provider: "aws"
defaults:
  managed: true
  trigger: "batch"
properties:
  networkIsolation:
    type: "boolean"
    default: false
  interContainerTrafficEncryption:
    type: "boolean"
    default: false
  managedSpotTraining:
    type: "boolean"
    default: false
  vpcAttached:
    type: "boolean"
    default: false
