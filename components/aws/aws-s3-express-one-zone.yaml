# yaml-language-server: $schema=../../schema/component.schema.json
# Amazon S3 Express One Zone directory bucket: single-Availability-Zone S3 storage class for
# latency-sensitive workloads. "High performance workloads": 99.95% availability in one zone,
# SSE-S3 automatic encryption, Block Public Access on by default and unmodifiable, strong read-after-write.
schemaVersion: "1"
type: "component"
id: "aws-s3-express-one-zone"
kind: "object-store"
provider: "aws"
docs: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-express-one-zone.html"
defaults:
  zones: 1
  durabilityNines: 11
  tier: "hot"
  strongReadAfterWrite: true
  checksumOnWrite: true
  encryptionAtRest: true
  versioning: false
  objectLock: false
  managed: true
properties:
  encryptionType:
    type: "enum"
    values: ["sse-s3", "sse-kms"]
    default: "sse-s3"
  blockPublicAccess:
    type: "boolean"
    default: true
  sessionBasedAuthorization:
    type: "boolean"
    default: true
  checksumAlgorithm:
    type: "enum"
    values: ["crc32", "crc32c", "sha-1", "sha-256"]
    default: "crc32"
