# yaml-language-server: $schema=../../schema/component.schema.json
# AWS elastic network interface: a virtual network card bound to one subnet and Availability Zone.
# "Elastic network interfaces": source/destination checking is enabled by default, the public IPv4
# attribute is inherited from the subnet, and EFA (kernel bypass) is a separate interface type.
schemaVersion: "1"
type: "component"
id: "aws-elastic-network-interface"
kind: "network-fabric"
provider: "aws"
docs: "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-eni.html"
aliases: ["ENI"]
defaults:
  managed: true
  multicast: false
  kernelBypass: false
properties:
  sourceDestCheck:
    type: "boolean"
    default: true
  elasticIpAssociated:
    type: "boolean"
    default: false
  detachable:
    type: "boolean"
    default: true
  interfacesPerRegionQuota:
    type: "integer"
    default: 5000
