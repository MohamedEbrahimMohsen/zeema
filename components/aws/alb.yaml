# yaml-language-server: $schema=../../schema/component.schema.json
# AWS Application Load Balancer: managed L7 balancer, always cross-zone, health checks on by default.
schemaVersion: "1"
type: "component"
id: "alb"
kind: "load-balancer"
provider: "aws"
docs: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html"
defaults:
  layer: "l7"
  managed: true
  hashing: "round-robin"
  healthChecks: true
properties:
  crossZone:
    type: "boolean"
    default: true
