# yaml-language-server: $schema=../../schema/component.schema.json
# AWS Glue job: serverless Spark or Python shell ETL run on demand or by trigger; job bookmarks off by default.
schemaVersion: "1"
type: "component"
id: "glue-job"
kind: "worker"
provider: "aws"
docs: "https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html"
defaults:
  managed: true
  trigger: "batch"
properties:
  jobBookmark:
    type: "boolean"
    default: false
