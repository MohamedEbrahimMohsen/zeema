# yaml-language-server: $schema=../../schema/component.schema.json
# Amazon CloudFront: managed CDN. Origin Shield and edge functions are opt-in.
schemaVersion: "1"
type: "component"
id: "cloudfront"
kind: "cdn"
provider: "aws"
docs: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html"
defaults:
  managed: true
  edgeCompute: false
  originShield: false
properties:
  signedUrls:
    type: "boolean"
    default: false
