# yaml-language-server: $schema=../../schema/component.schema.json
# Amazon S3: managed object store spread over three zones with eleven nines of durability,
# strong read-after-write, default encryption and opt-in versioning.
schemaVersion: "1"
type: "component"
id: "s3"
kind: "object-store"
provider: "aws"
docs: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"
defaults:
  zones: 3
  durabilityNines: 11
  replication: "erasure-coded"
  strongReadAfterWrite: true
  checksumOnWrite: true
  encryptionAtRest: true
  versioning: false
  managed: true
properties:
  storageClass:
    type: "enum"
    values: ["standard", "intelligent-tiering", "standard-ia", "one-zone-ia", "glacier", "deep-archive"]
    default: "standard"
  crossRegionReplication:
    type: "boolean"
    default: false
