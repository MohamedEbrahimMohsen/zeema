# yaml-language-server: $schema=../../schema/component.schema.json
# Amazon API Gateway WebSocket API: managed, connection state held by AWS, backend integrates by connection id. Idle timeout is 10 minutes.
schemaVersion: "1"
type: "component"
id: "aws-api-gateway-websocket"
kind: "realtime-gateway"
provider: "aws"
docs: "https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-websocket-api.html"
defaults:
  managed: true
  protocol: "websocket"
  stateful: false
  autoscaling: true
  drainOnScaleIn: true
properties:
  connectionIdleTimeoutMinutes:
    type: "integer"
    default: 10
