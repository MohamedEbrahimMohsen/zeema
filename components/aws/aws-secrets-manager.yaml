# yaml-language-server: $schema=../../schema/component.schema.json
# AWS Secrets Manager: managed secrets encrypted under KMS data keys; rotation needs a Lambda, replication opt-in.
schemaVersion: "1"
type: "component"
id: "aws-secrets-manager"
kind: "key-management"
provider: "aws"
docs: "https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html"
defaults:
  managed: true
  hsm: false
  rotationAutomated: false
  envelopeEncryption: true
properties:
  replication:
    type: "boolean"
    default: false
