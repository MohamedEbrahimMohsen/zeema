# yaml-language-server: $schema=../../schema/component.schema.json
# Amazon DevOps Guru: applies machine learning to operational metrics and events to raise reactive and proactive
# insights, and notifies through SNS topics. "What is Amazon DevOps Guru?" and "Updating DevOps Guru settings":
# coverage, notification topics, log anomaly detection and the Systems Manager OpsCenter integration are chosen
# by the user; encryption uses a default AWS owned key unless a customer managed key is set.
schemaVersion: "1"
type: "component"
id: "aws-devops-guru"
kind: "monitoring"
provider: "aws"
docs: "https://docs.aws.amazon.com/devops-guru/latest/userguide/update-settings.html"
defaults:
  signal: "alerts"
  collectorMode: "pull"
  managed: true
properties:
  coverageScope:
    type: "enum"
    values: ["current-account", "organization"]
    default: "current-account"
  encryptionKey:
    type: "enum"
    values: ["aws-owned-key", "customer-managed-key"]
    default: "aws-owned-key"
  logAnomalyDetection:
    type: "boolean"
    default: false
  opsCenterIntegration:
    type: "boolean"
    default: false
