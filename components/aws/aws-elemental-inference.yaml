# yaml-language-server: $schema=../../schema/component.schema.json
# AWS Elemental Inference: real-time machine learning over video, audio and image content, with
# smart crop, event clipping and smart subtitles ("What Is Elemental Inference?"). The quota table
# in "AWS Elemental Inference endpoints and quotas" gives 2 active feeds per account (1 in ap-south-1
# and eu-west-1), 3 enabled outputs per feed, 1,000 feeds per account and 10 dictionaries per account.
schemaVersion: "1"
type: "component"
id: "aws-elemental-inference"
kind: "ai-service"
provider: "aws"
defaults:
  managed: true
  modality: "multimodal"
properties:
  feature:
    type: "enum"
    values: ["smart-crop", "event-clipping", "smart-subtitles"]
  activeFeeds:
    type: "integer"
    default: 2
  enabledOutputsPerFeed:
    type: "integer"
    default: 3
  maxFeeds:
    type: "integer"
    default: 1000
