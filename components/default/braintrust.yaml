# yaml-language-server: $schema=../../schema/component.schema.json
# Braintrust: SaaS evals, logging and tracing platform for LLM applications. Per "Pricing", the Starter plan
# keeps data 14 days (Pro 30) with 1 GB processed data a month; per "Self-hosting Braintrust", a hybrid
# deployment puts the data plane in your cloud while Braintrust runs the control plane, Enterprise plan only.
schemaVersion: "1"
type: "component"
id: "braintrust"
kind: "monitoring"
provider: "default"
docs: "https://www.braintrust.dev/docs/guides/self-hosting"
defaults:
  managed: true
  signal: "traces"
  collectorMode: "push"
  independentOfMonitored: true
  retentionDays: 14
properties:
  plan:
    type: "enum"
    values: ["starter", "pro", "enterprise"]
    default: "starter"
  selfHostedDataPlane:
    type: "boolean"
    default: false
