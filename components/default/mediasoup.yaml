# yaml-language-server: $schema=../../schema/component.schema.json
# mediasoup: Node.js SFU library. WebRTC transports enable UDP only by default; workers are cascaded via pipe transports.
schemaVersion: "1"
type: "component"
id: "mediasoup"
kind: "media-router"
provider: "default"
docs: "https://mediasoup.org/documentation/v3/"
defaults:
  managed: false
  mode: "sfu"
  transport: "udp"
properties:
  workersPerHost:
    type: "integer"
