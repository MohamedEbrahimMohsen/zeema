# yaml-language-server: $schema=../../schema/component.schema.json
# Apache HTTP Server as a reverse proxy and balancer. Per "Apache Module mod_proxy" the balancer
# parameter lbmethod defaults to byrequests (weighted request counting), and active health checking
# is a separate opt-in module (mod_proxy_hcheck), so it is off out of the box.
schemaVersion: "1"
type: "component"
id: "apache-httpd"
kind: "load-balancer"
provider: "default"
docs: "https://httpd.apache.org/docs/current/mod/mod_proxy.html"
defaults:
  layer: "l7"
  managed: false
  hashing: "round-robin"
  healthChecks: false
properties:
  lbMethod:
    type: "enum"
    values: ["by-requests", "by-traffic", "by-busyness", "heartbeat"]
    default: "by-requests"
  mpm:
    type: "enum"
    values: ["event", "worker", "prefork"]
    default: "event"
