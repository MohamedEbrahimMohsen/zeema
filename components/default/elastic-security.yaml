# yaml-language-server: $schema=../../schema/component.schema.json
# Elastic Security: the solution that "unifies SIEM, XDR, endpoint security, and cloud security into a
# single platform". Detection rules - prebuilt or customised - raise alerts carrying host, user and
# network context, and cases collect alerts and investigation notes for sharing
# ("Elastic Security solution & project type overview").
schemaVersion: "1"
type: "component"
id: "elastic-security"
kind: "monitoring"
provider: "default"
docs: "https://www.elastic.co/docs/solutions/security"
defaults:
  managed: false
  signal: "all"
  collectorMode: "push"
properties:
  prebuiltDetectionRules:
    type: "boolean"
    default: true
  cases:
    type: "boolean"
    default: true
  deployment:
    type: "enum"
    values: ["self-managed", "elastic-cloud", "serverless"]
