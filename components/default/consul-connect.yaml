# yaml-language-server: $schema=../../schema/component.schema.json
# Consul Connect: sidecar mesh with mTLS by default; intentions default-allow unless ACLs deny.
schemaVersion: "1"
type: "component"
id: "consul-connect"
kind: "service-mesh"
provider: "default"
docs: "https://developer.hashicorp.com/consul/docs/connect"
defaults:
  managed: false
  sidecar: true
  mtls: true
properties:
  intentionsDefaultDeny:
    type: "boolean"
    default: false
