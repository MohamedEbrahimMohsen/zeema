# yaml-language-server: $schema=../../schema/component.schema.json
# TorchServe: PyTorch model server exposing inference, management and metrics APIs.
# Defaults from "TorchServe Configuration": 127.0.0.1 on ports 8080, 8081 and 8082, and no native
# authentication, which is why the endpoints are bound to localhost out of the box.
schemaVersion: "1"
type: "component"
id: "torchserve"
kind: "ml-inference"
provider: "default"
docs: "https://docs.pytorch.org/serve/configuration.html"
defaults:
  training: "batch"
  inputs: "live"
  managed: false
properties:
  inferencePort:
    type: "integer"
    default: 8080
  managementPort:
    type: "integer"
    default: 8081
  metricsPort:
    type: "integer"
    default: 8082
  bindAddress:
    type: "string"
    default: "127.0.0.1"
  authentication:
    type: "boolean"
    default: false
