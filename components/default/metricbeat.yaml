# yaml-language-server: $schema=../../schema/component.schema.json
# Metricbeat: "a lightweight shipper that you can install on your servers to periodically collect
# metrics from the operating system and from services running on the server" ("Metricbeat"). The
# system module's default metricsets are cpu, load, memory, network, process, process_summary,
# socket_summary, filesystem, fsstat and uptime, collected on a 10 second period ("System module").
schemaVersion: "1"
type: "component"
id: "metricbeat"
kind: "monitoring"
provider: "default"
docs: "https://www.elastic.co/guide/en/beats/metricbeat/current/index.html"
defaults:
  managed: false
  signal: "metrics"
  collectorMode: "push"
properties:
  systemModulePeriodSeconds:
    type: "integer"
    default: 10
  output:
    type: "enum"
    values: ["elasticsearch", "logstash"]
