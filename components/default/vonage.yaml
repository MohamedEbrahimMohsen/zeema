# yaml-language-server: $schema=../../schema/component.schema.json
# Vonage Messages API: multi-channel messaging. "Messages API technical details" documents a
# default of 75 requests/second per API key and status/inbound webhooks; no idempotency.
schemaVersion: "1"
type: "component"
id: "vonage"
kind: "third-party-api"
provider: "default"
docs: "https://developer.vonage.com/en/messages/technical-details"
aliases: ["Nexmo"]
defaults:
  managed: true
  idempotent: false
  callbackStyle: "webhook"
  qpsQuota: 75
properties:
  channel:
    type: "enum"
    values: ["sms", "mms", "rcs", "whatsapp", "messenger", "viber", "email"]
    default: "sms"
