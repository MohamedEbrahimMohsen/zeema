# yaml-language-server: $schema=../../schema/component.schema.json
# mongos: MongoDB sharded-cluster router; targets shards by shard key and scatters otherwise.
schemaVersion: "1"
type: "component"
id: "mongos"
kind: "database-proxy"
provider: "default"
docs: "https://www.mongodb.com/docs/manual/core/sharded-cluster-query-router/"
defaults:
  pooling: true
  poolSharded: true
  routing: "shard-key"
  scatterGather: true
properties:
  configServers:
    type: "integer"
    default: 3
