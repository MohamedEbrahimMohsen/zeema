# yaml-language-server: $schema=../../schema/component.schema.json
# Bland AI: platform for building, monitoring and improving voice AI agents that place and answer phone calls, with
# conversations across phone, SMS, web and email. Per the documentation home, agents are reached through the API,
# SDKs and MCP, and enterprise deployments are secured and scaled per organisation.
schemaVersion: "1"
type: "component"
id: "bland-ai"
kind: "ai-service"
provider: "default"
docs: "https://docs.bland.ai/welcome-to-bland"
aliases: ["Bland"]
defaults:
  auth: "api-key"
  managed: true
  modality: "speech"
  publicEndpoint: true
properties:
  channel:
    type: "enum"
    values: ["phone", "sms", "web", "email"]
    default: "phone"
  pathways:
    type: "boolean"
    default: false
