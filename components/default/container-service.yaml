# yaml-language-server: $schema=../../schema/component.schema.json
# The generic app-server implementation: any containerised service you own.
# Use a vendor component instead when its specifics matter to a rule.
schemaVersion: "1"
type: "component"
id: "container-service"
kind: "app-server"
provider: "default"
docs: "https://kubernetes.io/docs/concepts/workloads/"
defaults:
  stateless: true
properties:
  orchestrator:
    type: "enum"
    values: ["none", "kubernetes", "ecs", "cloud-run"]
    default: "none"
