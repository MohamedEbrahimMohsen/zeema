# yaml-language-server: $schema=../../schema/component.schema.json
# M3: self-managed distributed metrics store fed by Prometheus remote write; aggregation tier opt-in.
schemaVersion: "1"
type: "component"
id: "m3"
kind: "monitoring"
provider: "default"
docs: "https://m3db.io/docs/"
defaults:
  signal: "metrics"
  collectorMode: "push"
  managed: false
properties:
  aggregation:
    type: "boolean"
    default: false
