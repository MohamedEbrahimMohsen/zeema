# yaml-language-server: $schema=../../schema/component.schema.json
# Docker Hub: Docker's hosted registry service. "Repositories" offers public repositories, which appear in
# search and "can be pulled by everyone", or private ones limited to collaborators; "Usage and rate limits"
# caps unauthenticated pulls at 100 per IPv4 address or IPv6 /64 subnet per 6 hours, a personal
# authenticated account at 200, and gives the free Personal plan up to 1 private repository.
schemaVersion: "1"
type: "component"
id: "docker-hub"
kind: "container-registry"
provider: "default"
docs: "https://docs.docker.com/docker-hub/usage/"
defaults:
  managed: true
  geoReplicated: false
properties:
  plan:
    type: "enum"
    values: ["personal", "pro", "team", "business"]
    default: "personal"
  anonymousPullsPerSixHours:
    type: "integer"
    default: 100
  dockerScoutEnabled:
    type: "boolean"
    default: false
