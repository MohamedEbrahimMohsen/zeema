# yaml-language-server: $schema=../../schema/component.schema.json
# PlayHT (PlayAI): hosted text to speech and voice cloning API with streaming over HTTP and WebSockets. Retired
# December 2025: Meta acquired PlayAI in July 2025, the public API stopped taking new requests later that month, and
# the platform, its accounts and voice clones were shut down on 31 December 2025.
schemaVersion: "1"
type: "component"
id: "playht"
kind: "ai-service"
provider: "default"
docs: "https://docs.play.ht/reference/api-getting-started"
aliases: ["PlayAI", "Play.ht"]
defaults:
  auth: "api-key"
  managed: true
  modality: "speech"
  publicEndpoint: true
properties:
  protocol:
    type: "enum"
    values: ["http", "websocket"]
    default: "http"
  voiceCloning:
    type: "boolean"
    default: false
