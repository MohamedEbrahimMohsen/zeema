# yaml-language-server: $schema=../../schema/component.schema.json
# Determined: open source deep learning platform, a master plus agents scheduling GPU training jobs.
# Facts from the Determined project README: Apache 2.0, self-deployed on-premises, on AWS or GCP,
# on Kubernetes or on Slurm/PBS HPC clusters; distributed training, HPO, tracking and model registry.
schemaVersion: "1"
type: "component"
id: "determined"
kind: "ml-platform"
provider: "default"
docs: "https://github.com/determined-ai/determined"
defaults:
  experimentTracking: true
  modelRegistry: true
  gpuEnabled: true
  managed: false
properties:
  resourceManager:
    type: "enum"
    values: ["agent", "kubernetes", "slurm", "pbs"]
  hyperparameterSearch:
    type: "boolean"
    default: true
  framework:
    type: "enum"
    values: ["pytorch", "tensorflow"]
