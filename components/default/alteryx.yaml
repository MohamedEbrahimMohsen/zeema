# yaml-language-server: $schema=../../schema/component.schema.json
# Alteryx: analytics automation platform; Alteryx was taken private by Clearlake Capital and Insight Partners in
# March 2024. Per the Alteryx One overview, Alteryx One is a multi-tenant, multi-cloud SaaS with Designer (desktop),
# Designer Cloud (browser) and other modules, and Alteryx Server is the self-hosted or cloud-hosted application that
# publishes, shares and runs workflows.
schemaVersion: "1"
type: "component"
id: "alteryx"
kind: "ml-platform"
provider: "default"
docs: "https://help.alteryx.com/aac/en/platform/alteryx-one-app/overview.html"
aliases: ["Alteryx One", "Alteryx Server", "Alteryx Designer"]
defaults:
  managed: true
  experimentTracking: false
  modelRegistry: false
properties:
  deployment:
    type: "enum"
    values: ["alteryx-one", "server"]
    default: "alteryx-one"
