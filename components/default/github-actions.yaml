# yaml-language-server: $schema=../../schema/component.schema.json
# GitHub Actions: workflows triggered by repository events. "Usage limits, billing, and
# administration" gives 20 concurrent jobs on the Free plan, a 6 hour job limit on GitHub-hosted
# runners and a 35 day workflow run limit; "Managing environments for deployment" makes required
# reviewers an optional protection rule, so no approval gate exists out of the box.
schemaVersion: "1"
type: "component"
id: "github-actions"
kind: "ci-pipeline"
provider: "default"
docs: "https://docs.github.com/en/actions/reference/limits"
defaults:
  trigger: "commit"
  approvalRequired: false
  selfHostedRunners: false
  concurrency: 20
  managed: true
properties:
  runnerImage:
    type: "enum"
    values: ["ubuntu-latest", "ubuntu-slim", "windows-latest", "macos-latest"]
    default: "ubuntu-latest"
  maxJobHours:
    type: "integer"
    default: 6
  maxWorkflowRunDays:
    type: "integer"
    default: 35
  maxMatrixJobs:
    type: "integer"
    default: 256
  environmentReviewers:
    type: "integer"
