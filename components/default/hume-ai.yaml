# yaml-language-server: $schema=../../schema/component.schema.json
# Hume AI: voice API with EVI (Empathic Voice Interface, speech to speech), Octave text to speech and Expression
# Measurement. Per "API key", servers send the API key in X-Hume-Api-Key, and clients use access tokens from the
# OAuth client-credentials endpoint that expire after 30 minutes.
schemaVersion: "1"
type: "component"
id: "hume-ai"
kind: "ai-service"
provider: "default"
docs: "https://dev.hume.ai/docs/introduction/api-key"
aliases: ["Hume EVI", "Octave TTS"]
defaults:
  auth: "api-key"
  managed: true
  modality: "speech"
  publicEndpoint: true
properties:
  product:
    type: "enum"
    values: ["evi", "tts", "expression-measurement"]
    default: "evi"
  clientTokenAuth:
    type: "boolean"
    default: false
