# yaml-language-server: $schema=../../schema/component.schema.json
# 1Password Connect: self-hosted REST API server that serves items from 1Password vaults.
# "1Password Connect": runs in your own infrastructure, caches vault data locally after the
# first fetch, and is reached over HTTP by the Connect SDKs.
schemaVersion: "1"
type: "component"
id: "onepassword-connect"
kind: "key-management"
provider: "default"
docs: "https://www.1password.dev/connect/"
defaults:
  managed: false
  hsm: false
  rotationAutomated: false
properties:
  localCache:
    type: "boolean"
    default: true
  cloudBacked:
    type: "boolean"
    default: true
