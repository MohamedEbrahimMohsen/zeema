# yaml-language-server: $schema=../../schema/component.schema.json
# Twilio SMS: not idempotent, delivery status via webhook, long codes by default.
schemaVersion: "1"
type: "component"
id: "twilio-sms"
kind: "third-party-api"
provider: "default"
defaults:
  idempotent: false
  callbackStyle: "webhook"
properties:
  senderType:
    type: "enum"
    values: ["long-code", "short-code", "toll-free", "alphanumeric"]
    default: "long-code"
