# yaml-language-server: $schema=../../schema/component.schema.json
# SendGrid: transactional email API, not idempotent, event webhook opt-in.
schemaVersion: "1"
type: "component"
id: "sendgrid"
kind: "third-party-api"
provider: "default"
docs: "https://www.twilio.com/docs/sendgrid"
defaults:
  idempotent: false
  callbackStyle: "webhook"
properties:
  eventWebhook:
    type: "boolean"
    default: false
