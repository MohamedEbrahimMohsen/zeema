# yaml-language-server: $schema=../../schema/component.schema.json
# Mailchimp Transactional (Mandrill): transactional email API. "Transactional email fundamentals"
# documents templates and opt-in event webhooks and an hourly sending quota; no idempotency.
schemaVersion: "1"
type: "component"
id: "mandrill"
kind: "third-party-api"
provider: "default"
docs: "https://mailchimp.com/developer/transactional/docs/fundamentals/"
defaults:
  managed: true
  idempotent: false
  callbackStyle: "webhook"
properties:
  eventWebhook:
    type: "boolean"
    default: false
  templates:
    type: "boolean"
    default: true
