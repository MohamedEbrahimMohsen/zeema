# yaml-language-server: $schema=../../schema/component.schema.json
# External SMTP relay (SES SMTP, corporate relay): not idempotent, no callbacks; bounces arrive by mail.
schemaVersion: "1"
type: "component"
id: "smtp-relay"
kind: "third-party-api"
provider: "default"
docs: "https://datatracker.ietf.org/doc/html/rfc5321"
defaults:
  idempotent: false
  callbackStyle: "none"
properties:
  authenticated:
    type: "boolean"
    default: true
  tlsRequired:
    type: "boolean"
    default: false
