# yaml-language-server: $schema=../../schema/component.schema.json
# Entrust nShield HSM: hardware security modules whose keys live inside the validated boundary.
# "Security Worlds" and the nShield 5 FIPS 140-3 Level 3 certification: keys are shared across
# modules through a Security World, and in a FIPS Level 3 world only approved algorithms are offered.
schemaVersion: "1"
type: "component"
id: "entrust-nshield"
kind: "key-management"
provider: "default"
defaults:
  managed: false
  hsm: true
  rotationAutomated: false
properties:
  formFactor:
    type: "enum"
    values: ["connect", "solo", "edge", "as-a-service"]
    default: "connect"
  securityWorld:
    type: "boolean"
    default: true
  fipsLevel3Mode:
    type: "boolean"
    default: false
