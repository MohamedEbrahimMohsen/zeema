# yaml-language-server: $schema=../../schema/component.schema.json
# Veeam Kasten (K10): Kubernetes-native backup, disaster recovery and application mobility platform ("Veeam Kasten Documentation").
# Policy actions run hourly, daily, weekly, monthly, yearly or on demand; hourly actions fire at the top of the hour and the rest at midnight UTC ("Protecting Applications").
schemaVersion: "1"
type: "component"
id: "kasten"
kind: "backup-service"
provider: "default"
docs: "https://docs.kasten.io/latest/usage/protect.html"
aliases: ["K10"]
defaults:
  managed: false
  crossRegionRestore: false
properties:
  exportToObjectStorage:
    type: "boolean"
  snapshotGranularity:
    type: "enum"
    values: ["hourly", "daily", "weekly", "monthly", "yearly", "on-demand"]
  edition:
    type: "enum"
    values: ["free", "enterprise"]
    default: "free"
