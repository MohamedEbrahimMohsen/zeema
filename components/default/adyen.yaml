# yaml-language-server: $schema=../../schema/component.schema.json
# Adyen: idempotency keys supported, webhook notifications, HMAC signing must be configured.
schemaVersion: "1"
type: "component"
id: "adyen"
kind: "third-party-api"
provider: "default"
docs: "https://docs.adyen.com/"
defaults:
  idempotent: true
  handlesMoney: true
  callbackStyle: "webhook"
  hostedPage: true
properties:
  signedCallbacks:
    type: "boolean"
    default: false
