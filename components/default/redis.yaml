# yaml-language-server: $schema=../../schema/component.schema.json
# evictionPolicy is deliberately not defaulted: Redis ships with noeviction, which is the
# behaviour the cache-missing-eviction-policy rule exists to surface.
schemaVersion: "1"
type: "component"
id: "redis"
kind: "cache"
provider: "default"
docs: "https://redis.io/docs/latest/"
defaults:
  persistence: false
properties:
  cluster:
    type: "boolean"
    default: false
