# yaml-language-server: $schema=../../schema/component.schema.json
# The vendor-neutral VPN gateway: the kind itself, with no product behind it. It sets no
# defaults and adds no properties, so every required kind property stays required on the node.
schemaVersion: "1"
type: "component"
id: "vpn-gateway"
kind: "vpn-gateway"
provider: "default"
