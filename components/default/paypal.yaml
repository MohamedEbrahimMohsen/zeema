# yaml-language-server: $schema=../../schema/component.schema.json
# PayPal REST API: hosted checkout and payouts. "Idempotency" documents the PayPal-Request-Id
# header but warns not all APIs support it, so idempotency is per-endpoint, not account-wide.
schemaVersion: "1"
type: "component"
id: "paypal"
kind: "third-party-api"
provider: "default"
defaults:
  managed: true
  idempotent: true
  handlesMoney: true
  callbackStyle: "webhook"
  hostedPage: true
properties:
  idempotencyScope:
    type: "enum"
    values: ["per-endpoint", "all-endpoints"]
    default: "per-endpoint"
