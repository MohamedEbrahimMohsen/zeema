# yaml-language-server: $schema=../../schema/component.schema.json
# LINE Messaging API: hosted API behind a LINE Official Account. "Messaging API overview" states
# the LINE Platform sends a webhook event to the webhook URL of the bot server when a user sends
# a message, and the bot server then responds to the user through the LINE Platform, so the
# callback is a webhook and the reply is a separate outbound call. The same page states a number
# of messages each month are free and that the number depends on the subscription plan of the
# LINE Official Account, without giving a figure, so no quota is set. No idempotency mechanism
# is documented.
schemaVersion: "1"
type: "component"
id: "line"
kind: "third-party-api"
provider: "default"
defaults:
  managed: true
  callbackStyle: "webhook"
  hostedPage: false
  handlesMoney: false
properties:
  messageType:
    type: "enum"
    values: ["reply", "push", "multicast", "broadcast"]
    default: "reply"
