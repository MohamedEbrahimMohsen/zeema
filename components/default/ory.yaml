# yaml-language-server: $schema=../../schema/component.schema.json
# Ory: modular self-hosted identity servers - Hydra (OAuth2/OIDC provider), Kratos (identity
# and self-service login), Keto (Zanzibar relationship-based authorization).
# "Ory Components Overview": each service runs standalone on your own infrastructure.
schemaVersion: "1"
type: "component"
id: "ory"
kind: "identity-provider"
provider: "default"
docs: "https://www.ory.com/docs/ecosystem/projects"
defaults:
  protocol: "oidc"
  authorizationModel: "rebac"
  centralised: true
  managed: false
  mfa: false
properties:
  service:
    type: "enum"
    values: ["hydra", "kratos", "keto", "oathkeeper"]
    default: "hydra"
  deployment:
    type: "enum"
    values: ["self-hosted", "ory-network"]
    default: "self-hosted"
