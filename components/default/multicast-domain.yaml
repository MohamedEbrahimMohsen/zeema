# yaml-language-server: $schema=../../schema/component.schema.json
# Multicast network domain (exchange or market-data plant): PIM sparse mode with IGMP snooping.
schemaVersion: "1"
type: "component"
id: "multicast-domain"
kind: "network-fabric"
provider: "default"
docs: "https://datatracker.ietf.org/doc/html/rfc1112"
defaults:
  multicast: true
  interconnect: "private"
properties:
  pimMode:
    type: "enum"
    values: ["sparse", "dense", "bidir", "ssm"]
    default: "sparse"
  igmpSnooping:
    type: "boolean"
    default: true
