# yaml-language-server: $schema=../../schema/component.schema.json
# Axon Server: event store plus command/query router for Axon Framework. Standard edition is a single
# node with segmented file storage; Raft clustering is an enterprise option.
schemaVersion: "1"
type: "component"
id: "axon-server"
kind: "event-store"
provider: "default"
defaults:
  replication: "none"
  journaled: true
  storage: "mmap"
  role: "journal"
properties:
  commandRouting:
    type: "boolean"
    default: true
