# yaml-language-server: $schema=../../schema/component.schema.json
# Netflix Conductor (and Orkes): JSON-defined workflow DAGs executed by polling workers;
# task definitions carry a retryCount of 3 by default.
schemaVersion: "1"
type: "component"
id: "conductor"
kind: "workflow-engine"
provider: "default"
defaults:
  durable: true
  pattern: "dag"
  compensation: false
  managed: false
properties:
  activityRetry:
    type: "boolean"
    default: true
