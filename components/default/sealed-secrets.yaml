# yaml-language-server: $schema=../../schema/component.schema.json
# Sealed Secrets: Kubernetes controller that decrypts SealedSecret resources into Secrets.
# "Sealed Secrets README": the controller renews its sealing key every 30 days by default
# (--key-renew-period) and keeps old keys so earlier SealedSecrets still decrypt.
schemaVersion: "1"
type: "component"
id: "sealed-secrets"
kind: "key-management"
provider: "default"
docs: "https://github.com/bitnami-labs/sealed-secrets"
defaults:
  managed: false
  hsm: false
  rotationAutomated: true
  rotationDays: 30
properties:
  sealingScope:
    type: "enum"
    values: ["strict", "namespace-wide", "cluster-wide"]
    default: "strict"
  oldKeysRetained:
    type: "boolean"
    default: true
