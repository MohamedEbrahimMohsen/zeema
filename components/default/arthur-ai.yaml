# yaml-language-server: $schema=../../schema/component.schema.json
# Arthur: AI observability, evaluation and governance platform for LLMs and agents. Per the "arthur-engine"
# README, the MIT-licensed Arthur Engine is self-hosted and enforces guardrails (PII, hallucination, prompt
# injection, toxicity), the Arthur Platform free version is cloud, and on-premises is enterprise only.
schemaVersion: "1"
type: "component"
id: "arthur-ai"
kind: "monitoring"
provider: "default"
docs: "https://docs.arthur.ai/"
aliases: ["Arthur Platform"]
defaults:
  managed: true
  signal: "traces"
  collectorMode: "push"
  independentOfMonitored: true
properties:
  selfHostedEngine:
    type: "boolean"
  guardrails:
    type: "boolean"
  onPremPlatform:
    type: "boolean"
    default: false
