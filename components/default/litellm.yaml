# yaml-language-server: $schema=../../schema/component.schema.json
# LiteLLM Proxy (LLM Gateway): self-hosted OpenAI-compatible gateway that fronts 100+ model providers,
# tracks spend and applies budgets per virtual key. Per "Virtual Keys", a master key starting with sk-
# is required to start the proxy and virtual keys need a Postgres database; per "Router", the default
# routing strategy is simple-shuffle and retries and fallbacks must be configured explicitly.
schemaVersion: "1"
type: "component"
id: "litellm"
kind: "api-gateway"
provider: "default"
defaults:
  managed: false
  auth: "api-key"
  rateLimiting: false
  tls: false
  protocol: "http"
  concurrencyLimit: false
properties:
  routingStrategy:
    type: "enum"
    values: ["simple-shuffle", "least-busy", "usage-based", "latency-based", "cost-based"]
    default: "simple-shuffle"
  virtualKeys:
    type: "boolean"
    default: false
  requiresDatabase:
    type: "boolean"
    default: false
  fallbacks:
    type: "boolean"
    default: false
  spendTracking:
    type: "boolean"
    default: true
