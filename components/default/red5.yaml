# yaml-language-server: $schema=../../schema/component.schema.json
# Red5: Java media server. The open source server ingests and republishes over the TCP protocols
# RTMP (1935, also RTMPT/RTMPS/RTMPE), RTSP (8554) and WebSocket, with the manager on 5080
# (Red5 documentation); WebRTC, SRT and the clustered origin/edge XDN belong to Red5 Pro.
schemaVersion: "1"
type: "component"
id: "red5"
kind: "media-router"
provider: "default"
docs: "https://www.red5.net/docs/red5-pro/users-guide/protocols/rtmp/"
defaults:
  managed: false
  mode: "ingest"
  transport: "tcp"
  cascading: false
properties:
  edition:
    type: "enum"
    values: ["open-source", "pro"]
    default: "open-source"
  ingestProtocol:
    type: "enum"
    values: ["rtmp", "rtmps", "rtsp", "websocket", "webrtc", "srt"]
    default: "rtmp"
  clustered:
    type: "boolean"
    default: false
