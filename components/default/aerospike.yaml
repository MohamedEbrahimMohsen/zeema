# yaml-language-server: $schema=../../schema/component.schema.json
# Aerospike Database: key-value store sharded over 4096 partitions with replication factor 2.
# Strong consistency is a licensed opt-in, so the default namespace is available-mode and resolves
# versions by generation count ("Data distribution", "Configure strong consistency").
schemaVersion: "1"
type: "component"
id: "aerospike"
kind: "nosql-database"
provider: "default"
defaults:
  model: "key-value"
  consistency: "eventual"
  replication: "single-region"
  replicationFactor: 2
properties:
  strongConsistency:
    type: "boolean"
    default: false
  crossDatacenterReplication:
    type: "boolean"
    default: false
  storageEngine:
    type: "enum"
    values: ["memory", "device"]
