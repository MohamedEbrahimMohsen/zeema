# yaml-language-server: $schema=../../schema/component.schema.json
# Cilium: eBPF CNI and service mesh. Sidecar-free datapath (per-node Envoy only for L7),
# transparent encryption (IPsec/WireGuard) is opt-in per "Encryption" in the Cilium docs.
schemaVersion: "1"
type: "component"
id: "cilium"
kind: "service-mesh"
provider: "default"
defaults:
  managed: false
  sidecar: false
  mtls: false
  retries: false
  circuitBreaking: false
properties:
  transparentEncryption:
    type: "enum"
    values: ["none", "ipsec", "wireguard"]
    default: "none"
  hubbleObservability:
    type: "boolean"
    default: false
  kubeProxyReplacement:
    type: "boolean"
    default: false
