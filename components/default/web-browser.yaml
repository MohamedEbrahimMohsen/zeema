# yaml-language-server: $schema=../../schema/component.schema.json
# Web browser client: HTTP cache on, no offline capability unless a service worker is added.
schemaVersion: "1"
type: "component"
id: "web-browser"
kind: "client"
provider: "default"
docs: "https://developer.mozilla.org/en-US/docs/Web"
defaults:
  platform: "web"
  localCache: true
properties:
  serviceWorker:
    type: "boolean"
    default: false
