# yaml-language-server: $schema=../../schema/component.schema.json
# Apicurio Registry: open-source registry; no compatibility rule is applied until one is
# configured, in-memory storage by default.
schemaVersion: "1"
type: "component"
id: "apicurio"
kind: "schema-registry"
provider: "default"
defaults:
  compatibility: "none"
  enforced: false
  managed: false
properties:
  storage:
    type: "enum"
    values: ["in-memory", "sql", "kafkasql"]
    default: "in-memory"
  schemaFormat:
    type: "enum"
    values: ["avro", "protobuf", "json-schema", "openapi", "asyncapi"]
    default: "avro"
