# yaml-language-server: $schema=../../schema/component.schema.json
# Label Studio: HumanSignal's open-source data labelling server for text, image, audio, video and time series.
# Per "Install and upgrade Label Studio", the server listens on port 8080 and runs on SQLite (3.35+) or PostgreSQL (14+);
# SQLite is the out-of-the-box store and Docker Compose switches to PostgreSQL. Source and target storage can be
# local files, Amazon S3, Google Cloud Storage, Azure Blob, Databricks or Redis. Label Studio Enterprise is the paid edition.
schemaVersion: "1"
type: "component"
id: "label-studio"
kind: "ml-platform"
provider: "default"
docs: "https://labelstud.io/guide/install"
aliases: ["HumanSignal", "Label Studio Enterprise"]
defaults:
  managed: false
  experimentTracking: false
  modelRegistry: false
properties:
  edition:
    type: "enum"
    values: ["community", "enterprise"]
    default: "community"
  port:
    type: "integer"
    default: 8080
  database:
    type: "enum"
    values: ["sqlite", "postgresql"]
    default: "sqlite"
  storage:
    type: "enum"
    values: ["local", "s3", "gcs", "azure-blob", "databricks", "redis"]
    default: "local"
