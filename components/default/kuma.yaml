# yaml-language-server: $schema=../../schema/component.schema.json
# Kuma: Envoy sidecar mesh with a universal/Kubernetes control plane. The "Mutual TLS" policy
# page states mTLS is not enabled by default and must be turned on per mesh.
schemaVersion: "1"
type: "component"
id: "kuma"
kind: "service-mesh"
provider: "default"
defaults:
  managed: false
  sidecar: true
  mtls: false
  retries: false
  circuitBreaking: false
properties:
  environment:
    type: "enum"
    values: ["kubernetes", "universal"]
    default: "kubernetes"
  multiZone:
    type: "boolean"
    default: false
  trafficPermissionRequired:
    type: "boolean"
    default: false
