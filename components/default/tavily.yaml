# yaml-language-server: $schema=../../schema/component.schema.json
# Tavily: search, extract and crawl API built for LLM agents and RAG grounding.
# Per "Rate Limits", development keys allow 100 requests per minute and production keys, which need a paid plan or
# pay-as-you-go, allow 1,000; the research endpoint is limited to 20 new tasks per minute.
schemaVersion: "1"
type: "component"
id: "tavily"
kind: "third-party-api"
provider: "default"
docs: "https://docs.tavily.com/documentation/rate-limits"
defaults:
  managed: true
  hostedPage: false
  handlesMoney: false
  callbackStyle: "none"
  idempotent: true
properties:
  keyType:
    type: "enum"
    values: ["development", "production"]
    default: "development"
  rateLimitRpm:
    type: "integer"
    default: 100
  endpoint:
    type: "enum"
    values: ["search", "extract", "crawl", "map", "research"]
    default: "search"
