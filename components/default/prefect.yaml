# yaml-language-server: $schema=../../schema/component.schema.json
# Prefect: Python flows whose run state is tracked in the Prefect database ("Flows", "Server").
# A self-hosted server uses SQLite unless PostgreSQL is configured; Prefect Cloud is the managed option.
schemaVersion: "1"
type: "component"
id: "prefect"
kind: "workflow-engine"
provider: "default"
docs: "https://docs.prefect.io/v3/concepts/server"
defaults:
  durable: true
  pattern: "dag"
  compensation: false
  managed: false
properties:
  database:
    type: "enum"
    values: ["sqlite", "postgres"]
    default: "sqlite"
