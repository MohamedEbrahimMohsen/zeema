# yaml-language-server: $schema=../../schema/component.schema.json
# Vapi: developer platform for voice AI agents that chains speech to text, an LLM and text to speech from providers
# you choose, on phone numbers or the web. Per "Introduction", an assistant is a system prompt with tools and structured
# outputs, and a squad hands a call between assistants with context-preserving transfers.
schemaVersion: "1"
type: "component"
id: "vapi"
kind: "ai-service"
provider: "default"
docs: "https://docs.vapi.ai/quickstart/introduction"
defaults:
  auth: "api-key"
  managed: true
  modality: "speech"
  publicEndpoint: true
properties:
  orchestration:
    type: "enum"
    values: ["assistant", "squad"]
    default: "assistant"
  channel:
    type: "enum"
    values: ["phone", "web"]
    default: "phone"
