# yaml-language-server: $schema=../../schema/component.schema.json
# Flyte: open-source, Kubernetes-native orchestrator for data and ML workflows with typed, versioned tasks. The
# flyte-binary Helm chart deploys every Flyte component as one service for a single cluster; flyte-core splits them for
# multi-cluster deployments. Union.ai offers Flyte as a managed service.
schemaVersion: "1"
type: "component"
id: "flyte"
kind: "ml-platform"
provider: "default"
docs: "https://docs.flyte.org/en/latest/deployment/deployment/index.html"
defaults:
  managed: false
  experimentTracking: false
  modelRegistry: false
properties:
  deployment:
    type: "enum"
    values: ["flyte-binary", "flyte-core"]
    default: "flyte-binary"
