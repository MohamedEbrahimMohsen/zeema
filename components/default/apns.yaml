# yaml-language-server: $schema=../../schema/component.schema.json
# Apple Push Notification service: fire-and-forget HTTP/2, no idempotency, token-based auth.
schemaVersion: "1"
type: "component"
id: "apns"
kind: "third-party-api"
provider: "default"
defaults:
  idempotent: false
  callbackStyle: "none"
properties:
  tokenBasedAuth:
    type: "boolean"
    default: true
