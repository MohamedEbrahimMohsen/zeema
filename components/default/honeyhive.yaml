# yaml-language-server: $schema=../../schema/component.schema.json
# HoneyHive: OpenTelemetry-native agent observability and evaluation platform. Per "What is HoneyHive", it
# runs as multi-tenant SaaS, a dedicated single-tenant cloud or self-hosted in your VPC; per "Pricing", the
# free Developer plan keeps data 30 days with 10,000 events a month and up to 5 users.
schemaVersion: "1"
type: "component"
id: "honeyhive"
kind: "monitoring"
provider: "default"
docs: "https://docs.honeyhive.ai/v2/introduction/what-is-hhai"
defaults:
  managed: true
  signal: "traces"
  collectorMode: "push"
  independentOfMonitored: true
  retentionDays: 30
properties:
  deployment:
    type: "enum"
    values: ["multi-tenant", "dedicated", "self-hosted"]
    default: "multi-tenant"
  monthlyEventLimit:
    type: "integer"
    default: 10000
