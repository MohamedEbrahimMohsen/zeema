# yaml-language-server: $schema=../../schema/component.schema.json
# Vitess: sharding middleware for MySQL; VTGate routes by keyspace shard key and scatters
# queries that lack one.
schemaVersion: "1"
type: "component"
id: "vitess"
kind: "database-proxy"
provider: "default"
docs: "https://vitess.io/docs/"
defaults:
  pooling: true
  poolSharded: true
  routing: "shard-key"
  scatterGather: true
properties:
  keyspaces:
    type: "integer"
  vtgateReplicas:
    type: "integer"
