# yaml-language-server: $schema=../../schema/component.schema.json
# Bank API: moves money, typically batch settlement with polled status and cut-off times.
schemaVersion: "1"
type: "component"
id: "bank-api"
kind: "third-party-api"
provider: "default"
defaults:
  handlesMoney: true
  idempotent: false
  callbackStyle: "poll"
properties:
  batchSettlement:
    type: "boolean"
    default: true
