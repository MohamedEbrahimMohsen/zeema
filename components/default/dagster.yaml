# yaml-language-server: $schema=../../schema/component.schema.json
# Dagster: asset/op graph orchestrator. With DAGSTER_HOME set, run history and event logs are
# persisted to SQLite on the local filesystem unless Postgres or MySQL is configured
# ("OSS instance configuration"). Retries need an explicit RetryPolicy on the op or asset.
schemaVersion: "1"
type: "component"
id: "dagster"
kind: "workflow-engine"
provider: "default"
docs: "https://docs.dagster.io/deployment/oss/oss-instance-configuration"
defaults:
  durable: true
  pattern: "dag"
  compensation: false
  managed: false
properties:
  storage:
    type: "enum"
    values: ["sqlite", "postgres", "mysql"]
    default: "sqlite"
  retryPolicy:
    type: "boolean"
    default: false
