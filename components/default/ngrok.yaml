# yaml-language-server: $schema=../../schema/component.schema.json
# ngrok: hosted ingress fabric. A local agent dials out to ngrok's globally distributed
# edge, which terminates TLS and forwards over the overlay tunnel ("Universal Gateway").
schemaVersion: "1"
type: "component"
id: "ngrok"
kind: "network-fabric"
provider: "default"
docs: "https://ngrok.com/docs/universal-gateway/"
defaults:
  managed: true
  overlay: true
  multicast: false
  kernelBypass: false
  interconnect: "public"
properties:
  endpointProtocol:
    type: "enum"
    values: ["http", "tls", "tcp"]
    default: "http"
  reservedDomain:
    type: "boolean"
    default: false
  trafficPolicy:
    type: "boolean"
    default: false
