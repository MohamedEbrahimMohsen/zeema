# yaml-language-server: $schema=../../schema/component.schema.json
# CephFS: POSIX-compliant shared file system on RADOS, mounted natively and re-exported over NFS and SMB ("Ceph File System").
# Snapshots are on for new file systems ("CephFS Snapshots"); data pools inherit osd_pool_default_size = 3.
schemaVersion: "1"
type: "component"
id: "cephfs"
kind: "file-storage"
provider: "default"
docs: "https://docs.ceph.com/en/latest/cephfs/"
defaults:
  protocol: "multi"
  managed: false
  publicAccess: false
  backupEnabled: false
  redundancy: "local"
properties:
  dataPoolReplicas:
    type: "integer"
    default: 3
  snapshotsEnabled:
    type: "boolean"
    default: true
  quotasEnabled:
    type: "boolean"
    default: false
