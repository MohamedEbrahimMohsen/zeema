# yaml-language-server: $schema=../../schema/component.schema.json
# Synthflow: no-code platform for inbound and outbound voice AI agents. Per the documentation home, concurrency is set
# by the plan and subaccounts share the main account's total; agents are built, simulated, launched and reviewed in
# its Build, Evaluate, Launch, Learn workflow.
schemaVersion: "1"
type: "component"
id: "synthflow"
kind: "ai-service"
provider: "default"
docs: "https://docs.synthflow.ai/"
defaults:
  auth: "api-key"
  managed: true
  modality: "speech"
  publicEndpoint: true
properties:
  direction:
    type: "enum"
    values: ["inbound", "outbound"]
    default: "inbound"
  concurrentCalls:
    type: "integer"
