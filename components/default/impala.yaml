# yaml-language-server: $schema=../../schema/component.schema.json
# Apache Impala: MPP SQL engine that reads data already stored in HDFS, HBase or Kudu rather than
# storing it itself. "Using Impala with Kudu": DELETE, UPDATE and UPSERT work only on Kudu tables,
# while HDFS-backed tables such as Parquet accept appends and full-table scans only.
schemaVersion: "1"
type: "component"
id: "impala"
kind: "data-warehouse"
provider: "default"
docs: "https://impala.apache.org/docs/build/html/topics/impala_kudu.html"
defaults:
  realtime: false
  upsert: false
  format: "columnar"
  managed: false
properties:
  storesData:
    type: "boolean"
    default: false
  storageEngine:
    type: "enum"
    values: ["hdfs", "hbase", "kudu", "iceberg"]
    default: "hdfs"
