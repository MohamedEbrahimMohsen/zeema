# yaml-language-server: $schema=../../schema/component.schema.json
# LinkedIn Brooklin: streaming data pipelines for CDC (Espresso, Oracle) and Kafka mirroring;
# ordered per partition, no schema handling of its own.
schemaVersion: "1"
type: "component"
id: "brooklin"
kind: "change-data-capture"
provider: "default"
docs: "https://github.com/linkedin/brooklin/wiki"
defaults:
  mode: "log-based"
  ordered: true
  schemaEvolution: false
properties:
  mirroring:
    type: "boolean"
    default: false
