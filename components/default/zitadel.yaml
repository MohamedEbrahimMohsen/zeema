# yaml-language-server: $schema=../../schema/component.schema.json
# Zitadel: open source identity infrastructure, self-hosted or as Zitadel Cloud.
# "ZITADEL Documentation": OpenID Connect, OAuth 2.0 and SAML 2.0, first-class multi-tenancy
# with organizations and projects; MFA (OTP, U2F, passkeys) is a login policy an instance sets.
schemaVersion: "1"
type: "component"
id: "zitadel"
kind: "identity-provider"
provider: "default"
docs: "https://zitadel.com/docs"
defaults:
  protocol: "oidc"
  authorizationModel: "rbac"
  centralised: true
  managed: false
  mfa: false
properties:
  deployment:
    type: "enum"
    values: ["self-hosted", "cloud"]
    default: "self-hosted"
  multiTenancy:
    type: "boolean"
    default: true
  auditTrail:
    type: "boolean"
    default: true
