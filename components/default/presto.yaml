# yaml-language-server: $schema=../../schema/component.schema.json
# Presto: Apache-2.0 distributed SQL query engine for big data. Project README: it queries data
# where it lives through connectors instead of storing or moving it, so a Presto node is compute
# only and every source keeps its own storage format and write semantics.
schemaVersion: "1"
type: "component"
id: "presto"
kind: "data-warehouse"
provider: "default"
docs: "https://github.com/prestodb/presto"
defaults:
  realtime: false
  upsert: false
  managed: false
properties:
  storesData:
    type: "boolean"
    default: false
  queryFederation:
    type: "boolean"
    default: true
  topology:
    type: "enum"
    values: ["single-node", "coordinator-workers"]
    default: "coordinator-workers"
