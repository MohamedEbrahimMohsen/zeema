# yaml-language-server: $schema=../../schema/component.schema.json
# NSQ: distributed topic/channel broker. Guarantees at-least-once delivery, keeps 10000 messages per
# channel in memory before spilling to disk and does not require TLS ("Design", "nsqd").
schemaVersion: "1"
type: "component"
id: "nsq"
kind: "queue"
provider: "default"
defaults:
  delivery: "at-least-once"
  ordering: "none"
  persistence: false
  deadLetterQueue: false
  replay: false
  managed: false
properties:
  memQueueSize:
    type: "integer"
    default: 10000
  messageTimeoutSeconds:
    type: "integer"
    default: 60
  tlsRequired:
    type: "boolean"
    default: false
