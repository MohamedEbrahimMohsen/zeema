# yaml-language-server: $schema=../../schema/component.schema.json
# Cartesia: hosted voice API with Sonic text to speech and Ink speech to text, over HTTP, SSE and WebSockets.
# Per "Concurrency limits and timeouts", TTS and STT have separate concurrency limits by plan (Free 2 TTS and 8 STT,
# Pro 3 and 12, Startup 5 and 20, Scale 15 and 60), excess requests get 429, and idle TTS WebSockets close after 5 minutes.
schemaVersion: "1"
type: "component"
id: "cartesia"
kind: "ai-service"
provider: "default"
docs: "https://docs.cartesia.ai/use-the-api/concurrency-limits-and-timeouts"
defaults:
  auth: "api-key"
  managed: true
  modality: "speech"
  publicEndpoint: true
properties:
  plan:
    type: "enum"
    values: ["free", "pro", "startup", "scale", "enterprise"]
    default: "free"
  product:
    type: "enum"
    values: ["tts", "stt"]
    default: "tts"
  ttsConcurrency:
    type: "integer"
    default: 2
  sttConcurrency:
    type: "integer"
    default: 8
