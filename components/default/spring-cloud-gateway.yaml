# yaml-language-server: $schema=../../schema/component.schema.json
# Spring Cloud Gateway: an API gateway built on the Spring ecosystem, run standalone or embedded in a
# Spring Boot application, in a WebFlux (reactive) or Web MVC variant. Rate limiting is the opt-in
# RequestRateLimiter filter and load balancing comes from Spring Cloud LoadBalancer via lb:// URIs.
schemaVersion: "1"
type: "component"
id: "spring-cloud-gateway"
kind: "api-gateway"
provider: "default"
defaults:
  managed: false
  rateLimiting: false
properties:
  runtime:
    type: "enum"
    values: ["webflux", "web-mvc"]
    default: "webflux"
  serviceDiscoveryRouting:
    type: "boolean"
    default: false
