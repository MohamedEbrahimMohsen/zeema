# yaml-language-server: $schema=../../schema/component.schema.json
# Smart TV app: constrained runtime, local cache, persistent connection for playback sessions.
schemaVersion: "1"
type: "component"
id: "smart-tv-app"
kind: "client"
provider: "default"
defaults:
  platform: "tv"
  localCache: true
properties:
  os:
    type: "enum"
    values: ["tizen", "webos", "android-tv", "tvos", "roku"]
