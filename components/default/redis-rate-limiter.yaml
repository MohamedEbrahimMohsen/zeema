# yaml-language-server: $schema=../../schema/component.schema.json
# Redis-backed rate limiter: distributed counters, atomic via Lua scripts. Algorithm varies by library.
schemaVersion: "1"
type: "component"
id: "redis-rate-limiter"
kind: "rate-limiter"
provider: "default"
docs: "https://redis.io/docs/latest/develop/use/patterns/"
defaults:
  distributed: true
  atomicOps: true
properties:
  luaScripted:
    type: "boolean"
    default: true
