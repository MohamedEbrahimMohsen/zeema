# yaml-language-server: $schema=../../schema/component.schema.json
# vLLM: GPU LLM inference server with an OpenAI-compatible HTTP API.
# Defaults from the "vllm serve" CLI reference: port 8000, no API key set, tensor parallel size 1
# and gpu-memory-utilization 0.92.
schemaVersion: "1"
type: "component"
id: "vllm"
kind: "ml-inference"
provider: "default"
docs: "https://docs.vllm.ai/en/latest/cli/serve.html"
defaults:
  training: "batch"
  inputs: "live"
  accelerator: "gpu"
  managed: false
properties:
  port:
    type: "integer"
    default: 8000
  apiKeyRequired:
    type: "boolean"
    default: false
  tensorParallelSize:
    type: "integer"
    default: 1
  gpuMemoryUtilization:
    type: "string"
    default: "0.92"
