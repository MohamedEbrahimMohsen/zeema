# yaml-language-server: $schema=../../schema/component.schema.json
# Rime: hosted text to speech API for conversational voice agents, authenticated with a bearer API key. Per the
# Quickstart, requests go to the rime-tts endpoint with a speaker and a model (Coda, the flagship voice lineup, or
# Mist v3 for the lowest time to first audio), streamed over HTTP or WebSockets in a format chosen by the Accept header.
schemaVersion: "1"
type: "component"
id: "rime"
kind: "ai-service"
provider: "default"
docs: "https://docs.rime.ai/api-reference/quickstart"
aliases: ["Rime TTS"]
defaults:
  auth: "api-key"
  managed: true
  modality: "speech"
  publicEndpoint: true
properties:
  model:
    type: "enum"
    values: ["coda", "mistv3", "mistv2"]
    default: "coda"
  protocol:
    type: "enum"
    values: ["http", "websocket"]
    default: "http"
