# yaml-language-server: $schema=../../schema/component.schema.json
# Astronomer Astro: managed Apache Airflow. Per the Astro documentation a Deployment is an Airflow
# environment whose scheduler and workers Astronomer runs, with worker queues that scale down to
# zero when no tasks are queued.
schemaVersion: "1"
type: "component"
id: "astronomer"
kind: "workflow-engine"
provider: "default"
docs: "https://www.astronomer.io/docs/astro/"
defaults:
  managed: true
  durable: true
  pattern: "dag"
  compensation: false
  humanReview: false
properties:
  deploymentType:
    type: "enum"
    values: ["standard", "dedicated", "hybrid"]
    default: "standard"
  workerAutoscaling:
    type: "boolean"
    default: true
