# yaml-language-server: $schema=../../schema/component.schema.json
# EJBCA: long-running open-source PKI certificate authority, deployed as software, container or appliance.
# "EJBCA Introduction": one instance runs several CAs behind certificate profiles and supports
# ACME, EST, CMP, SCEP and Microsoft auto-enrollment, with CRL and OCSP validation.
schemaVersion: "1"
type: "component"
id: "ejbca"
kind: "key-management"
provider: "default"
docs: "https://docs.keyfactor.com/ejbca/latest/ejbca-introduction"
defaults:
  managed: false
  hsm: false
  rotationAutomated: false
properties:
  enrollmentProtocol:
    type: "enum"
    values: ["rest", "acme", "est", "cmp", "scep", "ms-autoenrollment"]
    default: "rest"
  ocspResponder:
    type: "boolean"
    default: true
  clustered:
    type: "boolean"
    default: false
