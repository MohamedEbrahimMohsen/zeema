# The vendor-neutral email security gateway: the kind itself, with no product behind it. It sets no
# defaults and adds no properties, so every required kind property stays required on the node.
schemaVersion: "1"
type: "component"
id: "email-security-gateway"
kind: "email-security-gateway"
provider: "default"
