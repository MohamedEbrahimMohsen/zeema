# yaml-language-server: $schema=../../schema/component.schema.json
# Eclipse Mosquitto: single-process MQTT broker. "mosquitto.conf" states persistence defaults to false
# (memory only), max_queued_messages is 1000 per client, allow_anonymous is false once a listener is
# defined, retained messages are supported and listeners accept MQTT 3.1, 3.1.1 and 5 by default.
schemaVersion: "1"
type: "component"
id: "mosquitto"
kind: "pubsub-topic"
provider: "default"
docs: "https://mosquitto.org/man/mosquitto-conf-5.html"
defaults:
  delivery: "at-most-once"
  ordering: "per-key"
  replay: false
  managed: false
properties:
  persistence:
    type: "boolean"
    default: false
  maxQueuedMessages:
    type: "integer"
    default: 1000
  allowAnonymous:
    type: "boolean"
    default: false
  mqttVersion:
    type: "enum"
    values: ["v3-1", "v3-1-1", "v5"]
    default: "v5"
