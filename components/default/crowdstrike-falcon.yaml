# yaml-language-server: $schema=../../schema/component.schema.json
# CrowdStrike Falcon endpoint security: cloud-delivered endpoint protection. "Secure the
# Endpoint, Stop the Breach | CrowdStrike Endpoint Security" states a single lightweight sensor
# is deployed on every endpoint and streams telemetry to the CrowdStrike cloud, which performs
# AI-powered detection triage, investigation and response across every major operating system.
# The analysis plane therefore runs outside the estate it watches and the sensor pushes, rather
# than the platform scraping. No retention period is stated.
schemaVersion: "1"
type: "component"
id: "crowdstrike-falcon"
kind: "monitoring"
provider: "default"
defaults:
  managed: true
  signal: "alerts"
  collectorMode: "push"
  independentOfMonitored: true
properties:
  sensorPerEndpoint:
    type: "boolean"
    default: true
  detectionTriageAutomated:
    type: "boolean"
    default: true
