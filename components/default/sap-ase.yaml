# yaml-language-server: $schema=../../schema/component.schema.json
# SAP Adaptive Server Enterprise: single-primary relational database. Allpages locking is the
# default lock scheme; replication is a separate Replication Server product (SAP ASE "Deadlocks and Concurrency").
schemaVersion: "1"
type: "component"
id: "sap-ase"
kind: "sql-database"
provider: "default"
docs: "https://help.sap.com/docs/SAP_ASE/86fcdd45cd3142af9f1b6dd75017260f/a8f5175bbc2b1014b5c7a94582fbf553.html"
aliases: ["Sybase ASE"]
defaults:
  replication: "none"
  concurrencyControl: "pessimistic"
properties:
  version:
    type: "string"
  lockScheme:
    type: "enum"
    values: ["allpages", "datapages", "datarows"]
    default: "allpages"
