# yaml-language-server: $schema=../../schema/component.schema.json
# KubeArmor: runtime security enforcement daemon that restricts process, file and network
# behaviour of workloads through kernel LSMs. Per the KubeArmor documentation the global default
# posture is audit, so unmatched operations are logged rather than blocked until it is changed.
schemaVersion: "1"
type: "component"
id: "kubearmor"
kind: "policy-engine"
provider: "default"
docs: "https://docs.kubearmor.io/kubearmor/"
defaults:
  managed: false
  effect: "audit"
  enforcementMode: "enforced"
  scope: "resource"
  remediation: false
properties:
  defaultPosture:
    type: "enum"
    values: ["audit", "block"]
    default: "audit"
  enforcer:
    type: "enum"
    values: ["apparmor", "bpf-lsm", "selinux", "none"]
