# yaml-language-server: $schema=../../schema/component.schema.json
# FreeSWITCH: self-hosted "open source platform for voice, video, and messaging", configured
# through SIP profiles, with WebRTC and call recording covered by the manual ("FreeSWITCH Users
# Manual"). Queueing is the optional mod_callcenter module, whose queue strategy defaults to
# longest-idle-agent and which rings agents through tiers ("Chapter 22: Queues: FIFO and Call
# Center"); recording of queue calls is not on unless the dialplan records the leg.
schemaVersion: "1"
type: "component"
id: "freeswitch"
kind: "contact-center"
provider: "default"
defaults:
  managed: false
  channelVoice: true
  channelChat: false
  routing: "fifo"
  callRecording: false
  outboundDialing: false
properties:
  queueStrategy:
    type: "enum"
    values: ["longest-idle-agent", "round-robin", "top-down", "agent-with-least-talk-time", "agent-with-fewest-calls", "sequentially-by-agent-order", "random", "ring-all"]
    default: "longest-idle-agent"
  callCenterModule:
    type: "boolean"
    default: false
  webrtc:
    type: "boolean"
    default: false
  videoSupport:
    type: "boolean"
    default: true
