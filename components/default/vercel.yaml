# yaml-language-server: $schema=../../schema/component.schema.json
# Vercel CDN: managed, framework-aware edge network included with every deployment, 126 points of
# presence across 51 countries. Per the "Vercel CDN overview" every deployment gets automatically
# provisioned TLS 1.2/1.3 certificates and unmetered always-on DDoS mitigation; the WAF is opt-in.
schemaVersion: "1"
type: "component"
id: "vercel"
kind: "cdn"
provider: "default"
docs: "https://vercel.com/docs/cdn"
defaults:
  managed: true
  caching: true
  tls: true
  edgeCompute: true
properties:
  ddosMitigation:
    type: "boolean"
    default: true
  waf:
    type: "boolean"
    default: false
  imageOptimization:
    type: "boolean"
    default: false
