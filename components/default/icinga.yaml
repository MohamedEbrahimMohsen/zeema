# yaml-language-server: $schema=../../schema/component.schema.json
# Icinga 2: self-hosted monitoring that runs checks on a regular interval, accepts external (passive)
# check results and notifies users with escalations ("Monitoring Basics").
schemaVersion: "1"
type: "component"
id: "icinga"
kind: "monitoring"
provider: "default"
docs: "https://icinga.com/docs/icinga-2/latest/doc/03-monitoring-basics/"
defaults:
  signal: "alerts"
  collectorMode: "pull"
  managed: false
properties:
  checkModel:
    type: "enum"
    values: ["active", "passive"]
    default: "active"
  clusterRole:
    type: "enum"
    values: ["master", "satellite", "agent"]
    default: "master"
