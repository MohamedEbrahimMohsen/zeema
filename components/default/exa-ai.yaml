# yaml-language-server: $schema=../../schema/component.schema.json
# Exa: neural web search and page-contents API for AI applications.
# Per the Exa rate-limits page, /search, /answer and /chat/completions allow 10 QPS and /contents 100 QPS; the Free plan
# carries $10 of credits a month without rollover, and an empty balance returns 402.
schemaVersion: "1"
type: "component"
id: "exa-ai"
kind: "third-party-api"
provider: "default"
docs: "https://exa.ai/docs/reference/rate-limits"
aliases: ["Exa"]
defaults:
  managed: true
  hostedPage: false
  handlesMoney: false
  callbackStyle: "none"
  idempotent: true
  qpsQuota: 10
properties:
  plan:
    type: "enum"
    values: ["free", "pay-as-you-go", "enterprise"]
    default: "free"
  endpoint:
    type: "enum"
    values: ["search", "contents", "answer", "research", "websets"]
    default: "search"
