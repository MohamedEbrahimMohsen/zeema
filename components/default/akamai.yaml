# yaml-language-server: $schema=../../schema/component.schema.json
# Akamai: managed CDN. EdgeWorkers and prefetching are opt-in.
schemaVersion: "1"
type: "component"
id: "akamai"
kind: "cdn"
provider: "default"
docs: "https://techdocs.akamai.com/"
defaults:
  managed: true
  edgeCompute: false
properties:
  prefetching:
    type: "boolean"
    default: false
