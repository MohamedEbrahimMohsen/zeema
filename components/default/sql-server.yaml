# yaml-language-server: $schema=../../schema/component.schema.json
# Microsoft SQL Server: single-primary relational database; Always On availability groups are opt-in.
# vectorSearch: the vector type and VECTOR_DISTANCE in SQL Server 2025, DiskANN vector indexes in preview ("Vector Search & Vector Index").
schemaVersion: "1"
type: "component"
id: "sql-server"
kind: "sql-database"
provider: "default"
docs: "https://learn.microsoft.com/en-us/sql/sql-server/"
aliases: ["MSSQL"]
defaults:
  replication: "none"
  concurrencyControl: "pessimistic"
properties:
  version:
    type: "string"
  alwaysOn:
    type: "boolean"
    default: false
  vectorSearch:
    type: "boolean"
    default: false
