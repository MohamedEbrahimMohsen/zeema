# yaml-language-server: $schema=../../schema/component.schema.json
# YugabyteDB: distributed SQL database. Tables are sharded into tablets, each tablet synchronously
# replicated by Raft at the default replication factor of 3 (YugabyteDB "Replication in DocDB").
schemaVersion: "1"
type: "component"
id: "yugabytedb"
kind: "sql-database"
provider: "default"
docs: "https://docs.yugabyte.com/stable/architecture/docdb-replication/replication/"
defaults:
  distributed: true
  sharded: true
  multiWriter: true
  replication: "sync"
  replicaFanout: 3
  commitProtocol: "two-phase"
  encryptionAtRest: false
properties:
  version:
    type: "string"
  apiLayer:
    type: "enum"
    values: ["ysql", "ycql"]
    default: "ysql"
