# yaml-language-server: $schema=../../schema/component.schema.json
# Databricks: managed lakehouse platform whose classic compute is a Spark cluster of driver and workers.
# Defaults from "Compute" and "Configure compute": access mode Auto, multi-node, autoscaling and
# spot instances off until enabled, Photon on from Databricks Runtime 9.1 LTS. mosaicAi says the workspace
# uses Mosaic AI (Model Serving, Agent Framework, Vector Search, AutoML), Databricks' AI layer; off until stated.
schemaVersion: "1"
type: "component"
id: "databricks"
kind: "big-data-cluster"
provider: "default"
docs: "https://docs.databricks.com/aws/en/compute/configure"
defaults:
  engine: "spark"
  autoscaling: false
  spotInstances: false
  managed: true
properties:
  computeType:
    type: "enum"
    values: ["all-purpose", "job", "serverless"]
  accessMode:
    type: "enum"
    values: ["auto", "standard", "dedicated"]
    default: "auto"
  photon:
    type: "boolean"
    default: true
  singleNode:
    type: "boolean"
    default: false
  mosaicAi:
    type: "boolean"
    default: false
