# yaml-language-server: $schema=../../schema/component.schema.json
# llama.cpp server (llama-server): the HTTP server shipped with llama.cpp, serving GGUF models on CPU or GPU with
# OpenAI-compatible chat, completion and embedding routes. Per the server README it listens on 127.0.0.1:8080, sizes
# its parallel slots automatically and needs no API key unless --api-key is set.
schemaVersion: "1"
type: "component"
id: "llama-cpp-server"
kind: "ml-inference"
provider: "default"
docs: "https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md"
aliases: ["llama-server", "llama.cpp"]
defaults:
  training: "batch"
  inputs: "live"
  managed: false
properties:
  port:
    type: "integer"
    default: 8080
  localhostOnly:
    type: "boolean"
    default: true
  apiKeyRequired:
    type: "boolean"
    default: false
  parallelSlots:
    type: "integer"
