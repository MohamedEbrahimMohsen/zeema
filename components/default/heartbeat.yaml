# yaml-language-server: $schema=../../schema/component.schema.json
# Heartbeat: a lightweight daemon deployed on remote hosts that actively probes services on a schedule
# and "tells you whether your services are reachable". Monitors are icmp, tcp or http; because it
# probes from outside the service it observes, it stays up when the service does not ("Heartbeat").
schemaVersion: "1"
type: "component"
id: "heartbeat"
kind: "monitoring"
provider: "default"
docs: "https://www.elastic.co/guide/en/beats/heartbeat/current/index.html"
defaults:
  managed: false
  signal: "metrics"
  collectorMode: "pull"
  independentOfMonitored: true
properties:
  monitorType:
    type: "enum"
    values: ["icmp", "tcp", "http"]
  responseValidation:
    type: "boolean"
    default: false
  output:
    type: "enum"
    values: ["elasticsearch", "logstash"]
