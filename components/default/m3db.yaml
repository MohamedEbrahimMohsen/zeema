# yaml-language-server: $schema=../../schema/component.schema.json
# M3DB: Uber's distributed TSDB with M3TSZ compression and three-way replication; downsampling
# needs the aggregator.
schemaVersion: "1"
type: "component"
id: "m3db"
kind: "timeseries-database"
provider: "default"
docs: "https://m3db.io/docs/"
defaults:
  downsampling: false
  tiers: "single"
  labelIndex: true
  compression: "gorilla"
  managed: false
properties:
  replicationFactor:
    type: "integer"
    default: 3
