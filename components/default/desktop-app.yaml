# yaml-language-server: $schema=../../schema/component.schema.json
# Desktop application client: local cache, updates are manual unless auto-update is built in.
schemaVersion: "1"
type: "component"
id: "desktop-app"
kind: "client"
provider: "default"
defaults:
  platform: "desktop"
  localCache: true
properties:
  autoUpdate:
    type: "boolean"
    default: false
