# yaml-language-server: $schema=../../schema/component.schema.json
# WildFly: open source Jakarta EE 10 application server. The "Getting Started Guide" states the server is
# started standalone by default with standalone.xml, which is the Jakarta Web Profile certified
# configuration and carries no high-availability subsystems; the HTTP listener binds port 8080.
# Clustering needs standalone-ha.xml or standalone-full-ha.xml.
schemaVersion: "1"
type: "component"
id: "wildfly"
kind: "app-server"
provider: "default"
docs: "https://docs.wildfly.org/36/Getting_Started_Guide.html"
defaults:
  managed: false
  runtime: "jvm"
properties:
  operatingMode:
    type: "enum"
    values: ["standalone", "domain"]
    default: "standalone"
  configurationProfile:
    type: "enum"
    values: ["standalone", "standalone-ha", "standalone-full", "standalone-full-ha"]
    default: "standalone"
  clustering:
    type: "boolean"
    default: false
  httpPort:
    type: "integer"
    default: 8080
