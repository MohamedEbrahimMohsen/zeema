# yaml-language-server: $schema=../../schema/component.schema.json
# Plain Envoy sidecars driven by a custom xDS control plane: nothing on by default.
schemaVersion: "1"
type: "component"
id: "envoy-sidecar"
kind: "service-mesh"
provider: "default"
defaults:
  managed: false
  sidecar: true
  mtls: false
  retries: false
properties:
  xds:
    type: "boolean"
    default: true
