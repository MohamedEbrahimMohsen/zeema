# yaml-language-server: $schema=../../schema/component.schema.json
# Socket.IO server: WebSocket with long-poll fallback. Multi-node needs an adapter (default in-memory) and sticky sessions.
schemaVersion: "1"
type: "component"
id: "socket-io-server"
kind: "realtime-gateway"
provider: "default"
defaults:
  protocol: "websocket"
  stateful: true
properties:
  transportFallback:
    type: "boolean"
    default: true
  adapter:
    type: "enum"
    values: ["in-memory", "redis", "mongo", "postgres"]
    default: "in-memory"
