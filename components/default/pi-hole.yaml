# yaml-language-server: $schema=../../schema/component.schema.json
# Pi-hole: DNS sinkhole for a local network. It forwards queries upstream through its embedded
# FTLDNS resolver and answers blocklisted names itself. Per the Pi-hole documentation the built-in
# DHCP server and DNSSEC validation are both off until switched on in settings.
schemaVersion: "1"
type: "component"
id: "pi-hole"
kind: "dns"
provider: "default"
docs: "https://docs.pi-hole.net/"
defaults:
  managed: false
  anycast: false
  geoRouting: false
properties:
  blocklistFiltering:
    type: "boolean"
    default: true
  dnssecValidation:
    type: "boolean"
    default: false
  dhcpServer:
    type: "boolean"
    default: false
