# yaml-language-server: $schema=../../schema/component.schema.json
# SingleStore: distributed relational database that shards data into partitions across leaf nodes
# behind aggregators; replication from primary to replica partitions is synchronous by default (SingleStore "Replication").
# vectorSearch: the VECTOR type with ANN vector indexes and DOT_PRODUCT / EUCLIDEAN_DISTANCE ("Working with Vector Data").
schemaVersion: "1"
type: "component"
id: "singlestore"
kind: "sql-database"
provider: "default"
docs: "https://docs.singlestore.com/db/v9.1/user-and-cluster-administration/high-availability-and-disaster-recovery/replication-and-durability-concepts/replication/"
aliases: ["MemSQL"]
defaults:
  distributed: true
  sharded: true
  replication: "sync"
properties:
  version:
    type: "string"
  deployment:
    type: "enum"
    values: ["self-managed", "helios"]
    default: "self-managed"
  vectorSearch:
    type: "boolean"
    default: false
