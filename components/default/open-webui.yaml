# yaml-language-server: $schema=../../schema/component.schema.json
# Open WebUI: self-hosted web chat interface for Ollama and OpenAI-compatible model servers, with RAG, tools and users.
# Per "Environment Variable Configuration", it serves on port 8080 in the container, stores data in SQLite unless
# DATABASE_URL points at PostgreSQL, uses Chroma as the vector store by default, and makes new users "pending" until
# an admin activates them.
schemaVersion: "1"
type: "component"
id: "open-webui"
kind: "app-server"
provider: "default"
docs: "https://docs.openwebui.com/reference/env-configuration/"
defaults:
  managed: false
  stateless: false
  runtime: "python"
properties:
  port:
    type: "integer"
    default: 8080
  database:
    type: "enum"
    values: ["sqlite", "postgres"]
    default: "sqlite"
  vectorDb:
    type: "enum"
    values: ["chroma", "pgvector", "qdrant", "milvus", "opensearch", "elasticsearch"]
    default: "chroma"
  defaultUserRole:
    type: "enum"
    values: ["pending", "user", "admin"]
    default: "pending"
  webuiAuth:
    type: "boolean"
    default: true
