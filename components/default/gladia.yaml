# yaml-language-server: $schema=../../schema/component.schema.json
# Gladia: hosted speech to text API for pre-recorded files and live streams. Per "Concurrency", the free plan runs 3
# pre-recorded jobs and 1 live session at a time and paid plans 25 jobs and 30 sessions, beyond which the API returns
# 429; a single live session cannot exceed 3 hours.
schemaVersion: "1"
type: "component"
id: "gladia"
kind: "ai-service"
provider: "default"
docs: "https://docs.gladia.io/chapters/limits-and-specifications/concurrency"
defaults:
  auth: "api-key"
  managed: true
  modality: "speech"
  publicEndpoint: true
properties:
  plan:
    type: "enum"
    values: ["free", "paid", "enterprise"]
    default: "free"
  mode:
    type: "enum"
    values: ["pre-recorded", "live"]
    default: "pre-recorded"
  concurrentJobs:
    type: "integer"
    default: 3
  liveSessions:
    type: "integer"
    default: 1
