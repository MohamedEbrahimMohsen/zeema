# yaml-language-server: $schema=../../schema/component.schema.json
# Istio: sidecar mesh with auto mTLS (permissive) and 2 default HTTP retries; circuit breaking via DestinationRule.
schemaVersion: "1"
type: "component"
id: "istio"
kind: "service-mesh"
provider: "default"
defaults:
  managed: false
  sidecar: true
  mtls: true
  retries: true
  circuitBreaking: false
properties:
  ambientMode:
    type: "boolean"
    default: false
