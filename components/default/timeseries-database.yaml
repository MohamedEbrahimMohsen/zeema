# yaml-language-server: $schema=../../schema/component.schema.json
# The vendor-neutral time-series database: the kind itself, with no product behind it. It sets no
# defaults and adds no properties, so every required kind property stays required on the node.
schemaVersion: "1"
type: "component"
id: "timeseries-database"
kind: "timeseries-database"
provider: "default"
