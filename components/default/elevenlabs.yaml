# yaml-language-server: $schema=../../schema/component.schema.json
# ElevenLabs: hosted speech API for text to speech, speech to text and voice cloning over a public endpoint.
# Per "Models", the subscription plan sets the number of concurrent requests and the queue priority, with
# 2 concurrent requests on the free plan for Multilingual v2 and 4 for the Flash models; per
# "Text to speech", the default response format is mp3.
schemaVersion: "1"
type: "component"
id: "elevenlabs"
kind: "ai-service"
provider: "default"
docs: "https://elevenlabs.io/docs/models"
defaults:
  auth: "api-key"
  managed: true
  modality: "speech"
  publicEndpoint: true
properties:
  plan:
    type: "enum"
    values: ["free", "starter", "creator", "pro", "scale", "business", "enterprise"]
    default: "free"
  concurrentRequests:
    type: "integer"
    default: 2
  outputFormat:
    type: "enum"
    values: ["mp3", "pcm", "ulaw", "alaw", "opus"]
    default: "mp3"
  streaming:
    type: "boolean"
    default: false
