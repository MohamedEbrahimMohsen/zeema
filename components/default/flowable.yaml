# yaml-language-server: $schema=../../schema/component.schema.json
# Flowable: Java BPMN 2.0 engine that persists process instance state in a relational database and
# connects to an in-memory H2 database by default ("Configuration"). BPMN compensation events and
# user tasks are supported constructs; failed async jobs are retried and then move to the deadletter.
schemaVersion: "1"
type: "component"
id: "flowable"
kind: "workflow-engine"
provider: "default"
defaults:
  durable: true
  pattern: "dag"
  compensation: true
  humanReview: true
  managed: false
properties:
  database:
    type: "enum"
    values: ["h2", "postgres", "mysql", "oracle", "sqlserver", "db2"]
    default: "h2"
  deadLetterJobs:
    type: "boolean"
    default: true
