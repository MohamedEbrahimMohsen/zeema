# yaml-language-server: $schema=../../schema/component.schema.json
# OpenStack Designate: multi-tenant DNSaaS with integrated Keystone authentication. Per "Welcome to Designate"
# it drives backend nameservers such as BIND9 and PowerDNS 4 rather than answering queries itself, and can
# auto-generate records from Nova and Neutron actions. Per "Managing pools" an installation has a single pool
# named default, so no multi-pool, anycast or health-checked posture is assumed.
schemaVersion: "1"
type: "component"
id: "openstack-designate"
kind: "dns"
provider: "openstack"
docs: "https://docs.openstack.org/designate/latest/"
defaults:
  managed: false
properties:
  backend:
    type: "enum"
    values: ["bind9", "pdns4", "infoblox"]
  multiPool:
    type: "boolean"
    default: false
  autoGeneratedRecords:
    type: "boolean"
    default: false
