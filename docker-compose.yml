# The whole platform on one machine: the app, its database, and the monitoring that watches
# both. Start with `docker compose up -d --build` after copying .env.example to .env.
#
# Data lives in named volumes, never inside a container. `docker compose down` and
# `docker compose rm` leave the volumes untouched; only `down -v` or an explicit
# `docker volume rm` destroys them.
#
# Only the app is published on every interface. Grafana, Prometheus and Postgres bind to
# localhost by default, so on a server they are reached through an SSH tunnel until you put
# them behind a reverse proxy with authentication.

name: zeema

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zeema}
      POSTGRES_USER: ${POSTGRES_USER:-zeema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Checksums catch silent corruption at read time rather than months later.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the data directory is first created.
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zeema} -d ${POSTGRES_DB:-zeema}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-zeema}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zeema}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ZEEMA_ADMINS: ${ZEEMA_ADMINS:-}
      # Required: production refuses to start on a missing or placeholder salt.
      EVENT_SALT: ${EVENT_SALT:?set EVENT_SALT in .env}
      # Reverse proxies in front of the app that append X-Forwarded-For. 0: the app is reached
      # directly, the header is ignored and anonymous callers share one rate-limit bucket.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-0}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN in .env}
      AUTO_SEED: ${AUTO_SEED:-1}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      LANDING_PORT: 4000
      # Where "Open Canvas" sends visitors: the app's public origin. Falls back to APP_ORIGIN.
      CANVAS_URL: ${CANVAS_URL:-${APP_ORIGIN:-http://localhost:3000}}
      # Where the landing server itself reads design and catalogue counts: the app over the
      # compose network.
      CANVAS_API_URL: http://web:3000
    ports:
      - "${LANDING_BIND:-0.0.0.0}:${LANDING_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    depends_on:
      - web
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    configs:
      - source: metrics_token
        target: /etc/prometheus/metrics-token
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-zeema}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zeema}?sslmode=disable

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Read by the provisioned datasource file, never written into it.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"

configs:
  # Written from the environment at start, so the token lives in .env alone and Prometheus
  # reads the same value the app checks.
  metrics_token:
    content: ${METRICS_TOKEN}

volumes:
  pgdata:
  prometheus:
  grafana:
