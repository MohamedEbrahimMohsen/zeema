rules:
  ai-api-key-unmanaged:
    name: "AI API key not managed"
    description: "An AI service is called with an API key from the team's own servers, workers or clients, the key is not held in a key-management component, and the design has none."
    rationale: "This AI vendor is reached with an API key, and nothing in the design holds or rotates that key. It ends up in environment files or code, every caller shares it, and a single leak runs up the vendor bill until someone notices. Put the key in a key-management component, or say it is held there with keyStore."
  ai-no-gateway:
    name: "Several AI vendors and no gateway"
    description: "The design calls three or more AI services and has no API gateway to route, retry and meter them."
    rationale: "With three or more AI vendors and no gateway, every caller holds every key, writes its own retries and fallbacks, and spend is spread across vendor dashboards. An AI gateway such as LiteLLM, Portkey or Cloudflare AI Gateway gives one place for keys, fallbacks, rate limits and cost."
  business-updates-without-index-propagation:
    name: "Database updates not propagated to the search index"
    description: "Application servers write a database and the design keeps a search index, but no change data capture leaves the database; index writes rely on dual writes."
    rationale: "Application servers write this database and the design keeps a search index, but nothing captures the database's changes. The index then depends on the application writing to both places, and the two drift apart silently."
  cache-as-primary-store-without-persistence:
    name: "Cache used as primary store without persistence"
    description: "A cache is the only copy of its data and has persistence disabled, so the data is lost on restart."
    rationale: "This cache is the only copy of its data and has persistence turned off. A restart loses the data outright."
  cache-missing-eviction-policy:
    name: "Cache without eviction policy"
    rationale: "A cache with no declared eviction policy inherits whatever the vendor chose, and most vendors default to evicting nothing. The cache fills up and then starts refusing writes."
  credentials-without-rotation:
    name: "Credentials without rotation"
    description: "The design holds data but declares no credential rotation period and has no key-management node."
    rationale: "The design stores data but says nothing about rotating the credentials that reach it, and it has no key-management node that would rotate them. A leaked credential stays valid forever."
  cross-cell-call:
    name: "Synchronous call across cells"
    description: "A synchronous edge crosses a cell boundary while the design requires cell isolation."
    rationale: "In a cell architecture each cell has to be able to fail on its own. A synchronous call that leaves the cell ties the two cells together and defeats the point of draining one."
  custom-node:
    name: "Custom node"
    description: "A node uses the custom kind, so the catalogue does not describe it and no rule can check anything about it."
    rationale: "A custom node is a hole in the model: the catalogue has no word for it, so no rule can check anything about it. It is meant to be temporary, and naming it in the catalogue closes the hole."
  custom-nodes-present:
    name: "Design has custom nodes"
    description: "The design places nodes the catalogue does not name; the rules are blind to that part of the architecture."
    rationale: "The design places nodes the catalogue does not name, so the rules are blind to that part of the architecture. The count belongs on the design, not only on the individual boxes."
  datastore-missing-backup:
    name: "Datastore without backup or retention"
    rationale: "A system of record with backups off, or with no retention period stated, cannot be restored. The loss is discovered on the day it matters."
  datastore-single-region:
    name: "Single-region datastore behind a multi-region SLA"
    rationale: "The design promises multi-region availability, but this datastore sits in one region and does not replicate. A region outage takes the system of record with it."
  derived-store-without-cdc-or-rebuild:
    name: "Search index without an asynchronous feed"
    description: "A search index has no asynchronous in-edge from a stream, change data capture or worker, so it cannot be rebuilt or kept in sync off the write path."
    rationale: "A search index is derived data and needs an asynchronous feed from a stream, change data capture or an indexing worker. Without one it is written inline on the request path, and it can never be rebuilt after it drifts."
  edge-auth-key-where-identity:
    name: "Key where an identity would do"
    description: "An edge into an Azure, AWS or Google Cloud service authenticates with an API key or a password."
    rationale: "The cloud behind this hop can authenticate the caller by an identity it never holds: a managed identity on Azure, an IAM role on AWS, a service account on Google Cloud. A key or a password has to be stored, rotated and kept out of logs, and a leaked one works from anywhere. Switch the edge's auth to the platform's identity."
  edge-auth-unset:
    name: "Edge authentication not stated"
    description: "The design requires every hop into data, secrets, queues and AI to say how it authenticates, and an edge into one of them has no auth."
    rationale: "How a caller proves who it is decides what a leak costs: a password or a key in configuration can be copied and used from anywhere, a managed identity or an IAM role cannot. With security.edgeAuthDeclared set, the design has promised to say which on every such hop. Set auth on this edge: managed-identity, iam-role, service-account, workload-identity, api-key, oauth, mtls, basic or none."
  exactly-once-with-external-side-effects:
    name: "Exactly-once delivery in front of an external side effect"
    description: "An edge claims exactly-once delivery to a node that then calls a third party synchronously, which exactly-once cannot cover."
    rationale: "Exactly-once delivery stops at the consumer. When that consumer then calls a third party synchronously, the side effect sits outside the transaction and can still happen twice, so the exactly-once claim hides the need for an idempotent external call."
  external-call-inline-without-durable-path:
    name: "Inline external call without durable fallback"
    description: "A service calls a third party synchronously and has no queue or workflow engine to hand the request to on failure."
    rationale: "A service that calls a third party synchronously, with no queue or workflow engine attached, has nowhere to park the request when the third party is slow or down. The failure becomes the user's problem instead of a retried job."
  fanout-inline-in-request-path:
    name: "Fan-out inline in the request path"
    description: "An application server calls a worker synchronously, so the request waits for background work such as fan-out."
    rationale: "Calling a worker synchronously puts the background job on the request path. The caller waits for the slowest part of the fan-out."
  materialised-cache-without-rebuild-path:
    name: "Materialised cache without a rebuild path"
    description: "A cache holds materialised data but has no in-edge from a durable store, worker or stream that could rebuild it."
    rationale: "A cache holding materialised views has to be rebuildable from a durable store or a worker. With nothing feeding it, a cold cache is a permanent gap rather than a slow start."
  money-mutation-without-idempotency-key:
    name: "Money mutation without idempotency key"
    description: "An edge into a money-handling third party or a double-entry ledger declares no idempotency while the design requires exactly-once effect."
    rationale: "A call that moves money is retried after a lost response. Without an idempotency key on that hop the retry becomes a second charge, which is exactly what the design's exactly-once-effect promise rules out."
  money-store-without-double-entry-ledger:
    name: "Money store without double-entry ledger"
    description: "The design requires zero-sum money movement but contains no ledger node."
    rationale: "The design promises that money movements sum to zero, but it has no ledger to enforce double entry. Balances kept in an ordinary table drift and cannot be audited."
  multi-leader-store-without-conflict-policy:
    name: "Multi-leader store without a conflict policy"
    description: "A NoSQL store replicates multi-region multi-leader but declares no conflict resolution policy."
    rationale: "Multi-leader replication accepts concurrent writes in several regions. With no conflict resolution policy declared, divergent replicas are reconciled by accident rather than by design."
  object-store-single-zone-with-durability-target:
    name: "Object store in fewer than three zones with a durability target"
    description: "An object store spans fewer than three zones, or declares none, while the design targets more than ten nines of annual durability."
    rationale: "Eleven nines of durability assumes redundancy spread over at least three failure domains. An object store confined to fewer zones, or declaring none, cannot reach the target the design states."
  pubsub-replay-required:
    name: "Pub/Sub topic where replay is required"
    rationale: "The design declares that consumers must be able to replay history. A fan-out topic that does not retain messages cannot deliver that."
  push-fanout-without-celebrity-path:
    name: "Push fan-out without a celebrity threshold"
    description: "A worker pushes fan-out over a social graph with no follower threshold above which timelines are merged at read time."
    rationale: "Pure push fan-out over a social graph is brutal at the tail: one post from an account with millions of followers becomes millions of cache writes. A follower threshold above which readers merge at read time bounds that write amplification."
  queue-missing-dlq:
    name: "Queue without dead-letter queue"
    rationale: "A queue that receives asynchronous traffic and has no dead-letter queue either drops poison messages or retries them forever. Neither outcome leaves anything for a human to investigate."
  read-heavy-path-without-cache:
    name: "Read-heavy datastore without a cache"
    description: "The design states a read-heavy workload and application servers read a datastore directly, but no cache exists."
    rationale: "The design states a read-heavy workload and application servers read this datastore directly, yet the design has no cache anywhere. Every read pays a database round trip."
  read-replica-as-sole-scaling:
    name: "Read replicas as the only scaling"
    description: "An SQL database above 5000 rps relies on async replicas alone; it is neither sharded nor distributed, so writes still hit one primary."
    rationale: "Asynchronous read replicas scale reads only. When the store is neither sharded nor distributed the writes still land on one primary, so the replicas add nothing at the declared peak."
  reconnect-stampede-without-guard:
    name: "Reconnect stampede without guard"
    description: "A realtime gateway calls a coordination service synchronously on connect and has no guard against a mass reconnect."
    rationale: "When a gateway holding millions of sockets restarts, every client reconnects at once and the gateway asks the coordination service about each of them. Without a stampede guard that lookup storm takes the coordination service down too."
  retry-queue-without-dlq:
    name: "Retry queue without dead-letter queue"
    description: "A queue in the retry role has no dead-letter queue, so poison messages are retried forever or dropped."
    rationale: "A retry queue is where poison messages end up. With no dead-letter queue they are retried forever or dropped in silence, and nobody ever looks at the failed payment."
  retry-without-adaptive-shedding:
    name: "Retry without circuit breaker or load shedding"
    description: "An edge retries into a service with no circuit breaker on the caller and no rate limiter in front of the callee."
    rationale: "Retries into a service that can neither shed load nor have its circuit opened produce a metastable failure: the retries keep the dependency saturated long after the original fault is gone. Either break the circuit at the caller or put an adaptive limiter in front of the callee."
  retry-without-backoff:
    name: "Retry queue without backoff"
    description: "A queue in the retry role declares no backoff, so retries hammer the failing dependency."
    rationale: "Retrying a transient failure at full speed turns one slow dependency into a retry storm. A retry queue backs off, preferably exponentially and with jitter."
  shared-dependency-without-redundancy:
    name: "Shared dependency without redundancy"
    description: "The design requires redundant discovery, but a DNS or coordination service has a single provider or is not replicated."
    rationale: "The design requires redundant discovery, but this DNS or coordination service, which everything depends on, runs on a single provider or a single replica. Its failure is the whole system's failure."
  shared-host-per-channel-without-isolation:
    name: "Random channel placement under heavy-tail traffic"
    description: "A realtime gateway assigns channels to hosts at random while the design declares heavy-tail traffic, so hot channels degrade unrelated tenants."
    rationale: "With heavy-tail traffic a few channels carry most of the load. Assigning channels at random lands those hot channels on arbitrary hosts, and every tenant sharing a host suffers for it."
  shared-worker-pool-across-queues:
    name: "Shared worker pool across queues"
    description: "One worker consumes more than one queue while the design requires per-queue isolation."
    rationale: "One worker pool consuming several queues lets a slow or poisoned queue starve the others. That is precisely what the design's per-queue isolation requirement forbids."
  single-writer-primary-at-peak-qps:
    name: "Single-writer primary at peak QPS"
    description: "An unsharded single-writer SQL database is declared at more than 5000 requests per second."
    rationale: "A single-writer, unsharded relational primary has a throughput ceiling. Declaring more than five thousand requests per second against it means the peak finds that ceiling in production."
  stateful-engine-pinned-to-single-zone:
    name: "Stateful engine pinned to a single zone"
    description: "A matching engine, coordination service or event store sits in exactly one availability zone with no failover or replication."
    rationale: "A matching engine, coordination service or event store living in exactly one availability zone, with no failover and no replication, is lost with that zone. Everything that depends on it stops with it."
  stateful-hash-ring-without-ring-manager:
    name: "Stateful hash ring without ring manager"
    description: "A service on a consistent hash ring is not connected to a coordination service that owns the ring."
    rationale: "A stateful service on a consistent hash ring needs something that owns the ring: detect a dead host, pick a replacement, tell everyone. Without a coordination service the ring is edited by hand during the outage."
  stateful-node-without-zone-redundancy:
    name: "Stateful node without zone redundancy"
    description: "A stateful compute node lives in exactly one availability zone and is not part of a cell."
    rationale: "A stateful compute node pinned to exactly one availability zone disappears with that zone, and its state goes with it. Nodes inside a cell are exempt, because there the cell is deliberately single-zone and redundancy comes from the other cells."
  stateful-websocket-scale-in-without-drain:
    name: "Stateful WebSocket scale-in without drain"
    description: "An autoscaling realtime gateway does not drain connections when scaling in, so every scale-down is a reconnect storm."
    rationale: "Scaling a gateway down kills every live WebSocket on the removed instance at once. Without a drain step those clients all reconnect together."
  sync-chain-too-deep:
    name: "Synchronous call chain too deep"
    rationale: "Every consecutive synchronous hop from this entry point spends part of the stated p95 latency budget, and the chain's failures multiply. More than three hops is a budget nobody is tracking."
  webhook-without-signature-or-idempotency:
    name: "Webhook without signature verification or idempotency"
    description: "A webhook endpoint accepts callbacks without verifying the caller's signature or without deduplicating retried events."
    rationale: "A webhook is a public endpoint that its caller retries. Without signature verification anyone can post a fake event; without idempotency the provider's own retries apply the same event twice."
  windowed-aggregation-without-watermark:
    name: "Event-time windows without watermark"
    description: "A stream processor windows by event time but declares no watermark, so window completion and late data are undefined."
    rationale: "Event-time windows need a watermark to know when a window is complete. Without one the processor either waits forever or closes windows early and silently drops late events."

