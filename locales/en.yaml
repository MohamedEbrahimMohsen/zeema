rules:
  business-updates-without-index-propagation:
    name: "Database updates not propagated to the search index"
    description: "Application servers write a database and the design keeps a search index, but no change data capture leaves the database; index writes rely on dual writes."
  cache-as-primary-store-without-persistence:
    name: "Cache used as primary store without persistence"
    description: "A cache is the only copy of its data and has persistence disabled, so the data is lost on restart."
  cache-missing-eviction-policy:
    name: "Cache without eviction policy"
  credentials-without-rotation:
    name: "Credentials without rotation"
    description: "The design holds data but declares no credential rotation period and has no key-management node."
  cross-cell-call:
    name: "Synchronous call across cells"
    description: "A synchronous edge crosses a cell boundary while the design requires cell isolation."
  datastore-missing-backup:
    name: "Datastore without backup or retention"
  datastore-single-region:
    name: "Single-region datastore behind a multi-region SLA"
  derived-store-without-cdc-or-rebuild:
    name: "Search index without an asynchronous feed"
    description: "A search index has no asynchronous in-edge from a stream, change data capture or worker, so it cannot be rebuilt or kept in sync off the write path."
  exactly-once-with-external-side-effects:
    name: "Exactly-once delivery in front of an external side effect"
    description: "An edge claims exactly-once delivery to a node that then calls a third party synchronously, which exactly-once cannot cover."
  external-call-inline-without-durable-path:
    name: "Inline external call without durable fallback"
    description: "A service calls a third party synchronously and has no queue or workflow engine to hand the request to on failure."
  fanout-inline-in-request-path:
    name: "Fan-out inline in the request path"
    description: "An application server calls a worker synchronously, so the request waits for background work such as fan-out."
  materialised-cache-without-rebuild-path:
    name: "Materialised cache without a rebuild path"
    description: "A cache holds materialised data but has no in-edge from a durable store, worker or stream that could rebuild it."
  money-mutation-without-idempotency-key:
    name: "Money mutation without idempotency key"
    description: "An edge into a money-handling third party or a double-entry ledger declares no idempotency while the design requires exactly-once effect."
  money-store-without-double-entry-ledger:
    name: "Money store without double-entry ledger"
    description: "The design requires zero-sum money movement but contains no ledger node."
  multi-leader-store-without-conflict-policy:
    name: "Multi-leader store without a conflict policy"
    description: "A NoSQL store replicates multi-region multi-leader but declares no conflict resolution policy."
  object-store-single-zone-with-durability-target:
    name: "Object store in fewer than three zones with a durability target"
    description: "An object store spans fewer than three zones, or declares none, while the design targets more than ten nines of annual durability."
  pubsub-replay-required:
    name: "Pub/Sub topic where replay is required"
  push-fanout-without-celebrity-path:
    name: "Push fan-out without a celebrity threshold"
    description: "A worker pushes fan-out over a social graph with no follower threshold above which timelines are merged at read time."
  queue-missing-dlq:
    name: "Queue without dead-letter queue"
  read-heavy-path-without-cache:
    name: "Read-heavy datastore without a cache"
    description: "The design states a read-heavy workload and application servers read a datastore directly, but no cache exists."
  read-replica-as-sole-scaling:
    name: "Read replicas as the only scaling"
    description: "An SQL database above 5000 rps relies on async replicas alone; it is neither sharded nor distributed, so writes still hit one primary."
  reconnect-stampede-without-guard:
    name: "Reconnect stampede without guard"
    description: "A realtime gateway calls a coordination service synchronously on connect and has no guard against a mass reconnect."
  retry-queue-without-dlq:
    name: "Retry queue without dead-letter queue"
    description: "A queue in the retry role has no dead-letter queue, so poison messages are retried forever or dropped."
  retry-without-adaptive-shedding:
    name: "Retry without circuit breaker or load shedding"
    description: "An edge retries into a service with no circuit breaker on the caller and no rate limiter in front of the callee."
  retry-without-backoff:
    name: "Retry queue without backoff"
    description: "A queue in the retry role declares no backoff, so retries hammer the failing dependency."
  shared-dependency-without-redundancy:
    name: "Shared dependency without redundancy"
    description: "The design requires redundant discovery, but a DNS or coordination service has a single provider or is not replicated."
  shared-host-per-channel-without-isolation:
    name: "Random channel placement under heavy-tail traffic"
    description: "A realtime gateway assigns channels to hosts at random while the design declares heavy-tail traffic, so hot channels degrade unrelated tenants."
  shared-worker-pool-across-queues:
    name: "Shared worker pool across queues"
    description: "One worker consumes more than one queue while the design requires per-queue isolation."
  single-writer-primary-at-peak-qps:
    name: "Single-writer primary at peak QPS"
    description: "An unsharded single-writer SQL database is declared at more than 5000 requests per second."
  stateful-engine-pinned-to-single-zone:
    name: "Stateful engine pinned to a single zone"
    description: "A matching engine, coordination service or event store sits in exactly one availability zone with no failover or replication."
  stateful-hash-ring-without-ring-manager:
    name: "Stateful hash ring without ring manager"
    description: "A service on a consistent hash ring is not connected to a coordination service that owns the ring."
  stateful-node-without-zone-redundancy:
    name: "Stateful node without zone redundancy"
    description: "A stateful compute node lives in exactly one availability zone and is not part of a cell."
  stateful-websocket-scale-in-without-drain:
    name: "Stateful WebSocket scale-in without drain"
    description: "An autoscaling realtime gateway does not drain connections when scaling in, so every scale-down is a reconnect storm."
  sync-chain-too-deep:
    name: "Synchronous call chain too deep"
  webhook-without-signature-or-idempotency:
    name: "Webhook without signature verification or idempotency"
    description: "A webhook endpoint accepts callbacks without verifying the caller's signature or without deduplicating retried events."
  windowed-aggregation-without-watermark:
    name: "Event-time windows without watermark"
    description: "A stream processor windows by event time but declares no watermark, so window completion and late data are undefined."
